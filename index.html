                      {game.analysisResult && <ResultBanner game={game} />}
                      {meta.bankroll > 0 ? (
                        <>
                          <div style={styles.victoryStatsSub}>남은 뱅크롤: {meta.bankroll.toLocaleString()}</div>
                          <button style={{ ...styles.primaryBtn, marginTop: 16 }} onClick={handleLeaveTable}>바이인 화면으로</button>
                        </>
                      ) : (
                        <>
                          <div style={styles.gameOverText}>뱅크롤도 모두 소진되었습니다</div>
                          <button style={{ ...styles.primaryBtn, marginTop: 16 }} onClick={handleFullReset}>뱅크롤 초기화하고 다시 시작</button>
                        </>
                      )}
                    </div>
                  )}

                  {game.started && (game.phase === "preflop" || game.phase === "flop" || game.phase === "turn" || game.phase === "river") && (
                    <div style={styles.actionsGrid}>
                      <div style={styles.actionInfo}>
                        {game.awaitingUser
                          ? toCall > 0 ? (userCanRaise ? `콜 금액: ${toCall}` : `콜 금액: ${toCall} (미달 올인으로 레이즈 불가)`) : "체크 가능"
                          : "다른 플레이어 대기 중..."}
                      </div>

                      {practiceMode && (practiceDrawInfo || practiceChenScore !== null) && (
                        <div style={{ ...styles.practiceBox, ...(game.awaitingUser ? {} : styles.practiceBoxWaiting) }}>
                          <div style={styles.practiceRow}>
                            <span style={styles.practiceLabel}>팟오즈{!game.awaitingUser && " (현재 기준)"}</span>
                            <span style={styles.practiceValue}>
                              {livePracticeToCall > 0 ? `${(practicePotOdds * 100).toFixed(1)}%` : "베팅 없음(체크 가능)"}
                            </span>
                          </div>
                          {/* 💡 수정: 프리플랍은 아웃츠/적중확률/SPR/블로커 대신 홀카드 상위%와 추천 액션을 보여준다
                              (커뮤니티 카드가 없어서 그 지표들 자체가 성립하지 않음) */}
                          {game.phase === "preflop" ? (
                            <>
                              <div style={styles.practiceRow}>
                                <span style={styles.practiceLabel}>홀카드 상위</span>
                                <span style={styles.practiceValue}>
                                  {practiceTopPercent !== null ? `상위 ${practiceTopPercent}%` : "—"}
                                </span>
                              </div>
                              <div style={styles.practiceRow}>
                                <span style={styles.practiceLabel}>추천 액션</span>
                                <span style={styles.practiceValue}>{practicePreflopRecommendation || "—"}</span>
                              </div>
                            </>
                          ) : (
                            <>
                              <div style={styles.practiceRow}>
                                <span style={styles.practiceLabel}>아웃츠</span>
                                <span style={styles.practiceValue}>
                                  {practiceDrawInfo.outs > 0 ? `${practiceDrawInfo.outs}장 (${practiceDrawInfo.drawType})` : practiceDrawInfo.drawType}
                                </span>
                              </div>
                              <div style={styles.practiceRow}>
                                <span style={styles.practiceLabel}>적중확률</span>
                                <span style={styles.practiceValue}>{(practiceDrawInfo.hitChance * 100).toFixed(1)}%</span>
                              </div>
                              <div style={styles.practiceRow}>
                                <span style={styles.practiceLabel}>SPR</span>
                                <span style={styles.practiceValue}>
                                  {practiceSprInfo.spr !== null ? `${practiceSprInfo.spr.toFixed(1)} (${practiceSprInfo.label})` : "—"}
                                </span>
                              </div>
                              {practiceBlockers && practiceBlockers.blockerNote && (
                                <div style={styles.practiceRow}>
                                  <span style={styles.practiceLabel}>블로커</span>
                                  <span style={styles.practiceValue}>{practiceBlockers.blockerNote}</span>
                                </div>
                              )}
                            </>
                          )}
                          <div style={styles.practiceRow}>
                            <span style={styles.practiceLabel}>포지션</span>
                            <span style={styles.practiceValue}>{practicePositionInfo.label}</span>
                          </div>
                          {practiceTableDynamics.label && (
                            <div style={styles.practiceRow}>
                              <span style={styles.practiceLabel}>테이블</span>
                              <span style={styles.practiceValue}>{practiceTableDynamics.label}</span>
                            </div>
                          )}
                        </div>
                      )}

                      {/* 💡 새로운 세로형 칩 컨트롤 UI */}
                      <div style={styles.betControlWrap}>
                        <div style={styles.betAmountDisplay}>
                          <span style={styles.betAmountLabel}>{toCall > 0 ? "레이즈(추가) 금액" : "베팅 금액"}</span>
                          <span style={styles.betAmountValue}>{betAmount.toLocaleString()}</span>
                          {/* 💡 추가: 레이즈 상황일 때 아래에 총 지불 금액 표시 */}
                          {toCall > 0 && (
                            <span style={{ fontSize: 13, color: "#D9B95C", marginTop: 6, fontWeight: 700, fontFamily: "'Courier New', monospace" }}>
                              총 지불: {(toCall + betAmount).toLocaleString()}
                            </span>
                          )}
                        </div>

                        {/* 💡 수정: 칩 단위를 고정값([100,500,1000,10000]) 대신 현재 BB 기준 배수로 동적
                            계산. BB=100일 땐 기존과 완전히 같은 값([100,500,1000,10000])이 나오지만,
                            바이인이 커져서 BB가 올라가면 단위도 같이 커져서 100만원대 바이인에서도
                            큰 단위로 빠르게 베팅액을 조절할 수 있다. */}
                        <div style={styles.chipColumnsWrap}>
                          {[game.bb, game.bb * 5, game.bb * 10, game.bb * 100].map(chip => (
                            <div key={chip} style={styles.chipColumn}>
                              <button
                                style={styles.chipBtn}
                                disabled={!game.awaitingUser || betAmount >= maxBet}
                                onClick={() => setBetAmount(a => Math.min(maxBet, a + chip))}
                              >
                                +
                              </button>
                              <div style={styles.chipLabel}>{chip.toLocaleString()}</div>
                              <button
                                style={styles.chipBtn}
                                disabled={!game.awaitingUser || betAmount <= uiMinBet}
                                onClick={() => setBetAmount(a => Math.max(uiMinBet, a - chip))}
                              >
                                −
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div style={styles.actionButtons}>
                        <button
                          style={{ ...styles.actionBtn, ...styles.foldBtn }}
                          disabled={!game.awaitingUser}
                          onClick={() => onUserAction("fold")}
                        >
                          폴드
                        </button>
                        <button
                          style={{ ...styles.actionBtn, ...styles.checkBtn }}
                          disabled={!game.awaitingUser}
                          onClick={() => onUserAction(toCall > 0 ? "call" : "check")}
                        >
                          {toCall > 0
                            ? (userChips <= toCall ? `올인 콜 (${userChips.toLocaleString()})` : `콜 (${toCall.toLocaleString()})`)
                            : "체크"}
                        </button>
                        <button
                          style={{ ...styles.actionBtn, ...styles.betBtn }}
                          disabled={!game.awaitingUser || !userCanRaise || userChips <= toCall}
                          onClick={() => onUserBet(betAmount)}
                        >
                          {toCall > 0 ? `레이즈 (총 ${(toCall + betAmount).toLocaleString()})` : `베팅 ${betAmount.toLocaleString()}`}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <aside style={styles.logPanel}>
                <div style={styles.logTitle}>진행 기록</div>
                <div style={styles.logBody} ref={logEndRef}>
                  {game.log.map((l, i) => (
                    <div key={i} style={styles.logLine}>{l}</div>
                  ))}
                  {game.log.length === 0 && <div style={styles.logEmpty}>기록이 여기에 표시됩니다.</div>}
                </div>
              </aside>
            </div>
          </div>
          {modalOverlay}
        </div>
      );
    }
    function AiSeat({ id, game, onRejoin, canRejoin }) {
      const folded = game.folded[id];
      const eliminated = game.eliminated[id];
      const showCards = (game.phase === "showdown" && !folded) || game.revealCards;
      const hole = game.hole[id];
      const isCurrent = game.currentActor === id;
      // 💡 추가: 이 좌석이 현재 딜러 버튼인지 확인 (게임이 시작된 후에만 의미가 있음)
      const isButton = game.started && game.players[game.buttonIndex] === id;
      // 💡 추가: 표준 포지션 이름(UTG/CO/BTN 등) - 탈락한 좌석은 표시하지 않음
      const positionName = (game.started && !eliminated) ? getPositionName(id, game.players, game.buttonIndex) : null;

      // 💡 승리자 여부 및 획득 금액 확인 로직
      const winAmount = game.handWinners ? (game.handWinners[id] || 0) : 0;
      const isWinner = winAmount > 0 && (game.phase === "showdown" || game.phase === "foldwin");

      return (
        <div style={{ position: "relative" }}>
          {/* 💡 추가: 딜러 버튼 마커 - 좌석 박스 오른쪽 위 모서리에 [D] 배지 */}
          {isButton && <div style={styles.dealerButton}>D</div>}
          <div style={{
            ...styles.aiSeat,
            opacity: eliminated ? 0.35 : folded ? 0.55 : 1,
            ...(isCurrent ? styles.activeActor : {}),
            ...(isWinner ? styles.winnerGlow : {}), // 황금빛 테두리 효과
            position: "relative" // 배지 위치를 잡기 위해 추가
          }}>
            {/* 💡 AI 승리 배지 (박스 하단 중앙) */}
            {isWinner && (
              <div style={{ ...styles.winBadge, bottom: -14, left: "50%", transform: "translateX(-50%)" }}>
                +{winAmount.toLocaleString()}
              </div>
            )}

            <div style={styles.seatName}>
              {game.names[id]}
              {positionName && <span style={styles.positionTag}>{positionName}</span>}
            </div>
            <div style={styles.seatChips}>칩 {(game.chips[id] || 0).toLocaleString()}</div>
            <div style={styles.aiCards}>
              {hole ? hole.map((c, i) => (
                <CardView key={i} card={showCards ? c : undefined} back={!showCards} small />
              )) : (eliminated || !game.started) ? (
                <>
                  <CardView placeholder small />
                  <CardView placeholder small />
                </>
              ) : (
                <>
                  <CardView back small />
                  <CardView back small />
                </>
              )}
            </div>
            {folded && !isWinner && <div style={styles.badBadge}>폴드</div>}
            {eliminated && <div style={styles.badBadge}>탈락</div>}
            {!folded && !eliminated && !isWinner && game.lastAction[id] && (
              <div style={styles.actionBadge}>{game.lastAction[id]}</div>
            )}
          </div>

          {/* 💡 수정: '새 AI 참가' 버튼을 좌석 박스(opacity 0.35 적용됨) 바깥의 별도 wrapper로 옮김.
              CSS opacity는 자식 요소에도 그대로 곱해져서 상속되기 때문에, 안쪽에 두면 버튼 자체 스타일과
              무관하게 흐리게 보일 수밖에 없었다. 핸드 진행 중(플랍/턴/리버)엔 숨겨서 게임 로직과의
              충돌(레이스 컨디션)을 피한다. 번호는 이 좌석이 쓰던 번호를 이어받지 않고 handleAiRejoin이
              매번 새로 발급하는 다음 번호를 사용한다. */}
          {eliminated && canRejoin && (
            <button
              style={styles.aiRejoinBtn}
              onClick={() => onRejoin(id)}
            >
              ➕ 새 AI 참가
            </button>
          )}
        </div>
      );
    }

    function CardView({ card, back, placeholder, big, small }) {
      const size = big ? styles.cardBig : small ? styles.cardSmall : styles.cardMid;
      if (back) {
        return <div style={{ ...styles.cardBase, ...size, ...styles.cardBack }}><div style={styles.cardBackPattern} /></div>;
      }
      if (!card) {
        return <div style={{ ...styles.cardBase, ...size, ...styles.cardPlaceholder }} />;
      }
      const color = SUIT_COLOR[card.suit];
      return (
        <div style={{ ...styles.cardBase, ...size, ...styles.cardFace }}>
          <span style={{ ...styles.cardRank, color }}>{rankLabel(card.rank)}</span>
          <span style={{ ...styles.cardSuit, color }}>{card.suit}</span>
        </div>
      );
    }

    function ResultBanner({ game }) {
      const [showAnalysis, setShowAnalysis] = useState(false);
      const r = game.handResult;
      const ar = game.analysisResult;

      useEffect(() => {
        setShowAnalysis(false);
      }, [game.handNum]);

      if (!r) return null;

      return (
        <div style={styles.resultBanner}>
          <div style={styles.resultWinner}>라운드 결과</div>
          {r.logs.map((log, i) => (
            <div key={i} style={styles.resultSub}>{log}</div>
          ))}

          {ar && ar.phaseResults.length > 0 && (
            <div style={styles.analysisWrap}>
              <button
                style={styles.analysisBtn}
                onClick={() => setShowAnalysis(!showAnalysis)}
              >
                {showAnalysis ? "분석 숨기기" : "내 플레이 분석 보기"}
              </button>

              {showAnalysis && (
                <div style={styles.analysisBox}>
                  <div style={styles.analysisHeader}>
                    이번 핸드 평가: {ar.avgScore}점 ({ar.grade})
                  </div>
                  <div style={styles.analysisBody}>
                    {ar.phaseResults.map((pr, i) => (
                      <div key={i} style={styles.analysisPhaseRow}>
                        <div style={styles.phaseHeader}>
                          <span style={styles.phaseTag}>{pr.phase}</span>
                          <span style={styles.phaseScore}>{pr.score}점</span>
                        </div>
                        <p style={styles.phaseComment}>{pr.comment}</p>

                        <div style={{ marginTop: 6, fontSize: 13, color: "#8FAE9C", fontFamily: "'Courier New', monospace" }}>
                          💡 정석 플레이 추천: {pr.recommended}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const styles = {

        boxShadow: "0 0 18px 4px rgba(201,164,76,0.65)",
        borderColor: "#D9B95C",
        background: "rgba(201,164,76,0.15)",

        transition: "all 0.2s ease-in-out"

      },
      setupItemTitle: { fontSize: 13, color: "#8FAE9C", fontFamily: "'Courier New', monospace", letterSpacing: 1 },
      setupStepBtn: {
        padding: "6px 8px", borderRadius: 6, border: "1px solid rgba(201,164,76,0.4)",

      },

      // 최상단에 보이도록 함(예전엔 둘 다 같은 z-index라 DOM 순서상 상점이 위로 덮어버리는 버그가 있었음).
      modalOverlay: {

        display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1100,
      },
      // 💡 추가: 상점 모달 전용 오버레이 - modalOverlay보다 z-index를 낮게 둬서, 상점 위에 뜨는
      // 확인창(구매 확인 등)이 항상 상점보다 위에 보이게 한다.
