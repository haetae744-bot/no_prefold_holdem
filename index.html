<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노 프리플랍 홀덤 (No-Preflop Texas Hold'em)</title>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone (JSX 변환용) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0f0c;
      font-family: 'Georgia', 'Noto Serif KR', serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(201, 164, 76, 0.4);
      border-radius: 3px;
    }

    @keyframes victoryPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(201,164,76,0.5)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 22px rgba(201,164,76,0.9)); }
    }
    .victory-badge {
      animation: victoryPulse 1.7s ease-in-out infinite;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const SUITS = ["♠", "♥", "♦", "♣"];
    const SUIT_COLOR = { "♠": "#181818", "♣": "#181818", "♥": "#c0392b", "♦": "#c0392b" };
    const RANK_LABEL = { 11: "J", 12: "Q", 13: "K", 14: "A" };

    const CAT_NAME = {
      0: "하이카드", 1: "원페어", 2: "투페어", 3: "트리플",
      4: "스트레이트", 5: "플러시", 6: "풀하우스", 7: "포카드", 8: "스트레이트 플러시",
    };


    //  --- 새로 추가할 사운드  ---
    const SOUND_URLS = {
      bgm: "./audio/bgm.mp3",
      shuffle: "./audio/card.mp3",
      bet: "./audio/call.mp3",
      call: "./audio/call.mp3",
      fold: "./audio/fold.mp3",
      win: "./audio/win.mp3",
      check: "./audio/check.mp3"
    };

    // 💡 추가: 바이인 시스템 - 뱅크롤(세션을 넘어 유지되는 총자산)과 차트 시트(구 연습모드) 구매 여부를
    // localStorage에 저장해 브라우저를 새로고침/재방문해도 이어지도록 함.
    const META_STORAGE_KEY = "noPreflopHoldem_meta_v1";
    const DEFAULT_BANKROLL = 100000;
    const BUYIN_PRESETS = [10000, 50000, 100000, 500000, 1000000];
    // 💡 수정: 배수(뱅크롤/바이인)가 1.0 → 1.2 → 1.5 → 1.6 → 2.0으로 매끄럽게 커지도록 재설계.
    // 1만/5만은 시작 뱅크롤(10만)로 처음부터 둘 다 열려있고, 위로 갈수록 "연승이 필요한" 느낌이 강해진다.
    const BUYIN_THRESHOLDS = {
      10000: 10000,     // 1만 방: 언제든 입장 가능 (기본)
      50000: 60000,     // 5만 방: 1.2배수 (초기 자금 10만이면 시작부터 열려있음!)
      100000: 150000,   // 10만 방: 1.5배수 (5만 방에서 한 번만 크게 이기면 바로 해금)
      500000: 800000,   // 50만 방: 1.6배수 (여기서부터 슬슬 연승이 필요함)
      1000000: 2000000, // 100만 방: 2배수 (최종 보스 방. 진정한 고수만 도달 가능)
    };
    const CHART_SHEET_PRICE = 20000;

    function loadMeta() {
      try {
        const raw = localStorage.getItem(META_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            bankroll: typeof parsed.bankroll === "number" && isFinite(parsed.bankroll) ? parsed.bankroll : DEFAULT_BANKROLL,
            ownsChartSheet: !!parsed.ownsChartSheet,
          };
        }
      } catch (e) { /* localStorage 접근 불가 등 - 기본값으로 폴백 */ }
      return { bankroll: DEFAULT_BANKROLL, ownsChartSheet: false };
    }

    function saveMeta(meta) {
      try {
        localStorage.setItem(META_STORAGE_KEY, JSON.stringify(meta));
      } catch (e) { /* 저장 실패는 무시 - 세션 내 플레이 자체는 계속 가능해야 함 */ }
    }

    const audios = {};
    // 사운드 사전 로딩 및 볼륨 세팅
    Object.keys(SOUND_URLS).forEach(key => {
      audios[key] = new Audio(SOUND_URLS[key]);
      if (key === 'bgm') {
        audios[key].loop = true;
        audios[key].volume = 0.2; // BGM은 방해 안 되게 작게
      } else {
        audios[key].volume = 0.6;
      }
    });

    const playSound = (type, mutedBgm, mutedSfx) => {
      const isThisMuted = type === 'bgm' ? mutedBgm : mutedSfx;
      if (isThisMuted || !audios[type]) return;
      if (type !== 'bgm') {
        // 효과음은 겹쳐서 재생될 수 있도록 복제해서 실행
        const sound = audios[type].cloneNode();
        sound.volume = audios[type].volume;
        sound.play().catch(e => console.log("사운드 재생 에러:", e));
      } else {
        audios[type].play().catch(e => console.log("BGM 에러:", e));
      }
    };

    const stopBGM = () => {
      if (audios.bgm) {
        audios.bgm.pause();
        audios.bgm.currentTime = 0;
      }
    };
    // ---------------------------------
    function getNoisyThreshold(base, variance) {
      const noise = (Math.random() * variance * 2) - variance;
      return Math.max(0, Math.min(1, base + noise));
    }

    function freshDeck() {
      const deck = [];
      for (const s of SUITS) for (let r = 2; r <= 14; r++) deck.push({ rank: r, suit: s });
      return deck;
    }

    function shuffle(deck) {
      const d = [...deck];
      for (let i = d.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [d[i], d[j]] = [d[j], d[i]];
      }
      return d;
    }

    function rankLabel(r) { return RANK_LABEL[r] || String(r); }

    function combinations(arr, k) {
      const res = [];
      const combo = [];
      function go(start) {
        if (combo.length === k) { res.push([...combo]); return; }
        for (let i = start; i < arr.length; i++) {
          combo.push(arr[i]);
          go(i + 1);
          combo.pop();
        }
      }
      go(0);
      return res;
    }

    function evaluate5(cards) {
      const ranks = cards.map(c => c.rank).sort((a, b) => b - a);
      const suits = cards.map(c => c.suit);
      const isFlush = suits.every(s => s === suits[0]);

      const countMap = {};
      ranks.forEach(r => (countMap[r] = (countMap[r] || 0) + 1));
      const groups = Object.entries(countMap)
        .map(([r, c]) => ({ rank: Number(r), count: c }))
        .sort((a, b) => (b.count - a.count) || (b.rank - a.rank));

      const uniqueRanksDesc = [...new Set(ranks)];
      let straightHigh = null;
      if (uniqueRanksDesc.length >= 5) {
        for (let i = 0; i <= uniqueRanksDesc.length - 5; i++) {
          const window = uniqueRanksDesc.slice(i, i + 5);
          if (window[0] - window[4] === 4) { straightHigh = window[0]; break; }
        }
      }
      if (straightHigh === null) {
        const wheel = [14, 5, 4, 3, 2];
        if (wheel.every(r => uniqueRanksDesc.includes(r))) straightHigh = 5;
      }
      const isStraight = straightHigh !== null;

      let cat, tiebreak;
      if (isStraight && isFlush) { cat = 8; tiebreak = [straightHigh]; }
      else if (groups[0].count === 4) {
        const kicker = ranks.find(r => r !== groups[0].rank);
        cat = 7; tiebreak = [groups[0].rank, kicker];
      } else if (groups[0].count === 3 && groups[1] && groups[1].count >= 2) {
        cat = 6; tiebreak = [groups[0].rank, groups[1].rank];
      } else if (isFlush) { cat = 5; tiebreak = [...ranks]; }
      else if (isStraight) { cat = 4; tiebreak = [straightHigh]; }
      else if (groups[0].count === 3) {
        const kickers = ranks.filter(r => r !== groups[0].rank).slice(0, 2);
        cat = 3; tiebreak = [groups[0].rank, ...kickers];
      } else if (groups[0].count === 2 && groups[1] && groups[1].count === 2) {
        const pairRanks = [groups[0].rank, groups[1].rank].sort((a, b) => b - a);
        const kicker = ranks.find(r => r !== pairRanks[0] && r !== pairRanks[1]);
        cat = 2; tiebreak = [...pairRanks, kicker];
      } else if (groups[0].count === 2) {
        const kickers = ranks.filter(r => r !== groups[0].rank).slice(0, 3);
        cat = 1; tiebreak = [groups[0].rank, ...kickers];
      } else { cat = 0; tiebreak = ranks.slice(0, 5); }

      return { cat, tiebreak, cards };
    }

    function compareScore(a, b) {
      if (a.cat !== b.cat) return a.cat - b.cat;
      for (let i = 0; i < Math.max(a.tiebreak.length, b.tiebreak.length); i++) {
        const x = a.tiebreak[i] || 0, y = b.tiebreak[i] || 0;
        if (x !== y) return x - y;
      }
      return 0;
    }

    function evaluateBest(cards) {
      if (cards.length <= 5) return evaluate5(cards);
      const combos = combinations(cards, 5);
      let best = null;
      for (const c of combos) {
        const ev = evaluate5(c);
        if (!best || compareScore(ev, best) > 0) best = ev;
      }
      return best;
    }

    function handLabel(ev) {
      if (ev.cat === 8 && ev.tiebreak[0] === 14) return "로열 스트레이트 플러시";
      return CAT_NAME[ev.cat];
    }

    function hasDrawPossibility(cards) {
      if (cards.length < 4) return false;

      const suitCounts = { "♠": 0, "♥": 0, "♦": 0, "♣": 0 };
      cards.forEach(c => suitCounts[c.suit]++);
      if (Object.values(suitCounts).some(count => count >= 4)) return true;

      const ranks = [...new Set(cards.map(c => c.rank))].sort((a, b) => a - b);
      for (let i = 0; i <= ranks.length - 4; i++) {
        if (ranks[i + 3] - ranks[i] === 3) return true;
      }
      if (ranks.includes(14) && ranks.includes(2) && ranks.includes(3) && ranks.includes(4)) return true;

      return false;
    }

    // 💡 추가: 스트레이트/플러시를 제외한, 랭크 카운트만으로 판정 가능한 족보 카테고리 계산.
    // evaluateBest/evaluate5를 5장 미만 카드에 쓰면 isFlush 오탐(4장이 우연히 같은 무늬여도 flush로 오판)이
    // 발생할 수 있어, '보드 카드만으로 이 카테고리에 도달 가능한가'를 안전하게 확인하기 위해 별도로 둡니다.
    function bestMadeCategoryFromRanks(ranks) {
      const countMap = {};
      ranks.forEach(r => { countMap[r] = (countMap[r] || 0) + 1; });
      const groups = Object.values(countMap).sort((a, b) => b - a);
      if (!groups.length) return 0;
      if (groups[0] >= 4) return 7; // 포카드
      if (groups[0] === 3 && groups[1] >= 2) return 6; // 풀하우스
      if (groups[0] === 3) return 3; // 트리플
      if (groups[0] === 2 && groups[1] === 2) return 2; // 투페어
      if (groups[0] === 2) return 1; // 원페어
      return 0; // 하이카드
    }

    function calculateDrawOuts(cards, hole) {
      if (cards.length >= 7) {
        return { outs: 0, hitChance: 0, drawType: "리버(추가 카드 없음)" };
      }
      const currentEv = evaluateBest(cards);
      // 💡 수정: 메이드 핸드(스트레이트 이상)도 조기 리턴하지 않고 아래 루프에서
      // 리드로우(예: 스트레이트→플러시/풀하우스 개선)까지 정밀하게 계산합니다.

      // 💡 추가: '탑/미들 페어급'인지 판정하기 위해, 그리고 '보드만으로 도달 가능한 카테고리'를 확인하기 위해
      // 보드(커뮤니티) 카드만 따로 추립니다. (getRelativeStrength의 탑/미들/바텀 페어 판정 기준과 동일하게 맞춤)
      const holeIdSet = new Set((hole || []).map(c => `${c.rank}${c.suit}`));
      const communityCards = cards.filter(c => !holeIdSet.has(`${c.rank}${c.suit}`));
      const communityRanksBase = communityCards.map(c => c.rank);
      const boardRanksDesc = [...new Set(communityRanksBase)].sort((a, b) => b - a);
      const topBoardRank = boardRanksDesc[0] || 0;
      const secondBoardRank = boardRanksDesc[1] || 0;

      const seen = new Set(cards.map(c => `${c.rank}${c.suit}`));
      let deck = [];
      for (const s of SUITS) {
        for (let r = 2; r <= 14; r++) {
          if (!seen.has(`${r}${s}`)) deck.push({ rank: r, suit: s });
        }
      }

      let flushOuts = 0;
      let straightOuts = 0;
      // 💡 추가: 메이드핸드 개선 아웃츠 (원페어→투페어/트리플, 투페어→풀하우스, 트리플→포카드/풀하우스 등)
      let madeHandOuts = 0;
      // 💡 추가: 오버카드 → 원페어 아웃츠 (하이카드 상태에서만 집계, 탑/미들페어급만 인정 - 아래 참고)
      let overcardOuts = 0;

      for (const card of deck) {
        const testCards = [...cards, card];
        const ev = evaluateBest(testCards);
        if (ev.cat <= currentEv.cat) continue; // 카테고리가 오르지 않으면 실질적 발전이 아님

        if (ev.cat === 5 || ev.cat === 8) { flushOuts++; continue; }
        if (ev.cat === 4) { straightOuts++; continue; }

        // 💡 핵심 수정: '새 카드의 랭크가 내 홀카드 랭크와 문자 그대로 일치하는가' 대신
        // '보드 카드만으로도 같은(또는 더 나은) 카테고리에 도달 가능한가'로 판정합니다.
        // 예: 트리플(홀카드 1장 + 보드 2장)일 때 나머지 킥커(보드 카드)가 페어링되어 풀하우스가 되는 경우,
        // 그 킥커 랭크는 홀카드와 다르지만 내 트리플이 있어야만 풀하우스가 성립하므로 '진짜 내 아웃'입니다.
        // 반대로 보드만으로 이미 같은 카테고리에 도달한다면(예: 관계없는 보드 카드끼리 페어링) 모두가 공유하는
        // 발전이므로 제외합니다.
        const boardOnlyCat = bestMadeCategoryFromRanks([...communityRanksBase, card.rank]);
        if (ev.cat <= boardOnlyCat) continue; // 보드만으로 이미 동일 이상 도달 가능 → 내 기여 없음, 제외

        if (currentEv.cat === 0) {
          // 💡 중요: 바텀페어급 페어링(보드 2위 카드보다 낮음)은 실전에서 이길 확률이 낮아
          // '진짜 아웃'으로 세지 않습니다. 보드 2위 카드 이상과 페어링될 때(탑/미들페어급)만 인정
          // — getRelativeStrength가 페어 강도를 판정하는 기준과 동일하게 맞췄습니다.
          if (card.rank >= secondBoardRank) overcardOuts++;
        } else {
          madeHandOuts++;
        }
      }

      const outs = flushOuts + straightOuts + madeHandOuts + overcardOuts;
      let drawType = "없음";
      if (flushOuts >= 9) drawType = "플러시 드로우";
      else if (straightOuts >= 8) drawType = "양빵(오픈엔디드) 드로우";
      else if (straightOuts > 0) drawType = "빵꾸(거츠샷) 드로우";
      else if (madeHandOuts >= 5) drawType = "메이드핸드 개선 드로우 (투페어/트리플/풀하우스 등)";
      else if (madeHandOuts > 0) drawType = "약한 메이드핸드 개선 드로우";
      else if (overcardOuts >= 3) drawType = "탑/미들페어 형성 드로우";
      else if (outs > 0) drawType = "마이너 드로우";
      else if (currentEv.cat >= 4) drawType = "메이드(추가 발전 없음)";

      // 💡 수정: 4/2룰(근사치) 대신 정확한 조합 확률로 hitChance 계산
      const cardsLeft = 7 - cards.length;
      const unseen = deck.length;
      let hitChance = 0;
      if (outs > 0 && unseen > 0) {
        if (cardsLeft === 2) {
          // 남은 2장(턴+리버) 중 최소 한 장이 아웃일 확률 = 1 - (아웃 아닌 카드 2장을 뽑을 확률)
          const missBottom = unseen * (unseen - 1);
          const missTop = (unseen - outs) * (unseen - outs - 1);
          hitChance = missBottom > 0 ? 1 - (missTop / missBottom) : 0;
        } else if (cardsLeft === 1) {
          hitChance = outs / unseen; // 리버 한 장만 남은 경우
        }
      }
      hitChance = Math.max(0, Math.min(1, hitChance));

      return { outs, hitChance, drawType };
    }

    // 💡 추가: SPR(Stack-to-Pot Ratio, 스택 대 팟 비율) 계산.
    // effectiveStack = 이 팟에 아직 살아있는 플레이어들 중 가장 짧은 스택(그 이상은 실질적으로 못 걸림).
    // 💡 추가: 블로커(카드 제거 효과) 계산.
    // 내 홀카드가 상대의 특정 '너트급' 조합을 물리적으로 줄여주는지 확인한다.
    // - 너트 플러시 블로커: 보드에 3장 이상 깔린 무늬의 A를 들고 있으면, 상대가 그 무늬 너트 플러시를 들 수 없음
    // - 트리플/풀하우스 블로커: 보드가 페어링된 랭크를 들고 있으면, 상대가 그 랭크로 트리플/포카드를 만들 콤보가 줄어듦
    function calculateBlockers(hole, community) {
      if (!hole || hole.length === 0 || !community || community.length === 0) {
        return { blocksNutFlush: false, blocksSecondNutFlush: false, blocksTrips: false, hasKeyBlocker: false, blockerNote: "" };
      }

      const suitCounts = { "♠": 0, "♥": 0, "♦": 0, "♣": 0 };
      community.forEach(c => { suitCounts[c.suit]++; });
      const flushSuit = Object.keys(suitCounts).find(s => suitCounts[s] >= 3);

      let blocksNutFlush = false;
      let blocksSecondNutFlush = false;
      if (flushSuit) {
        const holeSuited = hole.filter(c => c.suit === flushSuit);
        blocksNutFlush = holeSuited.some(c => c.rank === 14);
        blocksSecondNutFlush = !blocksNutFlush && holeSuited.some(c => c.rank === 13);
      }

      const communityRankCounts = {};
      community.forEach(c => { communityRankCounts[c.rank] = (communityRankCounts[c.rank] || 0) + 1; });
      const pairedRanks = Object.keys(communityRankCounts).map(Number).filter(r => communityRankCounts[r] >= 2);
      const blocksTrips = pairedRanks.some(r => hole.some(c => c.rank === r));

      const hasKeyBlocker = blocksNutFlush || blocksTrips;

      const notes = [];
      if (blocksNutFlush) notes.push("너트 플러시 블로커 보유");
      else if (blocksSecondNutFlush) notes.push("세컨 너트 플러시 블로커 보유");
      if (blocksTrips) notes.push("보드 페어 랭크를 들고 있어 상대 트리플/풀하우스 가능성 낮춤");

      return { blocksNutFlush, blocksSecondNutFlush, blocksTrips, hasKeyBlocker, blockerNote: notes.join(", ") };
    }

    // 💡 추가: 포지션 계산. 이 게임엔 버튼/블라인드가 없지만, 한 핸드 안에서는 플랍/턴/리버 내내
    // 액션 순서(s.players 배열 순서)가 고정되므로 '이번 스트리트에서 나보다 늦게 액션하는 인원 수'가
    // 곧 실질적인 포지션(정보 우위)이 된다. 늦게 액션할수록(actorsRemainingAfterMe가 작을수록) 유리.
    function calculatePosition(actorsRemainingAfterMe, totalActive) {
      if (totalActive <= 1) return { tier: "late", label: "포지션 우위(마지막 액션)", actorsRemainingAfterMe };
      if (actorsRemainingAfterMe === 0) return { tier: "late", label: "포지션 우위 (마지막 액션)", actorsRemainingAfterMe };
      const ratio = actorsRemainingAfterMe / (totalActive - 1);
      let tier, label;
      if (ratio <= 0.34) { tier = "late"; label = "레이트 포지션"; }
      else if (ratio <= 0.67) { tier = "middle"; label = "미들 포지션"; }
      else { tier = "early"; label = "얼리 포지션"; }
      return { tier, label, actorsRemainingAfterMe };
    }

    function calculateSPR(effectiveStack, pot) {
      if (!pot || pot <= 0) return { spr: null, tier: "unknown", label: "계산 불가" };
      const spr = effectiveStack / pot;
      let tier, label;
      if (spr <= 4) { tier = "low"; label = "낮음 (커밋 구간)"; }
      else if (spr <= 10) { tier = "medium"; label = "중간"; }
      else { tier = "high"; label = "깊음"; }
      return { spr, tier, label };
    }

    // 💡 추가: 테이블 사이즈(게임 전체 생존자 수) 계산.
    // opponentsCount(이번 핸드에 살아있는 상대 수)와는 다른 축 - 게임 전체에서 몇 명이 파산했는지에 따라
    // 숏핸디드/헤즈업으로 갈수록 핸드 가치 기준 자체가 낮아진다(실전 포커 이론과 동일).
    function calculateTableDynamics(remainingPlayers) {
      if (!remainingPlayers || remainingPlayers <= 0) return { tier: "full", label: "", remainingPlayers: remainingPlayers || 0 };
      let tier, label;
      if (remainingPlayers <= 2) { tier = "headsup"; label = `생존자 ${remainingPlayers}명(헤즈업)`; }
      else if (remainingPlayers <= 4) { tier = "short"; label = `생존자 ${remainingPlayers}명(숏핸디드)`; }
      else { tier = "full"; label = `생존자 ${remainingPlayers}명(풀링)`; }
      return { tier, label, remainingPlayers };
    }

    function getRelativeStrength(ev, hole, community, toCall, pot, spr, positionLabel, remainingPlayers, positionTier) {
      if (!community || community.length === 0) {
        return {
          isStrong: ev.cat >= 2,
          isModerate: ev.cat === 1 && ev.tiebreak[0] >= 10,
          isWeak: ev.cat === 0 || (ev.cat === 1 && ev.tiebreak[0] < 10),
          isBoardHeavy: false,
          contextText: `내 핸드: ${CAT_NAME[ev.cat]}`
        };
      }

      const boardEv = evaluateBest(community);
      const holeIds = hole.map(c => `${c.rank}${c.suit}`);
      const usedHoleCards = ev.cards.filter(c => holeIds.includes(`${c.rank}${c.suit}`));
      // 💡 추가: 블로커 계산 (너트 플러시/트리플 등 상대의 강한 조합을 물리적으로 줄이는지)
      const blockers = calculateBlockers(hole, community);

      let isStrong = false;
      let isModerate = false;
      let isWeak = false;
      let isBoardHeavy = false;
      const reasons = []; // 💡 추가: 판정 근거를 사람이 읽을 수 있는 문구로 누적

      // 1. 보드 위협도(Board Texture Danger) 분석
      const boardSuits = community.map(c => c.suit);
      const suitCounts = { "♠": 0, "♥": 0, "♦": 0, "♣": 0 };
      boardSuits.forEach(s => suitCounts[s]++);
      const maxSuitCount = Math.max(...Object.values(suitCounts));
      const isFlushDanger = maxSuitCount >= 3;

      const boardRanks = [...new Set(community.map(c => c.rank))].sort((a, b) => b - a);
      let isStraightDanger = boardEv.cat === 4;

      // 일반 스트레이트 위협
      for (let i = 0; i <= boardRanks.length - 3; i++) {
        if (boardRanks[i] - boardRanks[i + 2] <= 4) isStraightDanger = true;
      }

      // A를 1로 취급하는 휠(Wheel) 하단 스트레이트 위협 정밀 감지
      if (boardRanks.includes(14)) {
        const wheelRanks = [...boardRanks, 1].sort((a, b) => b - a);
        for (let i = 0; i <= wheelRanks.length - 3; i++) {
          if (wheelRanks[i] - wheelRanks[i + 2] <= 4) isStraightDanger = true;
        }
      }
      // 💡 위협 플래그는 여러 판정 문구에서 재사용하므로 공통 문구로 미리 만들어둡니다.
      const dangerNote = [isFlushDanger ? "플러시 위협 있음" : "", isStraightDanger ? "스트레이트 위협 있음" : ""].filter(Boolean).join(", ") || "보드 위협 없음";

      // 2. 패 강도 평가 분기
      if (usedHoleCards.length === 0) {
        isBoardHeavy = true;
        isWeak = true;
        reasons.push(`내 홀카드가 이 족보에 전혀 관여하지 않음 (보드 자체가 ${CAT_NAME[boardEv.cat]})`);
      }
      else if (ev.cat === boardEv.cat && ev.tiebreak[0] === boardEv.tiebreak[0]) {
        isBoardHeavy = true;
        const myKickers = usedHoleCards.map(c => c.rank);
        const myBestKicker = myKickers.length > 0 ? Math.max(...myKickers) : 0;

        reasons.push(`내 ${CAT_NAME[ev.cat]}(${rankLabel(ev.tiebreak[0])})는 보드의 ${CAT_NAME[boardEv.cat]}와 탑랭크 동률 → 키커 승부`);

        if (boardEv.cat >= 3) {
          isWeak = true;
          reasons.push(`보드에 이미 ${CAT_NAME[boardEv.cat]} 이상이 깔려있어 내 키커는 의미 없음`);
        } else if (boardEv.cat === 2) {
          reasons.push(`내 최고 키커 ${rankLabel(myBestKicker)}, ${dangerNote}`);
          if (myBestKicker >= 13 && !isFlushDanger && !isStraightDanger) {
            isModerate = true;
          } else {
            isWeak = true;
          }
        } else if (boardEv.cat === 1) {
          reasons.push(`내 최고 키커 ${rankLabel(myBestKicker)}, ${dangerNote}`);
          if (isFlushDanger || isStraightDanger) {
            isWeak = true;
          } else if (myBestKicker >= 12) {
            isModerate = true;
          } else {
            isWeak = true;
          }
        } else {
          // 💡 수정: 보드와 내 패가 모두 '하이카드'일 경우, 키커가 아무리 높아도 베팅 상황에서는 '약한 패(Weak)'입니다.
          isWeak = true;
          isModerate = false;
          reasons.push(`보드와 나 모두 하이카드 → 키커와 무관하게 약한 패로 취급`);
        }
      }
      else {
        if (ev.cat >= 6) {
          isStrong = true;
          reasons.push(`${CAT_NAME[ev.cat]} — 매우 강한 완성 핸드`);
        } else if (ev.cat === 5) {
          if (maxSuitCount === 4 && Math.max(...usedHoleCards.map(c => c.rank)) < 11) {
            isModerate = true;
            reasons.push(`플러시지만 보드에 이미 같은 무늬 4장 → 낮은 카드(${rankLabel(Math.max(...usedHoleCards.map(c => c.rank)))})면 로우 플러시 위험`);
          } else {
            isStrong = true;
            reasons.push(`플러시 완성, 로우 플러시 위험 적음`);
          }
        } else if (ev.cat === 4) {
          if (isFlushDanger) { isModerate = true; reasons.push(`스트레이트 완성이지만 보드에 같은 무늬 3장 이상 → 플러시 위협 있음`); }
          else { isStrong = true; reasons.push(`스트레이트 완성, 플러시 위협 없음`); }
        } else if (ev.cat === 3) {
          if (maxSuitCount >= 4 || ((isFlushDanger || isStraightDanger) && community.length === 5)) {
            isModerate = true;
            reasons.push(`트리플이지만 ${dangerNote}`);
          } else {
            isStrong = true;
            reasons.push(`트리플, ${dangerNote}`);
          }
        } else if (ev.cat === 2) {
          if (isFlushDanger || isStraightDanger || boardEv.cat === 1) {
            isModerate = true;
            reasons.push(`투페어지만 ${boardEv.cat === 1 ? "보드에 이미 페어 있음, " : ""}${dangerNote}`);
          } else {
            isStrong = true;
            reasons.push(`투페어, ${dangerNote}`);
          }
        } else if (ev.cat === 1) {
          // 💡 [수정됨] 무조건 10 이상이 아니라 보드(Board) 랭크와 비교하여 탑/미들 페어를 인지합니다.
          const boardRanksDesc = [...new Set(community.map(c => c.rank))].sort((a, b) => b - a);
          const topBoardRank = boardRanksDesc[0] || 0;
          const secondBoardRank = boardRanksDesc[1] || 0;
          const myPairRank = ev.tiebreak[0];
          const cmpLabel = myPairRank === topBoardRank ? "동률"
            : myPairRank > topBoardRank ? "위"
            : myPairRank >= secondBoardRank ? "2위와 동률 이상(미들 페어)"
            : "아래(바텀 페어)";

          reasons.push(`내 페어 ${rankLabel(myPairRank)}는 보드 탑카드 ${rankLabel(topBoardRank)}와 ${cmpLabel}, ${dangerNote}`);

          if (myPairRank >= topBoardRank) {
            if (isFlushDanger && community.length === 5) isWeak = true;
            else isModerate = true;
          } else if (myPairRank >= secondBoardRank) {
            if (isFlushDanger || isStraightDanger) isWeak = true;
            else isModerate = true; // 미들 페어도 쇼다운 밸류가 있으므로 Moderate에 편입 (퓨어 블러핑 취급 X)
          } else {
            isWeak = true; // 바텀 페어 및 이하는 여전히 Weak
          }
        } else {
          // 💡 [수정됨] 보드와 내 패가 모두 하이카드일 때 키커 오류 방지
          isWeak = true;
          isModerate = false;
          reasons.push(`하이카드로 보드 미스, 완성된 족보 없음`);
        }
      }

      // 3. 팟 오즈(Pot Odds) 기반 상대적 압박감 적용
      const pressureOdds = toCall > 0 ? toCall / (pot + toCall) : 0;

      if (pressureOdds >= 0.33) {
        if (isModerate) {
          isModerate = false;
          isWeak = true;
          reasons.push(`콜 비용이 팟 대비 커서(${Math.round(pressureOdds * 100)}%) 판정을 한 단계 보수적으로 조정`);
        }
        if (isStrong && ev.cat <= 3 && usedHoleCards.length === 1 && Math.max(...hole.map(c => c.rank)) < 12) {
          isStrong = false;
          isModerate = true;
          reasons.push(`콜 비용이 팟 대비 커서(${Math.round(pressureOdds * 100)}%) 판정을 한 단계 보수적으로 조정`);
        }
      }

      // 4. 💡 수정: SPR(스택 대 팟 비율) 기반 커밋 성향 조정.
      // 💡 코멘트 밀도 완화: SPR이 '중간'이면 판정에 영향이 없으므로 아예 언급하지 않고,
      // 낮음/깊음일 때만 라벨+설명을 한 문구로 압축해서(따로 문장을 안 늘리고) 표시한다.
      if (typeof spr === "number" && isFinite(spr)) {
        if (spr <= 4) {
          const upgraded = isModerate && ev.cat >= 1;
          if (upgraded) { isModerate = false; isStrong = true; }
          reasons.push(`SPR ${spr.toFixed(1)}(낮음, 커밋 구간${upgraded ? "으로 승격" : ""})`);
        } else if (spr >= 10) {
          const downgraded = isStrong && ev.cat <= 2;
          if (downgraded) { isStrong = false; isModerate = true; }
          reasons.push(`SPR ${spr.toFixed(1)}(깊음${downgraded ? ", 풀커밋 위험으로 강등" : ""})`);
        }
        // SPR 4~10(중간)은 특별한 조정이 없으므로 코멘트 밀도를 위해 언급하지 않음
      }

      // 5. 💡 수정: 테이블 사이즈(게임 전체 생존자 수) 기반 핸드가치 기준 완화.
      // 마찬가지로 '풀링(평범)'이면 언급하지 않고, 숏핸디드/헤즈업일 때만 압축된 한 문구로 표시.
      const tableDynamics = calculateTableDynamics(remainingPlayers);
      if (tableDynamics.tier === "headsup") {
        let tag = "";
        if (isWeak && ev.cat >= 1) { isWeak = false; isModerate = true; tag = ", 페어면 밸류로 승격"; }
        else if (isModerate) { isModerate = false; isStrong = true; tag = ", 강패로 승격"; }
        reasons.push(`${tableDynamics.label}${tag}`);
      } else if (tableDynamics.tier === "short") {
        let tag = "";
        if (isModerate && ev.cat >= 2) { isModerate = false; isStrong = true; tag = ", 강패로 승격"; }
        reasons.push(`${tableDynamics.label}${tag}`);
      }
      // 풀링(평범)은 코멘트 밀도를 위해 언급하지 않음

      // 6. 💡 추가: 블로커 노트 (있을 때만 표시 - 없으면 굳이 "블로커 없음"으로 코멘트를 채우지 않음)
      if (blockers.blockerNote) {
        reasons.push(blockers.blockerNote);
      }

      // 7. 💡 수정: 포지션 노트 - 미들 포지션(평범)은 코멘트 밀도를 위해 언급하지 않고,
      // 얼리/레이트처럼 실제로 의미 있는 경우만 표시.
      if (positionLabel && positionTier !== "middle") {
        reasons.push(positionLabel);
      }

      // 💡 수정: 'reasonText'였던 필드를 'contextText'로 재정의.
      // SPR/포지션/보드 위협/핸드-보드 비교/블로커 등, 모두 '결정을 내리기 전 상황을 설명하는 사실'이므로
      // 이제 이 값은 코멘트 끝에 괄호로 덧붙이는 게 아니라 코멘트 맨 앞의 '상황 도입부' 문장으로 조립된다.
      const contextText = reasons.filter(Boolean).join(", ");
      return { isStrong, isModerate, isWeak, isBoardHeavy, contextText, hasKeyBlocker: blockers.hasKeyBlocker };
    }

    // 💡 추가: 상황 도입부(Context) 문장 조립. SPR/포지션/보드 위협 등 '결정 전 상황'을 자연스러운
    // 도입 절로 만들어 코멘트의 맨 앞에 배치한다.
    function buildContextIntro(contextText) {
      if (!contextText) return "";
      return `${contextText} 상황에서, `;
    }

    // 💡 추가: 결론(Conclusion) 문장 조립. 최종 점수에 따라 코멘트 맨 끝에 붙는 뉘앙스를 결정한다.
    function buildConclusion(score) {
      if (score >= 95) return "여러모로 흠잡을 데 없는 판단입니다.";
      if (score >= 85) return "정석에 부합하는 훌륭한 플레이입니다.";
      if (score >= 70) return "무난하고 합리적인 선택입니다.";
      if (score >= 55) return "장기적으로는 아쉬움이 남는 판단입니다.";
      if (score >= 40) return "위험 부담이 꽤 큰 플레이였습니다.";
      return "장기적으로 칩을 깎아먹는 명백한 실수에 가깝습니다.";
    }

    //최소 오프닝 베팅 계산 (25% 룰 및 100단위 CEIL)
    function calcMinOpeningBet(ante, streetStartPot) {
      const safePot = streetStartPot || 0; // 💡 방어 코드: 값이 없으면 0으로 계산하여 NaN 에러 방지
      const twentyFivePercent = Math.ceil((safePot * 0.25) / 100) * 100;
      return Math.max(ante * 2, twentyFivePercent);
    }

    // 💡 추가: 추천 앤티 = 바이인의 1% (100단위 반올림), 최소 100 ~ 최대(바이인의 10%) 사이로 클램프.
    // 바이인의 1%로 잡으면 앤티를 걷은 직후 SPR이 대략 15~20 정도(6인 기준) 나와서 '깊음(SPR≥10)' 구간
    // 초입이 된다. 앤티가 너무 크면 핸드가 바로 올인 각으로 몰려서 포스트플랍 판단을 연습할 틈이 없어지므로,
    // 이 트레이너의 핵심 목적(포스트플랍 오즈 계산/드로우 판단)에 맞춰 일부러 이 정도로 낮게 잡았다.
    function calcRecommendedAnte(buyIn) {
      const maxAnte = Math.max(100, Math.floor((buyIn * 0.1) / 100) * 100);
      const raw = Math.round((buyIn / 100) / 100) * 100;
      return Math.max(100, Math.min(maxAnte, raw));
    }

    // 💡 추가: 주어진 칩 수량에 '비율(배수)'로 가장 가까운 바이인 프리셋을 찾는다.
    // 프리셋 간격이 1만→5만→10만→50만→100만처럼 등비적으로 벌어져 있으므로, 단순 차이(뺄셈)가 아니라
    // 로그 스케일 거리(비율)로 재야 직관과 맞는다 - 예: 25만은 차이로는 10만에 더 가깝지만(15만 vs 25만
    // 차이), 배수로는 50만에 더 가깝다(2배 vs 2.5배). 새로 참가하는 AI의 시작 칩을 여기에 맞춘다.
    function findClosestPresetByRatio(amount) {
      if (!amount || amount <= 0) return BUYIN_PRESETS[0];
      let best = BUYIN_PRESETS[0];
      let bestDist = Infinity;
      BUYIN_PRESETS.forEach(preset => {
        const dist = Math.abs(Math.log(preset / amount));
        if (dist < bestDist) {
          bestDist = dist;
          best = preset;
        }
      });
      return best;
    }

    // 💡 추가: 배럴링(멀티스트리트 서사) 분석.
    // 직전 스트리트에 베팅했었다면, 그 베팅이 밸류/세미블러프/퓨어블러핑 중 무엇이었는지 판정하고
    // 이번 스트리트에서 그 스토리를 잘 이어가고 있는지(또는 잘 포기했는지) 확인한다.
    function analyzeBarrel(prevAct, curAct) {
      if (!prevAct || prevAct.type !== "bet") return null;

      const prevStrength = getRelativeStrength(prevAct.ev, prevAct.hole, prevAct.community, prevAct.toCall, prevAct.pot, prevAct.spr);
      const prevOuts = prevAct.drawInfo ? prevAct.drawInfo.outs : 0;

      let prevBetType;
      if (prevStrength.isStrong) prevBetType = "value";
      else if (prevOuts >= 4) prevBetType = "semiBluff";
      else prevBetType = "pureBluff";

      const improved = curAct.ev.cat > prevAct.ev.cat;
      // 💡 추가: 직전 베팅에 상대가 어떻게 반응했는지(레이즈까지 당했는지, 콜만 받았는지)
      const facedRaise = !!(prevAct.opponentResponse && prevAct.opponentResponse.gotRaised);
      const gotCalled = !!(prevAct.opponentResponse && prevAct.opponentResponse.gotCalled);
      return { prevBetType, improved, facedRaise, gotCalled };
    }

    function evaluateUserActions(actions, currentAnte) {

      let totalScore = 0;

        const potOdds = toCall > 0 ? toCall / (pot + toCall) : 0;
        const betRatio = investedAmount / (pot || 1);

        const { outs, hitChance, drawType } = drawInfo;

          const maxBet = Math.max(currentAnte * 5, Math.round((pot * maxRatio) / 100) * 100);
