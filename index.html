    function NoPreflopHoldem() {
      const [game, setGame] = useState(initialGame());
      const [betAmount, setBetAmount] = useState(initialGame().bb * 5);
      const [isMutedBgm, setIsMutedBgm] = useState(false); // 💡 수정: 배경음악 음소거를 효과음과 분리
      const [isMutedSfx, setIsMutedSfx] = useState(false); // 💡 추가: 효과음 음소거
      const [practiceMode, setPracticeMode] = useState(false); // 💡 추가: 연습 모드 (실시간 팟오즈/아웃츠 표시)
      const [showStats, setShowStats] = useState(false); // 💡 추가: 누적 통계 패널 토글
      // 💡 추가: 바이인 시스템 - 뱅크롤/차트시트 소유 여부. localStorage에서 초기 로드.
      const [meta, setMeta] = useState(() => loadMeta());
      // 메타 상태가 바뀔 때마다 자동으로 localStorage에 저장
      useEffect(() => { saveMeta(meta); }, [meta]);
      // 💡 추가: window.confirm/alert 대신 쓰는 사이트 내 모달 상태.
      // onConfirm이 있으면 '취소/확인' 두 버튼(확인 다이얼로그), 없으면 '확인' 한 버튼(알림)만 표시.
      const [modal, setModal] = useState(null); // { message, onConfirm?: fn } | null
      const [showShop, setShowShop] = useState(false); // 💡 추가: 상점 창 표시 여부
      const askConfirm = (message, onConfirm) => setModal({ message, onConfirm });
      const showAlert = message => setModal({ message, onConfirm: null });
      const modalOverlay = modal && (
        <div style={styles.modalOverlay} onClick={() => setModal(null)}>
          <div style={styles.modalBox} onClick={e => e.stopPropagation()}>
            <div style={styles.modalMessage}>{modal.message}</div>
            <div style={styles.modalButtons}>
              {modal.onConfirm && (
                <button style={styles.modalCancelBtn} onClick={() => setModal(null)}>취소</button>
              )}
              <button
                style={styles.modalConfirmBtn}
                onClick={() => {
                  const fn = modal.onConfirm;
                  setModal(null);
                  if (fn) fn();
                }}
              >
                확인
              </button>
            </div>
          </div>
        </div>
      );
      const gameStateRef = useRef(game);
      const runningRef = useRef(false);
      const userResolveRef = useRef(null);
      const logEndRef = useRef(null);

      // [새로 추가] 게임이 시작되거나 음소거가 풀리면 BGM 재생
      useEffect(() => {
        if (game.setupDone && !isMutedBgm) {
          playSound('bgm', isMutedBgm, isMutedSfx);
        } else {
          stopBGM();
        }
      }, [game.setupDone, isMutedBgm]);
      useEffect(() => { gameStateRef.current = game; }, [game]);
      useEffect(() => {
        if (logEndRef.current) logEndRef.current.scrollTop = logEndRef.current.scrollHeight;
      }, [game.log]);
      useEffect(() => {
        if (game.awaitingUser) {
          // 💡 내 턴이 올 때 오프닝/레이즈 여부에 따라 스피너 최소값 세팅
          const minOpening = calcMinOpeningBet(game.bb, game.streetStartPot);
          // 💡 버그 수정: '아직 아무도 레이즈 안 하고 블라인드만 걸려있는 상태'(raiseCount===0)에서
          // 첫 레이즈를 할 때는, toCall이 이미 BB만큼이므로 증분은 BB만 더하면 표준 최소 레이즈
          // (토탈 2xBB)가 된다. 기존엔 여기서도 BB*2를 증분으로 요구해서 실제로는 3xBB가 최소가
          // 되어버리는 문제가 있었다(toCall과 증분을 혼동). 그 외(진짜 레이즈에 재레이즈하는 경우)는
          // 기존 방식(BB*2)을 그대로 유지한다.
          const facingJustBlind = game.phase === "preflop" && (game.raiseCountThisStreet || 0) === 0 && game.toCallForUser > 0;
          const uiMin = game.toCallForUser === 0 ? minOpening : (facingJustBlind ? game.bb : game.bb * 2);
          setBetAmount(uiMin);
        }
      }, [game.awaitingUser, game.toCallForUser, game.bb, game.streetStartPot]);
      // 💡 추가: 시작 자금이 변할 때, 빅블라인드가 10% 상한선을 넘으면 자동으로 내림(FLOOR) 처리하여 교정
      useEffect(() => {
        if (!game.setupDone) {
          const maxA = Math.floor((game.startingChips * 0.1) / 100) * 100;
          if (game.bb > maxA) {
            setGame(g => ({ ...g, bb: Math.max(100, maxA) }));
          }
        }
      }, [game.startingChips, game.setupDone]);

      const pushLog = (s, text) => { s.log = [...s.log, text]; };

      // 💡 수정: '초기화' → '퇴장'. 테이블을 떠날 때 현재 칩을 뱅크롤에 반영하고 바이인 화면으로 돌아간다.
      const handleLeaveTable = () => {
        const cashOut = (gameStateRef.current.chips && gameStateRef.current.chips.user) || 0;
        const confirmMsg = cashOut > 0
          ? `테이블에서 퇴장하고 칩 ${cashOut.toLocaleString()}을 뱅크롤에 반영하시겠습니까?`
          : "테이블에서 퇴장하시겠습니까?";
        askConfirm(confirmMsg, () => {
          const newBankroll = meta.bankroll + cashOut;
          // 💡 수정: 정상적으로 퇴장했으므로 체크포인트(비정상 종료 복구용)를 지운다 - 안 지우면
          // 다음 로드 때 loadMeta가 이미 반영된 cashOut을 또 한 번 뱅크롤에 합산해버린다.
          setMeta(m => ({ ...m, bankroll: newBankroll, checkpointChips: null }));
          setGame(g => {
            // 💡 수정: 이전에 고른 바이인이 새 뱅크롤로는 더 이상 감당이 안 될 수 있으므로(잃고 퇴장한 경우 등),
            // 여전히 감당 가능하면 그대로 유지하고, 아니면 감당 가능한 것 중 가장 큰 값(또는 전액)으로 보정한다.
            // 이렇게 안 하면 바이인 화면에서 선택 불가능한 값이 그대로 남아 '게임 시작'을 눌러도 조용히 아무
            // 일도 안 일어나는 버그가 생긴다.
            // 💡 수정: 프리셋 금액이 아니라 잠금 해제 기준(BUYIN_THRESHOLDS)으로 감당 가능 여부를 판단해야 함
            const affordablePresets = BUYIN_PRESETS.filter(p => newBankroll >= BUYIN_THRESHOLDS[p]);
            const stillAffordable = BUYIN_PRESETS.includes(g.startingChips) && newBankroll >= BUYIN_THRESHOLDS[g.startingChips];
            const safeBuyIn = stillAffordable
              ? g.startingChips
              : (affordablePresets.length > 0 ? affordablePresets[affordablePresets.length - 1] : Math.max(0, newBankroll));
            const newBB = calcRecommendedBB(safeBuyIn);
            return { ...initialGame(), aiCount: g.aiCount, bb: newBB, sb: Math.max(50, Math.round((newBB / 2) / 50) * 50), startingChips: safeBuyIn };
          });
          setBetAmount(initialGame().bb * 5);
          runningRef.current = false;
          if (userResolveRef.current) {
            userResolveRef.current({ type: "fold" });
            userResolveRef.current = null;
          }
        });
      };

      // 💡 추가: 뱅크롤이 완전히 바닥났을 때(더 이상 어떤 바이인도 불가능할 때)만 쓰는 진짜 초기화.
      // 차트 시트 구매 여부는 유지하고 뱅크롤만 기본값으로 되돌린다.
      const handleFullReset = () => {
        askConfirm(`뱅크롤을 ${DEFAULT_BANKROLL.toLocaleString()}으로 되돌리고 처음부터 다시 시작하시겠습니까?`, () => {
          setMeta(m => ({ ...m, bankroll: DEFAULT_BANKROLL, checkpointChips: null }));
          setGame(initialGame());
          setBetAmount(initialGame().bb * 5);
          runningRef.current = false;
        });
      };

      // 💡 수정: 언제든 누를 수 있는 전체 초기화 - '환생' 컨셉으로 리네이밍. handleFullReset과 달리
      // 차트 시트 구매내역까지 포함해서 완전히 지운다(localStorage도 함께). 뱅크롤=0일 때만 뜨는 게
      // 아니라 설정 화면에서 항상 접근 가능.
      const handleDevReset = () => {
        askConfirm("환생(전체 초기화) — 뱅크롤과 상점 구매내역을 모두 지우고 처음 상태(뱅크롤 100,000, 미구매)로 되돌립니다. 뱅크롤을 되돌리는 것 외에 다른 이득은 전혀 없습니다. 계속할까요?", () => {
          setMeta({ bankroll: DEFAULT_BANKROLL, ownsChartSheet: false, ownsLuckyCoin: false, ownsChipShuffle: false, checkpointChips: null });
          setGame(initialGame());
          setBetAmount(initialGame().bb * 5);
          runningRef.current = false;
        });
      };

      // 💡 추가: 파산한 AI 좌석에 유저가 직접 '새 AI 참가'를 눌렀을 때 호출됨.
      // 자동 리필이 아니라 수동이며, 번호는 그 좌석이 쓰던 번호를 계승하지 않고
      // 지금까지 등장한 가장 마지막 번호 다음 번호를 새로 부여한다(nextAiNumber).
      const handleAiRejoin = seatId => {
        if (runningRef.current) return; // 핸드 진행 중에는 안전하게 무시 (버튼 자체도 그 사이엔 안 보임)
        setGame(g => {
          if (seatId === "user" || !g.eliminated[seatId]) return g; // 방어적 체크
          const newNum = g.nextAiNumber || (g.aiCount + 1);
          const rand = Math.random();
          const newPersonality = rand < 0.1 ? "Maniac" : rand < 0.2 ? "Station" : rand < 0.6 ? "TAG" : "Rock";
          const newName = `AI ${newNum}`;
          // 💡 수정: 테이블의 원래 바이인으로 고정하는 대신, 유저의 현재 칩과 배수로 가장 가까운
          // 프리셋으로 새 AI의 시작 칩을 정한다. 게임이 오래 진행되어 유저 스택이 커졌는데 새 AI가
          // 계속 원래 바이인만큼(항상 숏스택)으로 들어오는 어색함을 피하기 위함.
          const newChips = findClosestPresetByRatio(g.chips.user || 0);
          const next = {
            ...g,
            names: { ...g.names, [seatId]: newName },
            chips: { ...g.chips, [seatId]: newChips },
            eliminated: { ...g.eliminated, [seatId]: false },
            allIn: { ...g.allIn, [seatId]: false },
            folded: { ...g.folded, [seatId]: false },
            aiPersonalities: { ...g.aiPersonalities, [seatId]: newPersonality },
            nextAiNumber: newNum + 1,
          };
          next.log = [...next.log, `💺 ${newName}이(가) 새로 참가했습니다 (칩 ${newChips.toLocaleString()})`];
          return next;
        });
      };

      const getUserAction = (s, toCall) => {
        return new Promise(resolve => {
          userResolveRef.current = resolve;
          s.awaitingUser = true;
          s.toCallForUser = toCall;
          setGame({ ...s });
        });
      };

      const applyAction = (s, player, action) => {
        const name = s.names[player];
        const toCall = s.currentBet - s.roundBets[player];
        let raised = false;
        let isFullRaise = false; //추가: 정상 금액을 채운 레이즈인가?

        if (action.type === "fold") {
          playSound('fold', isMutedBgm, isMutedSfx);
          s.folded[player] = true;
          s.lastAction[player] = "폴드";
          pushLog(s, `${name}: 폴드`);
          s.streetActions[player] = { type: "fold", amount: 0 };
        } else if (action.type === "check") {
          playSound('check', isMutedBgm, isMutedSfx);
          s.lastAction[player] = "체크";
          pushLog(s, `${name}: 체크`);
          s.streetActions[player] = { type: "check", amount: 0 };
        } else if (action.type === "call") {
          playSound('call', isMutedBgm, isMutedSfx);
          const amt = Math.max(0, Math.min(toCall, s.chips[player]));
          s.chips[player] -= amt; s.pot += amt;
          s.roundBets[player] += amt; s.invested[player] += amt;
          if (s.chips[player] === 0) s.allIn[player] = true;
          s.lastAction[player] = amt === toCall ? `콜 ${amt}` : `콜 ${amt} (올인)`;
          pushLog(s, `${name}: 콜 (${amt})`);
          s.streetActions[player] = { type: "call", amount: amt };
        } else if (action.type === "bet") {
          playSound('bet', isMutedBgm, isMutedSfx);

          // 오프닝 vs 레이즈에 따른 최소 요구치 계산
          const isOpening = s.currentBet === 0;
          // 💡 버그 수정: 프리플랍은 블라인드 때문에 currentBet이 이미 BB로 세팅되어 있어서
          // isOpening이 항상 false로 나온다 - 그래서 '블라인드만 걸린 상태에서의 첫 레이즈'가
          // '이미 레이즈가 있었던 상황'과 똑같이 취급되어 BB*2를 증분으로 요구했고, 결과적으로
          // 표준 최소 레이즈(2xBB)가 아니라 실질적으로 3xBB가 최소가 되어버렸다. raiseCount로
          // '진짜 레이즈가 아직 없었는지'를 구분해서 그 경우엔 BB만 최소 증분으로 요구한다.
          const facingJustBlind = s.phase === "preflop" && (s.raiseCountThisStreet || 0) === 0 && toCall > 0;
          const minIncrement = isOpening ? calcMinOpeningBet(s.bb, s.streetStartPot) : (facingJustBlind ? s.bb : s.bb * 2);

          let total = toCall + action.amount;
          total = Math.max(0, Math.min(total, s.chips[player]));

          //미달 올인 판별 (요구치 이상을 베팅했는가?)
          const actualIncrement = total - toCall;
          if (actualIncrement >= minIncrement) isFullRaise = true;

          s.chips[player] -= total; s.pot += total;
          s.roundBets[player] += total; s.invested[player] += total;
          if (s.chips[player] === 0) s.allIn[player] = true;

          if (s.roundBets[player] > s.currentBet) {
            s.currentBet = s.roundBets[player];
            raised = true;
          }
          const label = toCall > 0 ? "레이즈" : "베팅";
          s.lastAction[player] = `${label} ${total}`;
          pushLog(s, `${name}: ${label} (${total})`);
          // 💡 추가: toCall > 0이면 실질적으로 '레이즈'(내 베팅에 맞대응)이므로 그렇게 구분해서 기록
          s.streetActions[player] = { type: toCall > 0 ? "raise" : "bet", amount: total };
          // 💡 추가: 진짜 레이즈(오프닝 벳 제외)일 때만 이번 스트리트 레이즈 횟수 누적 - AI끼리 레이즈만
          // 반복하다 무조건 올인으로 치닫는 걸 막기 위해, decideAI가 이 횟수를 보고 자제하도록 함
          if (toCall > 0) {
            s.raiseCountThisStreet = (s.raiseCountThisStreet || 0) + 1;
          }
        }
        return { raised, isFullRaise }; // 두 개의 결과를 반환
      };

      const bettingRound = async s => {
        const players = s.players;
        s.currentBet = 0;
        s.canRaise = makeDict(players, true); //새 스트리트 시작 시 모두 권한 부활
        s.streetActions = {}; // 💡 추가: 이번 스트리트의 각 플레이어 최종 액션 기록 초기화 (상대 반응 추적용)
        s.raiseCountThisStreet = 0; // 💡 추가: 이번 스트리트에 누적된 레이즈 횟수(레이즈 전쟁 억제용)
        players.forEach(p => {
          s.roundBets[p] = 0;
          if (!s.folded[p]) s.lastAction[p] = "";
        });

        // 💡 추가: 버튼 기준 SB/BB 결정 및 스트리트별 액션 순서 계산을 한 곳에서 처리.
        // 헤즈업(생존자 2명)은 실제 포커의 특례 규칙을 따른다 - 버튼 본인이 SB, 나머지 한 명이 BB이며,
        // 프리플랍은 SB(버튼)가 먼저 액션하고 포스트플랍은 BB가 먼저 액션한다(일반적인 경우와 반대).
        const buttonIdx = s.buttonIndex || 0;
        const buttonPlayer = players[buttonIdx];
        const liveSeats = players.filter(p => !s.eliminated[p]);
        const isHeadsUp = liveSeats.length === 2;
        let sbPlayer, bbPlayer, liveOrderFromButton;

        if (isHeadsUp) {
          sbPlayer = buttonPlayer;
          bbPlayer = liveSeats.find(p => p !== buttonPlayer);
        } else {
          // 버튼 다음 살아있는 좌석부터 순서대로: [SB, BB, UTG, UTG+1, ..., 버튼]
          liveOrderFromButton = players.map((_, i) => players[(buttonIdx + 1 + i) % players.length]).filter(p => !s.eliminated[p]);
          sbPlayer = liveOrderFromButton[0];
          bbPlayer = liveOrderFromButton[1];
        }

        // 💡 추가: 프리플랍이면 SB/BB를 강제 베팅으로 걷고 시작한다. 스택이 블라인드보다 적으면
        // 있는 만큼만 걷고 바로 올인 처리(숏스택 블라인드).
        if (s.phase === "preflop") {
          const sbAmount = Math.min(s.sb, s.chips[sbPlayer]);
          s.chips[sbPlayer] -= sbAmount; s.pot += sbAmount; s.invested[sbPlayer] += sbAmount; s.roundBets[sbPlayer] = sbAmount;
          if (s.chips[sbPlayer] === 0) s.allIn[sbPlayer] = true;

          const bbAmount = Math.min(s.bb, s.chips[bbPlayer]);
          s.chips[bbPlayer] -= bbAmount; s.pot += bbAmount; s.invested[bbPlayer] += bbAmount; s.roundBets[bbPlayer] = bbAmount;
          if (s.chips[bbPlayer] === 0) s.allIn[bbPlayer] = true;

          s.currentBet = bbAmount;
          // 💡 버그 수정: 플랍/턴/리버는 각 스트리트 시작 시점에 streetStartPot을 새로 저장하는데
          // 프리플랍만 빠져있었다. 그래서 최소 오프닝 베팅 계산(calcMinOpeningBet)이 '지난 핸드
          // 리버가 끝났을 때의 팟'을 그대로 물려받아 엉뚱하게 크게 계산되는 문제가 있었다.
          // 블라인드를 걷은 직후의 팟(SB+BB)을 프리플랍의 시작 팟으로 저장한다.
          s.streetStartPot = s.pot;
          pushLog(s, `${s.names[sbPlayer]} SB ${sbAmount.toLocaleString()} / ${s.names[bbPlayer]} BB ${bbAmount.toLocaleString()} 포스팅 (팟 ${s.pot.toLocaleString()})`);
        }

        setGame({ ...s });
        await sleep(300);
        if (!gameStateRef.current.setupDone) return;

        let activePlayers = players.filter(p => !s.folded[p] && !s.allIn[p]);
        if (activePlayers.length <= 1) return;

        // 💡 수정: 액션 시작 위치를 스트리트별로 다르게 계산한다 - 프리플랍은 UTG(버튼+3, BB 다음
        // 사람)부터, 포스트플랍(플랍/턴/리버)은 SB(버튼+1)부터. 헤즈업은 위에서 정한 특례를 따른다.
        let streetOrder;
        if (isHeadsUp) {
          streetOrder = s.phase === "preflop" ? [sbPlayer, bbPlayer] : [bbPlayer, sbPlayer];
        } else if (s.phase === "preflop") {
          // liveOrderFromButton = [SB, BB, UTG, ..., 버튼] 이므로 앞 2명(SB,BB)을 맨 뒤로 돌리면
          // [UTG, ..., 버튼, SB, BB] 순서가 된다(BB가 프리플랍 마지막 액션 = '옵션'을 갖는 것까지 반영).
          streetOrder = [...liveOrderFromButton.slice(2), ...liveOrderFromButton.slice(0, 2)];
        } else {
          streetOrder = liveOrderFromButton; // 그대로 SB부터 시작
        }
        let queue = streetOrder.filter(p => activePlayers.includes(p));

        while (queue.length > 0) {
          const p = queue.shift();
          if (s.folded[p] || s.allIn[p]) continue;

          s.currentActor = p;

          const toCall = s.currentBet - s.roundBets[p];
          let action;

          const currentCards = [...s.hole[p], ...s.community];
          const ev = evaluateBest(currentCards);
          const drawInfo = calculateDrawOuts(currentCards, s.hole[p]);
          // 💡 수정: if/else 양쪽(유저·AI)에서 모두 쓸 수 있도록 상단으로 이동, 기준도 p 본인 제외로 일반화
          const activeOpponentsCount = players.filter(opp => !s.folded[opp] && !s.eliminated[opp] && opp !== p).length;
          // 💡 추가: SPR 계산 - 이 팟에 아직 살아있는 전원(본인 포함) 중 가장 짧은 스택이 유효 스택
          const liveStacksForSpr = players.filter(pl => !s.folded[pl] && !s.eliminated[pl]).map(pl => s.chips[pl]);
          const effectiveStack = liveStacksForSpr.length > 0 ? Math.min(...liveStacksForSpr) : s.chips[p];
          const sprInfo = calculateSPR(effectiveStack, s.pot);
          // 💡 추가: 포지션 계산 - 이번 스트리트에서 나보다 늦게 액션하는 인원 수(queue에 남은 인원)
          const positionInfo = calculatePosition(queue.length, activePlayers.length);
          // 💡 추가: 게임 전체 생존자 수(테이블 사이즈) - opponentsCount(이번 핸드 한정)와 다른 축
          const remainingPlayersCount = players.filter(pl => !s.eliminated[pl]).length;

          // 💡 추가: 연습모드 패널이 정확한 실시간 포지션을 보여줄 수 있도록, 유저 본인 기준 포지션을 상태에 기록.
          // 레이즈로 큐가 재구성되는 경우까지 정확히 반영하려면 '고정 순서 근사치'가 아니라 실제 큐를 봐야 함.
          if (p === "user") {
            s.livePositionForUser = positionInfo;
          } else if (queue.includes("user")) {
            // 유저가 아직 이번 서브라운드에서 액션 전이면(큐에 남아있으면), 유저 입장에서의 포지션을 미리 계산해둔다.
            const idxOfUser = queue.indexOf("user");
            const actorsAfterUserFromHere = queue.length - idxOfUser - 1;
            s.livePositionForUser = calculatePosition(actorsAfterUserFromHere, activePlayers.length);
          }
          // (유저가 이번 서브라운드에서 이미 액션을 마쳤고 아직 재액션 큐에 없다면, 마지막으로 기록된 값을 그대로 유지)

          // 💡 수정: currentActor/livePositionForUser까지 전부 반영한 뒤 한 번에 렌더링(지연 없이 최신 상태 표시)
          setGame({ ...s });

          if (p === "user") {
            action = await getUserAction(s, toCall);
            if (!gameStateRef.current.setupDone) return;
            s.awaitingUser = false;

            let actualInvested = 0;
            if (action.type === "call") actualInvested = Math.max(0, Math.min(toCall, s.chips.user));
            else if (action.type === "bet") actualInvested = Math.max(1, Math.min(toCall + (action.amount || 0), s.chips.user));
            // 💡 추가: 이번 액션으로 스택을 전부 투입했는지(올인) 여부. 베팅 사이즈 채점 시
            // '정석 범위에 못 미쳐도 올인이면 스택이 짧아서 어쩔 수 없었던 것'으로 구분하기 위함.
            const isAllInAction = (action.type === "bet" || action.type === "call") && actualInvested > 0 && actualInvested >= s.chips.user;

            s.userActions.push({
              phase: s.phase,
              type: action.type,
              investedAmount: actualInvested,
              isAllIn: isAllInAction,
              ev: ev,
              drawInfo: drawInfo,
              pot: s.pot,
              toCall: toCall,
              opponentsCount: activeOpponentsCount,
              hole: [...s.hole.user],
              community: [...s.community],
              spr: sprInfo.spr,
              positionTier: positionInfo.tier,
              positionLabel: positionInfo.label,
              remainingPlayers: remainingPlayersCount
            });

            // 💡 추가: 유저의 전체 액션 횟수와 공격적 액션(베팅/레이즈) 카운트
            s.opponentRead.totalActions++;
            if (action.type === "bet") s.opponentRead.aggressiveActions++;

            if (toCall > 0) {
              s.opponentRead.betsFaced++;
              if (action.type === "fold") s.opponentRead.foldsToBet++;
            }

          } else {
            await sleep(650 + Math.random() * 500);
            if (!gameStateRef.current.setupDone) return;
            // 💡 유저가 이번 핸드에 아직 살아있을 때만 '유저 프로필'을 반영 (이미 폴드했으면 반영할 대상이 없으므로 중립)
            const opponentProfile = (!s.folded.user && !s.eliminated.user) ? getOpponentProfile(s) : null;
            action = decideAI(ev, toCall, s.chips[p], s.pot, s.aiPersonalities[p], drawInfo, s.hole[p], s.community, s.bb, s.streetStartPot, activeOpponentsCount, opponentProfile, sprInfo.spr, positionInfo.tier, positionInfo.label, remainingPlayersCount, s.raiseCountThisStreet || 0, positionInfo.actorsRemainingAfterMe);
            if (action.type === "bet" && s.chips[p] <= toCall) action = { type: "call" };
          }

          if (action.type === "call" && toCall === 0) {
            action.type = "check";
          }

          const { raised, isFullRaise } = applyAction(s, p, action);
          s.canRaise[p] = false; // 💡 행동 완료 시 기본적으로 레이즈 권리 상실

          s.currentActor = null;
          setGame({ ...s });

          await sleep(450);
          if (!gameStateRef.current.setupDone) return;

          if (action.type === "fold") {
            const remaining = players.filter(q => !s.folded[q]);
            if (remaining.length === 1) return;
          }

          if (raised) {
            if (isFullRaise) {
              // 💡 풀 레이즈: 다른 플레이어들의 레이즈 권리 부활
              players.forEach(q => {
                if (q !== p && !s.folded[q] && !s.allIn[q]) s.canRaise[q] = true;
              });
            }

            // 💡 버그 수정: 고정된 players 배열 순서 대신, 이번 스트리트의 버튼 기준 순서(streetOrder)를
            // 그대로 이어서 써야 한다. 버튼이 매 핸드 도는데 여기만 원본 배열 순서를 쓰고 있어서,
            // 버튼이 회전한 두 번째 핸드부터 실제 액션 순서와 어긋나기 시작했고 - 그 결과로 빅블라인드가
            // 엉뚱한 시점에 잘못된 toCall로 평가되어 체크해야 할 상황에 폴드하는 등의 오작동이 발생했다.
            const startIdx = streetOrder.indexOf(p);
            queue = [];
            for (let i = 1; i < streetOrder.length; i++) {
              const nextP = streetOrder[(startIdx + i) % streetOrder.length];
              if (!s.folded[nextP] && !s.allIn[nextP]) {
                // 💡 기획 8번 방어: 숏 올인일 경우 기존 금액을 덜 낸(충족 못한) 사람만 큐에 다시 넣음
                if (isFullRaise || s.roundBets[nextP] < s.currentBet) {
                  queue.push(nextP);
                }
              }
            }
          }
        } // while 문 종료

        // 💡 추가: 스트리트가 끝난 뒤, 유저가 이번 스트리트에 '베팅'했었다면(내가 공격자였다면)
        // 상대들이 어떻게 반응했는지(콜/레이즈/폴드) 요약해서 그 액션 기록에 붙여준다.
        // (배럴링 판단 시 "이미 콜 받았는데 또 베팅" vs "레이즈까지 당했는데 또 베팅"을 구분하기 위함)
        for (let i = s.userActions.length - 1; i >= 0; i--) {
          if (s.userActions[i].phase !== s.phase) break; // 이번 스트리트 기록이 아니면 중단
          if (s.userActions[i].type !== "bet") continue; // 유저가 공격자였던 액션만 대상

          const opponents = players.filter(pl => pl !== "user" && !s.eliminated[pl]);
          const responses = opponents.map(pl => s.streetActions[pl]).filter(Boolean);
          const calledCount = responses.filter(r => r.type === "call").length;
          const raisedCount = responses.filter(r => r.type === "raise").length;
          const foldedCount = responses.filter(r => r.type === "fold").length;

          s.userActions[i] = {
            ...s.userActions[i],
            opponentResponse: {
              calledCount, raisedCount, foldedCount,
              gotCalled: calledCount > 0,
              gotRaised: raisedCount > 0,
            }
          };
          break; // 가장 최근 베팅 하나에만 부착
        }
      };

      const finishByFold = async s => {
        const winner = s.players.find(p => !s.folded[p]);
        const isUserWinner = winner === "user"; // 💡 유저 승리 여부 저장

        if (isUserWinner) playSound('win', isMutedBgm, isMutedSfx);
        s.handWinners = { [winner]: s.pot }; 
        s.chips[winner] += s.pot;
        pushLog(s, `${s.names[winner]} 승리! (모두 폴드, 팟 ${s.pot} 획득)`);

        s.phase = "foldwin";
        s.lastWinner = winner;
        s.handResult = { logs: [`전원 폴드 · 팟 ${s.pot.toLocaleString()} 획득 -> ${s.names[winner]}`], reason: "fold" };
        s.pot = 0;

        s.analysisResult = evaluateUserActions(s.userActions, s.bb);
        if (s.analysisResult) s.userStats = accumulateUserStats(s.userStats, s.analysisResult.phaseResults);

        // 💡 추가: 유저가 졌거나 폴드했더라도 탁월한 플레이(Brilliant)를 했다면 win 사운드 보상 제공
        if (!isUserWinner && s.analysisResult && s.analysisResult.grade.includes("Brilliant")) {
          playSound('win', isMutedBgm, isMutedSfx);
        }

        checkElimination(s);
        setGame({ ...s });
      };

      const finishByShowdown = async s => {
        let remainingInvestments = { ...s.invested };
        let activePlayers = s.players.filter(p => remainingInvestments[p] > 0);
        let pots = [];

        while (activePlayers.length > 0) {
          const contenders = activePlayers.filter(p => !s.folded[p]);

          if (contenders.length === 0) {
            const leftover = activePlayers.reduce((sum, p) => sum + remainingInvestments[p], 0);
            if (leftover > 0 && pots.length > 0) {
              pots[pots.length - 1].amount += leftover;
              activePlayers.forEach(p => { remainingInvestments[p] = 0; });
            }
            break;
          }

          const minBet = Math.min(...contenders.map(p => remainingInvestments[p]));
          let currentPotAmount = 0;
          let eligible = [...contenders];

          activePlayers.forEach(p => {
            const contribution = Math.min(remainingInvestments[p], minBet);
            currentPotAmount += contribution;
            remainingInvestments[p] -= contribution;
          });

          if (currentPotAmount > 0) pots.push({ amount: currentPotAmount, eligible });
          activePlayers = activePlayers.filter(p => remainingInvestments[p] > 0);
        }

        s.phase = "showdown";
        let resultLogs = [];
        let allWinners = new Set();

        pots.forEach((pot, index) => {
          const evals = pot.eligible.map(p => ({
            player: p,
            ev: evaluateBest([...s.hole[p], ...s.community]),
          }));

          let best = evals[0];
          for (const e of evals) if (compareScore(e.ev, best.ev) > 0) best = e;
          const winners = evals.filter(e => compareScore(e.ev, best.ev) === 0).map(e => e.player);

          // 💡 100 칩 단위(최소 단위)로 분할 계산
          const chipUnit = 100;
          const totalUnits = Math.floor(pot.amount / chipUnit);
          const shareUnits = Math.floor(totalUnits / winners.length);
          let remainderUnits = totalUnits % winners.length;

          const share = shareUnits * chipUnit;

          const sortedWinners = [...winners].sort((a, b) => s.players.indexOf(a) - s.players.indexOf(b));

          sortedWinners.forEach(w => {
            let extra = 0;
            if (remainderUnits > 0) {
              extra = chipUnit; // 남은 짜투리 칩(100)을 할당
              remainderUnits -= 1;
            }
            const totalWon = share + extra;
            s.chips[w] += totalWon;
            allWinners.add(w);
            s.handWinners[w] = (s.handWinners[w] || 0) + totalWon;
          });

          const potLabel = pots.length > 1 ? (index === 0 ? "메인 팟" : `사이드 팟 #${index}`) : "팟";
          const winnerNames = winners.map(w => s.names[w]).join(" & ");
          const handName = handLabel(evals.find(e => e.player === winners[0]).ev);
          // 💡 수정됨: 선언되지 않은 remainder 대신 직접 나머지 계산
          const hasRemainder = (totalUnits % winners.length) > 0;
          resultLogs.push(`[${potLabel} ${pot.amount.toLocaleString()}] ${winnerNames} 승리 (${handName})`);
          pushLog(s, `${potLabel} 분배: ${winnerNames} (+${share}${hasRemainder ? ' 및 칩 보정' : ''})`);
        });

        const isUserWinner = allWinners.has("user"); // 💡 유저 승리 여부 저장

        if (isUserWinner) playSound('win', isMutedBgm, isMutedSfx);
        s.lastWinner = Array.from(allWinners)[0];
        s.handResult = { logs: resultLogs, reason: "showdown" };
        s.pot = 0;

        s.analysisResult = evaluateUserActions(s.userActions, s.bb); // 기존 누락되어 있던 s.bb 파라미터도 함께 픽스
        if (s.analysisResult) s.userStats = accumulateUserStats(s.userStats, s.analysisResult.phaseResults);
        
        // 💡 추가: 유저가 쇼다운에서 패배했더라도 탁월한 플레이를 했다면 사운드 재생
        if (!isUserWinner && s.analysisResult && s.analysisResult.grade.includes("Brilliant")) {
          playSound('win', isMutedBgm, isMutedSfx);
        }

        checkElimination(s);
        setGame({ ...s });
      };

      const checkElimination = s => {
        // 💡 추가: 핸드가 끝날 때마다(승패 결과와 무관하게) 현재 유저 칩을 체크포인트로 저장.
        // '퇴장' 버튼을 안 누르고 창을 그냥 닫아도, 다음에 열었을 때 이 시점 칩이 뱅크롤에 자동으로
        // 합산 복구된다(loadMeta 참고). 정상적으로 퇴장하면 handleLeaveTable에서 이 값을 지운다.
        setMeta(m => ({ ...m, checkpointChips: s.chips.user }));

        s.players.forEach(p => { if (s.chips[p] <= 0) s.eliminated[p] = true; });
        if (s.eliminated.user) {
          s.over = true;
          s.gameWon = false; // 유저 탈락 = 패배
        } else if (!s.over) {
          // 💡 추가: 유저를 제외한 모든 상대가 탈락하면 유저의 완전 승리로 게임 종료
          const opponents = s.players.filter(p => p !== "user");
          const allOpponentsEliminated = opponents.length > 0 && opponents.every(p => s.eliminated[p]);
          if (allOpponentsEliminated) {
            s.over = true;
            s.gameWon = true;
            pushLog(s, `🏆 모든 상대를 파산시키고 최종 승리했습니다! (최종 칩 ${s.chips.user.toLocaleString()})`);
            playSound('win', isMutedBgm, isMutedSfx);
          }
        }
      };

      const beginSetupGame = () => {
        // 💡 수정: 실제 차감/시작 금액은 min(선택한 프리셋, 뱅크롤)로 캡을 씌운다.
        // (버튼은 UI에서 잠금 여부로 이미 막아뒀지만, 100만 프리셋처럼 잠금 기준이 프리셋 금액보다 낮게
        // 설정된 경우 뱅크롤이 프리셋에 못 미칠 수 있어 방어적으로 캡을 둔다)
        const buyIn = Math.min(game.startingChips, meta.bankroll);
        if (buyIn <= 0) return;
        setMeta(m => ({ ...m, bankroll: m.bankroll - buyIn }));

        setGame(g => {
          const baseIds = ["user", ...Array.from({ length: g.aiCount }, (_, i) => `ai${i + 1}`)];
          const players = baseIds;
          const names = buildNames(players);

          const aiPersonalities = {};
          players.forEach(p => {
            if (p !== "user") {
              const rand = Math.random();
              if (rand < 0.1) aiPersonalities[p] = "Maniac";
              else if (rand < 0.2) aiPersonalities[p] = "Station";
              else if (rand < 0.6) aiPersonalities[p] = "TAG";
              else aiPersonalities[p] = "Rock";
            }
          });

          return {
            ...initialGame(),
            setupDone: true,
            aiCount: g.aiCount,
            bb: g.bb,       // 💡 추가: 사용자가 설정한 빅블라인드 유지
            sb: Math.max(50, Math.round((g.bb / 2) / 50) * 50), // 💡 추가: 스몰블라인드 = BB의 절반
            initialBB: g.bb, // 💡 수정: 블라인드 사다리의 기준값(배수를 곱하는 기준)
            blindLevel: 0,        // 💡 수정: 블라인드 사다리 레벨 초기화
            startingChips: buyIn, // 💡 수정: 캡이 적용된 실제 바이인 금액 사용
            players,
            names,
            aiPersonalities,
            chips: makeDict(players, buyIn),
            invested: makeDict(players, 0),
            folded: makeDict(players, false),
            eliminated: makeDict(players, false),
            allIn: makeDict(players, false),
            roundBets: makeDict(players, 0),
            lastAction: makeDict(players, ""),
            nextAiNumber: g.aiCount + 1, // 💡 추가: AI 1~aiCount는 이미 사용 중이므로 다음 참가자는 그 다음 번호부터
            log: [`첫 베팅 순서: ${players.map(p => names[p]).join(" → ")}`],
          };
        });
      };

      const playHand = async () => {
        if (runningRef.current) return;
        runningRef.current = true;
        let s = { ...gameStateRef.current };

        // 💡 수정: 기존엔 '지난 핸드 승자가 다음 핸드에서 먼저 액션한다'는 변칙 규칙으로 순서를
        // 정했는데, 이건 실제 포커 규칙이 아니다(승패와 무관하게 버튼은 항상 한 자리씩 시계방향으로
        // 이동하는 게 원칙). 프리플랍 도입을 위해 진짜 버튼 로테이션으로 교체한다. 액션 순서 자체는
        // bettingRound에서 buttonIndex를 기준으로 동적으로 계산한다(더 이상 players 배열 순서 자체를
        // 바꾸지 않음 - 좌석은 고정, 버튼만 이동).
        s.buttonIndex = (s.buttonIndex + 1) % s.players.length;

        s.handWinners = {}; // 💡 새로 추가: 매 핸드마다 승리 기록 초기화
        const players = s.players;
        s.log = [...s.log];
        s.handNum += 1;
        s.deck = shuffle(freshDeck());
        playSound('shuffle', isMutedBgm, isMutedSfx);
        s.community = [];
        s.hole = {};
        s.folded = makeDict(players, false);
        s.allIn = makeDict(players, false);
        s.lastAction = makeDict(players, "");
        s.roundBets = makeDict(players, 0);
        s.invested = makeDict(players, 0);
        s.pot = 0;
        s.currentBet = 0;
        s.handResult = null;
        s.userActions = [];
        s.analysisResult = null;
        s.revealCards = false;
        s.livePositionForUser = null; // 💡 추가: 새 핸드 시작 시 이전 핸드의 포지션 정보 초기화
        s.started = true;

        players.forEach(p => { if (s.eliminated[p]) s.folded[p] = true; });

        // 💡 수정: 살아있는 전원(유저+AI)의 평균 스택이 처음 블라인드를 정했을 때보다 많이 불어났으면
        // 블라인드도 같이 인상한다. 세션이 길어져 다들 스택이 커지는데 블라인드가 그대로면, 블라인드가
        // 스택 대비 하찮아져서 SPR이 계속 깊어지고("깊음" 구간에 계속 머묾) 포스트플랍 판단이 느슨해지는
        // 문제가 있었다 - 처음 BB를 '바이인의 1%'로 잡았던 것과 같은 이유.
        // 임의의 계산값(1234, 3782 같은 애매한 숫자)이 아니라, BLIND_LEVEL_MULTIPLIERS라는 정해진 배수
        // 사다리를 타고 오르게 해서 토너먼트 블라인드처럼 깔끔한 단위로만 움직이게 한다. 평균 스택
        // 기준 '이상적인 BB'가 사다리의 다음 레벨 값 이상으로 올라섰을 때만 그 레벨로 올리며(여러
        // 레벨을 한 번에 건너뛸 수도 있음 - 예: 더블업으로 스택이 급증한 경우), 절대 내려가지 않는다.
        const activeForBlinds = players.filter(p => !s.eliminated[p]);
        if (activeForBlinds.length > 0) {
          const avgStack = activeForBlinds.reduce((sum, p) => sum + (s.chips[p] || 0), 0) / activeForBlinds.length;
          const idealBB = calcRecommendedBB(avgStack); // 지금 스택 기준으로 '이상적인' 연속값
          const baseBB = s.initialBB || s.bb;
          const currentLevel = s.blindLevel || 0;
          let newLevel = currentLevel;
          for (let lvl = currentLevel + 1; lvl < BLIND_LEVEL_MULTIPLIERS.length; lvl++) {
            const candidateBB = Math.max(100, Math.round(baseBB * BLIND_LEVEL_MULTIPLIERS[lvl] / 100) * 100);
            if (candidateBB <= idealBB) newLevel = lvl;
            else break;
          }
          if (newLevel > currentLevel) {
            const newBB = Math.max(100, Math.round(baseBB * BLIND_LEVEL_MULTIPLIERS[newLevel] / 100) * 100);
            const newSB = Math.max(50, Math.round((newBB / 2) / 50) * 50);
            pushLog(s, `📈 평균 스택 증가로 블라인드 레벨이 ${currentLevel + 1} → ${newLevel + 1}로 올랐습니다 (SB/BB ${s.sb.toLocaleString()}/${s.bb.toLocaleString()} → ${newSB.toLocaleString()}/${newBB.toLocaleString()}).`);
            s.bb = newBB;
            s.sb = newSB;
            s.blindLevel = newLevel;
          }
        }

        pushLog(s, `── ${s.handNum}번째 핸드 시작 (버튼: ${s.names[players[s.buttonIndex]]}) ──`);

        // 💡 수정: '전원 앤티 납부' 로직을 제거했다 - SB/BB 강제 베팅은 이제 bettingRound 안에서
        // 프리플랍 시작 시점에 처리된다(버튤/헤즈업 기준 계산이 그쪽에 이미 있어서 중복 계산을 피함).
        // 홀카드를 먼저 나눠준 뒤, 프리플랍 페이즈부터 시작해서 베팅 라운드를 한 번 더 돌린다.
        players.forEach(p => { if (!s.eliminated[p]) s.hole[p] = [s.deck.pop(), s.deck.pop()]; });
        s.phase = "preflop";
        pushLog(s, `프리플랍 - 홀카드 분배 완료`);
        setGame({ ...s });
        await sleep(600);
        if (!gameStateRef.current.setupDone) return;

        await bettingRound(s);
        if (!gameStateRef.current.setupDone) return;
        if (players.filter(p => !s.folded[p]).length === 1) { await finishByFold(s); runningRef.current = false; return; }

        s.streetStartPot = s.pot; // 💡 추가: 플랍 시작 팟 저장
        s.community.push(s.deck.pop(), s.deck.pop(), s.deck.pop());
        s.phase = "flop";
        pushLog(s, `플랍 공개`);
        setGame({ ...s });
        await sleep(600);
        if (!gameStateRef.current.setupDone) return;

        await bettingRound(s);
        if (!gameStateRef.current.setupDone) return;
        if (players.filter(p => !s.folded[p]).length === 1) { await finishByFold(s); runningRef.current = false; return; }

        s.phase = "turn"; s.community.push(s.deck.pop());
        s.streetStartPot = s.pot; // 💡 추가: 턴 시작 팟 저장
        pushLog(s, `턴 카드 공개`);
        setGame({ ...s }); await sleep(600);
        if (!gameStateRef.current.setupDone) return;
        await bettingRound(s);
        if (!gameStateRef.current.setupDone) return;
        if (players.filter(p => !s.folded[p]).length === 1) { await finishByFold(s); runningRef.current = false; return; }

        s.phase = "river"; s.community.push(s.deck.pop());
        s.streetStartPot = s.pot; // 💡 추가: 리버 시작 팟 저장
        pushLog(s, `리버 카드 공개`);
        setGame({ ...s }); await sleep(600);
        if (!gameStateRef.current.setupDone) return;
        await bettingRound(s);
        if (!gameStateRef.current.setupDone) return;
        if (players.filter(p => !s.folded[p]).length === 1) { await finishByFold(s); runningRef.current = false; return; }

        await finishByShowdown(s);
        runningRef.current = false;
      };

      const onUserAction = type => {
        if (!game.awaitingUser || !userResolveRef.current) return;
        userResolveRef.current({ type });
        userResolveRef.current = null;
      };
      const onUserBet = amount => {
        if (!game.awaitingUser || !userResolveRef.current) return;
        userResolveRef.current({ type: "bet", amount });
        userResolveRef.current = null;
      };

      const toCall = game.toCallForUser || 0;
      const userChips = game.chips.user || 0;
      const userCanRaise = game.canRaise ? game.canRaise.user : true; // 권한 확인

      const minOpeningBet = calcMinOpeningBet(game.bb, game.streetStartPot);
      // 💡 버그 수정: useEffect 쪽과 동일하게, 블라인드만 걸린 상태의 첫 레이즈는 증분을 BB만
      // 요구해야 표준 최소 레이즈(2xBB)가 된다(기존엔 BB*2를 증분으로 요구해서 실제 최소가 3xBB가 됨).
      const facingJustBlindForUi = game.phase === "preflop" && (game.raiseCountThisStreet || 0) === 0 && toCall > 0;
      const strictUiMin = toCall === 0 ? minOpeningBet : (facingJustBlindForUi ? game.bb : game.bb * 2);
      // 잔여 스택이 최소치보다 적으면 잔액 전액 올인 허용
      const uiMinBet = Math.min(strictUiMin, Math.max(0, userChips - toCall));
      const maxBet = Math.max(uiMinBet, userChips - toCall);

      // 💡 수정: 연습 모드용 실시간 팟오즈 / 아웃츠 / 적중확률.
      // toCall(=game.toCallForUser)은 '내 차례가 됐을 때'만 갱신되는 값이라, 내 차례가 아닐 때 패널을 계속 띄워두면
      // 오래된 콜 금액을 보여줄 수 있음. 그래서 언제나 최신인 currentBet/roundBets로 직접 다시 계산한다.
      const livePracticeToCall = Math.max(0, (game.currentBet || 0) - ((game.roundBets && game.roundBets.user) || 0));
      const practicePotOdds = livePracticeToCall > 0 ? livePracticeToCall / (game.pot + livePracticeToCall) : 0;
      const practiceDrawInfo = (game.hole && game.hole.user && game.community && game.community.length > 0)
        ? calculateDrawOuts([...game.hole.user, ...game.community], game.hole.user)
        : null;
      // 💡 추가: 연습 모드용 실시간 SPR (이 팟에 살아있는 전원 중 가장 짧은 스택 ÷ 팟)
      const liveStacksForPracticeSpr = (game.players || [])
        .filter(pl => !(game.folded && game.folded[pl]) && !(game.eliminated && game.eliminated[pl]))
        .map(pl => (game.chips && game.chips[pl]) || 0);
      const practiceEffectiveStack = liveStacksForPracticeSpr.length > 0 ? Math.min(...liveStacksForPracticeSpr) : (game.chips && game.chips.user) || 0;
      const practiceSprInfo = calculateSPR(practiceEffectiveStack, game.pot);
      // 💡 추가: 연습 모드용 실시간 블로커 정보
      const practiceBlockers = (game.hole && game.hole.user && game.community && game.community.length > 0)
        ? calculateBlockers(game.hole.user, game.community)
        : null;
      // 💡 수정: 근사치 대신, 게임 로직이 실제 큐(레이즈로 인한 재구성까지 반영)를 보고 직접 계산해
      // 상태에 저장해둔 정확한 값을 그대로 사용한다.
      const practicePositionInfo = game.livePositionForUser || calculatePosition(0, 1);
      // 💡 추가: 연습모드용 테이블 사이즈(게임 전체 생존자 수) 정보
      const practiceRemainingPlayers = (game.players || []).filter(pl => !(game.eliminated && game.eliminated[pl])).length;
      const practiceTableDynamics = calculateTableDynamics(practiceRemainingPlayers);

      // 💡 추가: 연습모드 패널의 프리플랍 전용 표시 - '아웃츠/SPR' 대신 '홀카드 상위 %'와 추천 액션.
      const practiceChenScore = (game.hole && game.hole.user && game.community && game.community.length === 0)
        ? evaluatePreflop(game.hole.user)
        : null;
      const practiceTopPercent = practiceChenScore !== null ? chenScoreToTopPercent(practiceChenScore) : null;
      let practicePreflopRecommendation = "";
      if (practiceChenScore !== null) {
        // 💡 수정: decideAI와 동일하게 3단계 근사치 대신 실제 남은 액션 인원수 기반으로 계산
        const posAdjust = (practicePositionInfo.actorsRemainingAfterMe || 0) * 0.6;
        const openThreshold = 6 + posAdjust; // 💡 수정: decideAI와 동일한 기준(6점)으로 통일
        if (livePracticeToCall === 0) {
          practicePreflopRecommendation = practiceChenScore >= openThreshold ? "오픈 레이즈 추천" : "체크 무난";
        } else {
          practicePreflopRecommendation = practiceChenScore >= openThreshold ? "콜/레이즈 고려 가능" : "폴드 무난";
        }
      }

      // 💡 추가: 여러 핸드 누적 통계(userStats)로부터 화면에 표시할 파생 지표 계산
      const us = game.userStats || createEmptyUserStats();
      const MIN_SAMPLE = 5; // 표본이 너무 적으면 통계가 왜곡되므로 최소 표본 이후에만 의미있는 수치로 표시
      const statsView = {
        handsPlayed: us.handsPlayed,
        avgScore: us.totalActions > 0 ? Math.round(us.totalScoreSum / us.totalActions) : null,
        sampleEnough: us.decisionPoints >= MIN_SAMPLE,
        decisionPoints: us.decisionPoints,
        foldAccuracy: us.actualFold > 0 ? Math.round((us.foldCorrect / us.actualFold) * 100) : null,
        callAccuracy: us.actualCall > 0 ? Math.round((us.callCorrect / us.actualCall) * 100) : null,
        actualFoldRate: (us.actualFold + us.actualCall) > 0 ? us.actualFold / (us.actualFold + us.actualCall) : null,
        idealFoldRate: us.decisionPoints > 0 ? us.idealFold / us.decisionPoints : null,
      };
      let tendencyLabel = "데이터 부족";
      if (statsView.sampleEnough && statsView.actualFoldRate !== null && statsView.idealFoldRate !== null) {
        const delta = statsView.actualFoldRate - statsView.idealFoldRate; // + : 과다폴드, - : 과다콜
        if (delta >= 0.1) tendencyLabel = `과다폴드 성향 (실제 폴드율이 정답보다 ${Math.round(delta * 100)}%p 높음)`;
        else if (delta <= -0.1) tendencyLabel = `과다콜 성향 (실제 폴드율이 정답보다 ${Math.round(-delta * 100)}%p 낮음)`;
        else tendencyLabel = "균형 잡힘 (콜/폴드 빈도가 정답과 근접)";
      }

      const aiSeats = game.players.filter(p => p !== "user");
      const isUserCurrent = game.currentActor === "user"; //

      if (!game.setupDone) {
        // 💡 수정: 뱅크롤이 완전히 바닥났으면 바이인 자체가 불가능하므로 별도 화면을 보여준다.
        if (meta.bankroll <= 0) {
          return (
            <div style={styles.page}>
              <div style={styles.feltGlow} />
              <div style={styles.setupWrap}>
                <div style={styles.eyebrow}>HOLDEM TRAVEL</div>
                <h1 style={styles.title}>홀덤 트래블</h1>
                <div style={styles.gameOverText}>뱅크롤이 모두 소진되었습니다</div>
                <p style={styles.setupDesc}>더 이상 어떤 바이인도 선택할 수 없어요.<br />뱅크롤을 초기화하고 처음부터 다시 시작할 수 있습니다.</p>
                <button style={{ ...styles.primaryBtn, marginTop: 12 }} onClick={handleFullReset}>뱅크롤 초기화하고 다시 시작</button>
                <div style={styles.devResetLinkWrap}>
                  <span style={styles.devResetLink} onClick={handleDevReset}>🔧 환생 (전체 초기화)</span>
                </div>
              </div>
              {modalOverlay}
            </div>
          );
        }

        // 💡 수정: 뱅크롤이 가장 낮은 프리셋(1만)보다도 적을 때만 '전액' 특수 옵션을 보여준다.
        const showAllInOption = meta.bankroll < BUYIN_PRESETS[0];

        const selectBuyIn = amount => {
          setGame(g => {
            const newBB = calcRecommendedBB(amount);
            return { ...g, startingChips: amount, bb: newBB, sb: Math.max(50, Math.round((newBB / 2) / 50) * 50) };
          });
        };

        // 💡 추가: 좌우 화살표로 넘기는 캐러셀 - 현재 game.startingChips가 가리키는 프리셋 인덱스를 찾는다.
        const presetIdx = Math.max(0, BUYIN_PRESETS.indexOf(game.startingChips));
        const currentPreset = BUYIN_PRESETS[presetIdx];
        const currentThreshold = BUYIN_THRESHOLDS[currentPreset];
        const isBuyInUnlocked = meta.bankroll >= currentThreshold;
        // 💡 주의: 100만 프리셋처럼 '잠금 해제 기준(80만)'이 프리셋 금액(100만)보다 낮게 설정된 경우를 대비해,
        // 실제로 차감/시작될 금액은 항상 min(프리셋, 뱅크롤)로 캡을 씌운다.
        const effectiveBuyIn = Math.min(currentPreset, meta.bankroll);
        const cycleBuyIn = direction => {
          const nextIdx = Math.max(0, Math.min(BUYIN_PRESETS.length - 1, presetIdx + direction));
          selectBuyIn(BUYIN_PRESETS[nextIdx]);
        };

        const canBuyChartSheet = !meta.ownsChartSheet && meta.bankroll >= CHART_SHEET_PRICE;
        const buyChartSheet = () => {
          if (!canBuyChartSheet) return;
          askConfirm(`차트 시트를 ${CHART_SHEET_PRICE.toLocaleString()}에 구매하시겠습니까? (뱅크롤에서 차감, 영구 소유)`, () => {
            setMeta(m => ({ ...m, bankroll: m.bankroll - CHART_SHEET_PRICE, ownsChartSheet: true }));
          });
        };

        // 💡 추가: 럭키 코인 토스 구매 로직 (차트 시트와 동일한 패턴)
        const canBuyLuckyCoin = !meta.ownsLuckyCoin && meta.bankroll >= LUCKY_COIN_PRICE;
        const buyLuckyCoin = () => {
          if (!canBuyLuckyCoin) return;
          askConfirm(`럭키 코인 토스를 ${LUCKY_COIN_PRICE.toLocaleString()}에 구매하시겠습니까? (뱅크롤에서 차감, 영구 소유)`, () => {
            setMeta(m => ({ ...m, bankroll: m.bankroll - LUCKY_COIN_PRICE, ownsLuckyCoin: true }));
          });
        };

        // 💡 추가: ASMR 칩 셔플 구매 로직 (동일한 패턴)
        const canBuyChipShuffle = !meta.ownsChipShuffle && meta.bankroll >= CHIP_SHUFFLE_PRICE;
        const buyChipShuffle = () => {
          if (!canBuyChipShuffle) return;
          askConfirm(`ASMR 칩 셔플을 ${CHIP_SHUFFLE_PRICE.toLocaleString()}에 구매하시겠습니까? (뱅크롤에서 차감, 영구 소유)`, () => {
            setMeta(m => ({ ...m, bankroll: m.bankroll - CHIP_SHUFFLE_PRICE, ownsChipShuffle: true }));
          });
        };

        return (
          <div style={styles.page}>
            <div style={styles.feltGlow} />
            <div style={styles.setupWrap}>
              <div style={styles.eyebrow}>HOLDEM TRAVEL</div>
              <h1 style={styles.title}>홀덤 트래블</h1>
              <p style={styles.setupDesc}>버튼-SB-BB가 매 핸드 도는 정식 룰 홀덤입니다.<br />상대할 AI 인원수와 바이인을 선택하세요. 블라인드는 바이인에 맞춰 자동으로 정해져요.</p>

              {/* 💡 추가: 뱅크롤 표시 */}
              <div style={styles.bankrollBadge}>💰 뱅크롤 {meta.bankroll.toLocaleString()}</div>

              {/* 💡 수정: 자유로운 +/- 조절 대신 1/5/8명 중 하나를 고르는 방식으로 변경 */}
              <div style={styles.aiCountControlWrap}>
                {[1, 5, 8].map(n => (
                  <button
                    key={n}
                    style={{ ...styles.buyInPresetBtn, ...(game.aiCount === n ? styles.buyInPresetBtnActive : {}) }}
                    onClick={() => setGame(g => ({ ...g, aiCount: n }))}
                  >
                    AI {n}명
                  </button>
                ))}
              </div>

              {/* 💡 수정: 바이인 프리셋을 한 줄로 늘어놓는 대신 좌우 화살표로 넘기는 캐러셀로 변경 */}
              <div style={styles.setupItemWrap}>
                <div style={styles.setupItemTitle}>바이인 (뱅크롤에서 차감)</div>
                {showAllInOption ? (
                  <div style={styles.buyInCarouselRow}>
                    <button
                      style={{ ...styles.buyInPresetBtn, ...styles.buyInPresetBtnActive }}
                      onClick={() => selectBuyIn(meta.bankroll)}
                    >
                      전액 {meta.bankroll.toLocaleString()}
                    </button>
                  </div>
                ) : (
                  <div style={styles.buyInCarouselRow}>
                    <button style={styles.aiStepBtn} disabled={presetIdx <= 0} onClick={() => cycleBuyIn(-1)}>‹</button>
                    <div style={styles.buyInCarouselCenter}>
                      <div style={{ ...styles.setupValueDisplay, ...(isBuyInUnlocked ? {} : styles.buyInLockedValue) }}>
                        {currentPreset.toLocaleString()}
                      </div>
                      {!isBuyInUnlocked ? (
                        <div style={styles.buyInSubNote}>🔒 뱅크롤 {currentThreshold.toLocaleString()} 이상 필요</div>
                      ) : effectiveBuyIn < currentPreset ? (
                        <div style={styles.buyInSubNote}>보유 뱅크롤이 부족해 실제로는 {effectiveBuyIn.toLocaleString()}으로 시작</div>
                      ) : null}
                    </div>
                    <button
                      style={styles.aiStepBtn}
                      disabled={presetIdx >= BUYIN_PRESETS.length - 1}
                      onClick={() => cycleBuyIn(1)}
                    >
                      ›
                    </button>
                  </div>
                )}
              </div>

              {/* 💡 수정: 블라인드(SB/BB)를 유저가 직접 조절하지 못하게 하고 바이인 기준으로 고정.
                  AI 판단 로직(SPR 커밋 구간, 추천 배팅 사이즈 등)이 전부 'BB ≈ 바이인의 1%'라는
                  전제로 튜닝되어 있어서, 유저가 임의로 블라인드를 크게/작게 바꾸면 그 전제가 깨져서
                  AI가 이상하게 판단할 위험이 있었다. 그래서 조절 UI 자체를 없애고 자동 계산값만 보여준다. */}
              <div style={styles.setupItemWrap}>
                <div style={styles.setupItemTitle}>블라인드 (SB / BB)</div>
                <div style={{ ...styles.setupValueDisplay, alignSelf: "center", width: "auto", whiteSpace: "nowrap" }}>{game.sb.toLocaleString()} / {game.bb.toLocaleString()}</div>
                <div style={styles.buyInSubNote}>게임 진행에 따라 상승합니다.</div>
              </div>

              {/* 💡 수정: 차트 시트 구매 섹션을 '상점' 진입 박스로 교체 */}
              <div style={styles.setupItemWrap}>
                <div style={styles.setupItemTitle}>상점</div>
                <button
                  style={{ ...styles.setupStepBtn, padding: "10px 16px" }}
                  onClick={() => setShowShop(true)}
                >
                  🛒 상점 열기
                </button>
              </div>

              <button
                style={{ ...styles.primaryBtn, marginTop: 12, ...((!showAllInOption && !isBuyInUnlocked) ? styles.buyInPresetBtnDisabled : {}) }}
                disabled={!showAllInOption && !isBuyInUnlocked}
                onClick={beginSetupGame}
              >
                게임 시작
              </button>

              {/* 💡 수정: 뱅크롤=0이 아니어도 언제든 누를 수 있는 환생(전체 초기화) */}
              <div style={styles.devResetLinkWrap}>
                <span style={styles.devResetLink} onClick={handleDevReset}>🔧 환생 (전체 초기화)</span>
              </div>
            </div>
            {modalOverlay}

            {/* 💡 추가: 상점 모달 - 차트 시트는 실제 구매 가능, 나머지 4종은 개발중 표시로 흐리게 */}
            {showShop && (
              <div style={styles.shopOverlay} onClick={() => setShowShop(false)}>
                <div style={styles.shopBox} onClick={e => e.stopPropagation()}>
                  <div style={styles.shopHeader}>
                    <div style={styles.shopTitle}>🛒 상점</div>
                    <button style={styles.shopCloseBtn} onClick={() => setShowShop(false)}>✕</button>
                  </div>
                  <div style={styles.bankrollBadge}>💰 뱅크롤 {meta.bankroll.toLocaleString()}</div>
                  <div style={styles.shopItemList}>
                    {/* 차트 시트 - 실제 구매 가능한 유일한 아이템 */}
                    <div style={styles.shopItem}>
                      <div style={styles.shopItemInfo}>
                        <div style={styles.shopItemName}>🧮 차트 시트</div>
                        <div style={styles.shopItemDesc}>게임 중 팟오즈/아웃츠/SPR/블로커/포지션을 실시간으로 계산해서 보여줍니다.</div>
                      </div>
                      {meta.ownsChartSheet ? (
                        <div style={styles.shopOwnedTag}>✅ 보유중</div>
                      ) : (
                        <button
                          style={{ ...styles.shopBuyBtn, ...(canBuyChartSheet ? {} : styles.buyInPresetBtnDisabled) }}
                          disabled={!canBuyChartSheet}
                          onClick={buyChartSheet}
                        >
                          {CHART_SHEET_PRICE.toLocaleString()}
                        </button>
                      )}
                    </div>

                    {/* 💡 추가: 럭키 코인 토스 - 실제 구매 가능 (전략적 가치 없는 순수 재미 아이템) */}
                    <div style={styles.shopItem}>
                      <div style={styles.shopItemInfo}>
                        <div style={styles.shopItemName}>🪙 럭키 코인 토스</div>
                        <div style={styles.shopItemDesc}>클릭하면 동전이 튀어올라 빙글 돌며 앞/뒷면이 바뀌는 피젯. 판단에는 영향이 없어요.</div>
                      </div>
                      {meta.ownsLuckyCoin ? (
                        <div style={styles.shopOwnedTag}>✅ 보유중</div>
                      ) : (
                        <button
                          style={{ ...styles.shopBuyBtn, ...(canBuyLuckyCoin ? {} : styles.buyInPresetBtnDisabled) }}
                          disabled={!canBuyLuckyCoin}
                          onClick={buyLuckyCoin}
                        >
                          {LUCKY_COIN_PRICE.toLocaleString()}
                        </button>
                      )}
                    </div>

                    {/* 💡 추가: ASMR 칩 셔플 - 실제 구매 가능 */}
                    <div style={styles.shopItem}>
                      <div style={styles.shopItemInfo}>
                        <div style={styles.shopItemName}>🃏 ASMR 칩 셔플</div>
                        <div style={styles.shopItemDesc}>클릭하면 칩 4개가 좌우로 갈라졌다 다시 합쳐지는 피젯. 판단에는 영향이 없어요.</div>
                      </div>
                      {meta.ownsChipShuffle ? (
                        <div style={styles.shopOwnedTag}>✅ 보유중</div>
                      ) : (
                        <button
                          style={{ ...styles.shopBuyBtn, ...(canBuyChipShuffle ? {} : styles.buyInPresetBtnDisabled) }}
                          disabled={!canBuyChipShuffle}
                          onClick={buyChipShuffle}
                        >
                          {CHIP_SHUFFLE_PRICE.toLocaleString()}
                        </button>
                      )}
                    </div>

                    {/* 개발중 아이템 2종 */}
                    {DEV_SHOP_ITEMS.map(item => (
                      <div key={item.name} style={{ ...styles.shopItem, ...styles.shopItemDisabled }}>
                        <div style={styles.shopItemInfo}>
                          <div style={styles.shopItemName}>{item.icon} {item.name}</div>
                          <div style={styles.shopItemDesc}>{item.desc}</div>
                        </div>
                        <div style={styles.shopDevTag}>개발중</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div style={styles.page}>
          <div style={styles.feltGlow} />
          <div style={styles.container}>
            <header style={styles.header}>
              <div>
                <div style={styles.eyebrow}>HOLDEM TRAVEL</div>
                <h1 style={styles.title}>홀덤 트래블</h1>
              </div>
              <div style={styles.headerRight}>
                <div style={styles.handBadge}>
                  {game.handNum > 0 ? `HAND #${game.handNum}` : "대기 중"}
                </div>
                {meta.ownsChartSheet ? (
                  <button
                    style={{ ...styles.resetBtn, ...(practiceMode ? styles.resetBtnActive : {}) }}
                    onClick={() => setPracticeMode(!practiceMode)}
                  >
                    {practiceMode ? "🧮 차트 시트 끄기" : "🧮 차트 시트 켜기"}
                  </button>
                ) : (
                  <button
                    style={{ ...styles.resetBtn, ...styles.buyInPresetBtnDisabled }}
                    onClick={() => showAlert(`차트 시트는 아직 구매하지 않았어요. 다음 퇴장 후 바이인 화면에서 ${CHART_SHEET_PRICE.toLocaleString()}에 구매할 수 있어요.`)}
                  >
                    🧮 차트 시트 (미구매)
                  </button>
                )}
                <button
                  style={{ ...styles.resetBtn, ...(showStats ? styles.resetBtnActive : {}) }}
                  onClick={() => setShowStats(!showStats)}
                >
                  {showStats ? "📊 내 통계 숨기기" : "📊 내 통계 보기"}
                </button>
                <button
                  style={{ ...styles.resetBtn, ...(isMutedBgm ? {} : styles.resetBtnActive) }}
                  onClick={() => setIsMutedBgm(!isMutedBgm)}
                >
                  {isMutedBgm ? "🔇 배경음악 켜기" : "🎵 배경음악 끄기"}
                </button>
                <button
                  style={{ ...styles.resetBtn, ...(isMutedSfx ? {} : styles.resetBtnActive) }}
                  onClick={() => setIsMutedSfx(!isMutedSfx)}
                >
                  {isMutedSfx ? "🔇 효과음 켜기" : "🔊 효과음 끄기"}
                </button>
                <button style={styles.resetBtn} onClick={handleLeaveTable}>퇴장</button>
              </div>
            </header>

            {showStats && (
              <div style={styles.statsPanel}>
                <div style={styles.statsPanelHeader}>
                  📊 내 콜/폴드 판단 경향 (누적 {statsView.handsPlayed}핸드)
                </div>
                {!statsView.sampleEnough ? (
                  <div style={styles.statsEmptyNote}>
                    아직 표본이 부족해요 (콜/폴드 갈림 상황 {statsView.decisionPoints}회 · 최소 {MIN_SAMPLE}회 필요). 핸드를 더 플레이해보세요.
                  </div>
                ) : (
                  <div style={styles.statsGrid}>
                    <div style={styles.statsCard}>
                      <div style={styles.statsCardLabel}>폴드 정확도</div>
                      <div style={styles.statsCardValue}>{statsView.foldAccuracy !== null ? `${statsView.foldAccuracy}%` : "—"}</div>
                      <div style={styles.statsCardSub}>폴드했을 때 정답도 폴드였던 비율</div>
                    </div>
                    <div style={styles.statsCard}>
                      <div style={styles.statsCardLabel}>콜 정확도</div>
                      <div style={styles.statsCardValue}>{statsView.callAccuracy !== null ? `${statsView.callAccuracy}%` : "—"}</div>
                      <div style={styles.statsCardSub}>콜했을 때 정답도 콜이었던 비율</div>
                    </div>
                    <div style={styles.statsCard}>
                      <div style={styles.statsCardLabel}>실제 폴드율 / 정답 폴드율</div>
                      <div style={styles.statsCardValue}>
                        {Math.round(statsView.actualFoldRate * 100)}% / {Math.round(statsView.idealFoldRate * 100)}%
                      </div>
                      <div style={styles.statsCardSub}>{tendencyLabel}</div>
                    </div>
                    <div style={styles.statsCard}>
                      <div style={styles.statsCardLabel}>전체 평균 점수</div>
                      <div style={styles.statsCardValue}>{statsView.avgScore !== null ? `${statsView.avgScore}점` : "—"}</div>
                      <div style={styles.statsCardSub}>모든 액션(폴드/체크/콜/베팅 포함) 평균</div>
                    </div>
                  </div>
                )}
              </div>
            )}

            <div style={styles.body}>
              <div style={styles.tableWrap}>
                <div style={styles.table}>
                  <div style={styles.aiRow}>
                    {aiSeats.map(p => (
                      <AiSeat
                        key={p}
                        id={p}
                        game={game}
                        onRejoin={handleAiRejoin}
                        canRejoin={!(game.phase === "preflop" || game.phase === "flop" || game.phase === "turn" || game.phase === "river")}
                      />
                    ))}
                  </div>

                  <div style={styles.centerArea}>
                    <div style={styles.potRow}>
                      {/* 💡 수정: 헤더에 있던 앤티 표시를 팟 왼쪽으로 이동 */}
                      <div style={styles.anteBadgeSmall}>SB/BB {game.sb.toLocaleString()}/{game.bb.toLocaleString()} (Lv.{(game.blindLevel || 0) + 1})</div>
                      <div style={styles.potWrap}>
                        <span style={styles.potLabel}>POT</span>
                        <span style={styles.potValue}>{game.pot.toLocaleString()}</span>
                      </div>
                    </div>
                    <div style={styles.communityRow}>
                      {[0, 1, 2, 3, 4].map(i => (
                        <CardView key={i} card={game.community[i]} placeholder />
                      ))}
                    </div>
                    <div style={styles.phaseLabel}>
                      {game.phase === "idle" && "게임을 시작하세요"}
                      {game.phase === "flop" && "FLOP 베팅"}
                      {game.phase === "turn" && "TURN 베팅"}
                      {game.phase === "river" && "RIVER 베팅"}
                      {(game.phase === "showdown" || game.phase === "foldwin") && "핸드 종료"}
                    </div>
                  </div>

                  <div style={styles.userRow}>
                    <div style={styles.userInfoWithItems}>
                      {/* 💡 나(User)의 승리 확인 및 하이라이트 처리 */}
                      {(() => {
                        const winAmountUser = game.handWinners ? (game.handWinners['user'] || 0) : 0;
                        const isUserWinner = winAmountUser > 0 && (game.phase === "showdown" || game.phase === "foldwin");
                        // 💡 추가: 유저 좌석이 현재 딜러 버튼인지 확인
                        const isUserButton = game.started && game.players[game.buttonIndex] === "user";
                        // 💡 추가: 유저 좌석의 표준 포지션 이름
                        const userPositionName = (game.started && !game.eliminated.user)
                          ? getPositionName("user", game.players, game.buttonIndex)
                          : null;

                        return (
                          <div style={{
                            ...styles.userInfo,
                            ...(isUserCurrent ? styles.activeActor : {}),
                            ...(isUserWinner ? styles.winnerGlow : {}), // 황금빛 테두리 효과
                            position: "relative" // 배지 위치를 잡기 위해 추가
                          }}>
                            {/* 💡 추가: 딜러 버튼 마커 */}
                            {isUserButton && <div style={styles.dealerButton}>D</div>}
                            {/* 💡 플레이어 승리 배지 (박스 상단 중앙) */}
                            {isUserWinner && (
                              <div style={{ ...styles.winBadge, top: -14, left: "50%", transform: "translateX(-50%)" }}>
                                +{winAmountUser.toLocaleString()}
                              </div>
                            )}
                            <div style={styles.seatName}>
                              나 (User)
                              {userPositionName && <span style={styles.positionTag}>{userPositionName}</span>}
                            </div>
                            <div style={styles.seatChips}>칩 {userChips.toLocaleString()}</div>
                            {game.lastAction.user && !game.awaitingUser && !isUserWinner && (
                              <div style={styles.actionBadge}>{game.lastAction.user}</div>
                            )}
                            {game.eliminated.user && <div style={styles.badBadge}>탈락</div>}
                          </div>
                        );
                      })()}

                      {/* 💡 수정: 구매한 피젯 아이템들이 유저 박스 오른쪽에 나열됨 (럭키 코인 + 칩 셔플).
                          앞으로 더 늘어날 걸 감안해 목록형 컨테이너로 구성. 아직 '챙겨갈 아이템 선택' 기능은
                          없어서 보유한 아이템은 항상 전부 표시됨 */}
                      {(meta.ownsLuckyCoin || meta.ownsChipShuffle) && (
                        <div style={styles.fidgetItemsRow}>
                          {meta.ownsLuckyCoin && <LuckyCoin isMutedSfx={isMutedSfx} />}
                          {meta.ownsChipShuffle && <ChipShuffleFidget isMutedSfx={isMutedSfx} />}
                        </div>
                      )}
                    </div>
                    <div style={styles.userCards}>
                      {(game.hole.user || [undefined, undefined]).map((c, i) => (
                        <CardView key={i} card={c} big />
                      ))}
                    </div>
                  </div>
                </div>

                <div style={styles.actionPanel}>
                  {!game.started && !game.over && (
                    <button style={styles.primaryBtn} onClick={playHand}>첫 핸드 시작</button>
                  )}

                  {game.started && (game.phase === "showdown" || game.phase === "foldwin") && !game.over && (
                    <div style={styles.resultWrap}>
                      <ResultBanner game={game} />
                      
                      {/* 💡 수정: 전원 폴드로 끝난 경우뿐 아니라, 실제 쇼다운이어도 그 전에 중간에
                          폴드한 상대가 있으면(끝까지 남은 사람 카드는 이미 자동 공개되지만, 폴드한
                          사람 카드는 계속 숨겨져 있었음) 버튼을 표시해서 확인할 수 있게 함 */}
                      {(() => {
                        const hasFoldedOpponents = game.players.some(p => p !== "user" && !game.eliminated[p] && game.folded[p]);
                        const showRevealBtn = !game.revealCards && (game.phase === "foldwin" || (game.phase === "showdown" && hasFoldedOpponents));
                        return showRevealBtn && (
                          <button 
                            style={{ ...styles.analysisBtn, marginTop: 12 }} 
                            onClick={() => setGame(g => ({ ...g, revealCards: true }))}
                          >
                            👀 상대 패 확인하기
                          </button>
                        );
                      })()}
                      
                      <button style={{ ...styles.primaryBtn, marginTop: 16 }} onClick={playHand}>다음 핸드</button>
                    </div>
                  )}

                  {game.over && game.gameWon && (
                    <div style={styles.resultWrap}>
                      <div className="victory-badge" style={styles.victoryBadge}>🏆</div>
                      <div style={styles.victoryText}>완전 승리! 모든 상대를 파산시켰습니다</div>
                      <div style={styles.victoryStatsRow}>
                        <div style={styles.victoryStatItem}>
                          <div style={styles.victoryStatLabel}>최종 칩</div>
                          <div style={styles.victoryStatValue}>{(game.chips.user || 0).toLocaleString()}</div>
                        </div>
                        <div style={styles.victoryStatItem}>
                          <div style={styles.victoryStatLabel}>진행한 핸드</div>
                          <div style={styles.victoryStatValue}>{game.handNum}</div>
                        </div>
                        <div style={styles.victoryStatItem}>
                          <div style={styles.victoryStatLabel}>바이인 대비</div>
                          <div style={styles.victoryStatValue}>

                      </div>

                    <div style={styles.resultWrap}>
                      <div style={styles.gameOverText}>테이블 파산 — 이번 바이인을 모두 잃었습니다</div>
