<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>홀덤 트래블 (Holdem Travel)</title>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone (JSX 변환용) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0f0c;
      font-family: 'Georgia', 'Noto Serif KR', serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(201, 164, 76, 0.4);
      border-radius: 3px;
    }

    @keyframes victoryPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(201,164,76,0.5)); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 22px rgba(201,164,76,0.9)); }
    }
    .victory-badge {
      animation: victoryPulse 1.7s ease-in-out infinite;
    }

    /* 💡 추가: 럭키 코인 토스(피젯) 애니메이션 - 점프(상하 이동)와 그림자 수축을 분리해서
       입체감을 만든다. 회전(rotateY)은 인라인 style의 transition으로 별도 처리. */
    @keyframes coinJump {
      0% { transform: translateY(0); }
      50% { transform: translateY(-70px); }
      100% { transform: translateY(0); }
    }
    @keyframes shadowShrink {
      0% { transform: translateX(-50%) scale(1); opacity: 0.7; }
      50% { transform: translateX(-50%) scale(0.4); opacity: 0.2; }
      100% { transform: translateX(-50%) scale(1); opacity: 0.7; }
    }
    .coin-jumping {
      animation: coinJump 0.8s ease-in-out forwards;
    }
    .shadow-shrinking {
      animation: shadowShrink 0.8s ease-in-out forwards;
    }

    /* 💡 1.2초 버전에 맞춘 타이밍 재분배
       - 0~15%: 양옆으로 갈라짐
       - 15~32%: 가운데로 밀어넣으며 텐트 모양(아치) 만들기
       - 32~68%: L1부터 R3까지 순차적으로 하강하며 지그재그 정렬
       - 68~85%: 지그재그 상태 유지(Hold)하며 시각적 만족감 제공
       - 85~100%: 부드럽게 중앙으로 슬라이드하며 최종 정렬 (부자연스러움 해결) */

    @keyframes shuffleL1 {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-22px, 0) rotate(0deg); }
      32% { transform: translate(-17px, -14px) rotate(-28deg); }
      38%, 85% { transform: translate(-8px, 0) rotate(0deg); } 
      100% { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    }
    
    @keyframes shuffleR1 {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(22px, 6px) rotate(0deg); }
      32%, 38% { transform: translate(17px, -8px) rotate(28deg); } 
      44%, 85% { transform: translate(8px, 0) rotate(0deg); }      
      100% { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    }

    @keyframes shuffleL2 {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-22px, 6px) rotate(0deg); }
      32% { transform: translate(-17px, -8px) rotate(-28deg); }
      38%, 44% { transform: translate(-18px, -11px) rotate(-31deg); } 
      50%, 85% { transform: translate(-8px, 0) rotate(0deg); }     
      100% { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    }

    @keyframes shuffleR2 {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(22px, 12px) rotate(0deg); }
      32%, 38% { transform: translate(17px, -2px) rotate(28deg); }
      44%, 50% { transform: translate(18px, -5px) rotate(31deg); }
      56%, 85% { transform: translate(8px, 0) rotate(0deg); }      
      100% { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    }

    @keyframes shuffleL3 {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-22px, 12px) rotate(0deg); }
      32% { transform: translate(-17px, -2px) rotate(-28deg); }
      38%, 44% { transform: translate(-18px, -5px) rotate(-31deg); } 
      50%, 56% { transform: translate(-19px, -8px) rotate(-34deg); } 
      62%, 85% { transform: translate(-8px, 0) rotate(0deg); }     
      100% { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    }

    @keyframes shuffleR3 {
      0% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(22px, 18px) rotate(0deg); }
      32%, 38% { transform: translate(17px, 4px) rotate(28deg); }
      44%, 50% { transform: translate(18px, 1px) rotate(31deg); }
      56%, 62% { transform: translate(19px, -2px) rotate(34deg); }
      68%, 85% { transform: translate(8px, 0) rotate(0deg); }      
      100% { transform: translate(0, 0) rotate(0deg); animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    }

    @keyframes shadowPulseFlat {
      0% { transform: translateX(-50%) scaleX(1); opacity: 0.5; }
      15% { transform: translateX(-50%) scaleX(2.0); opacity: 0.2; }
      32% { transform: translateX(-50%) scaleX(1.6); opacity: 0.2; }
      85% { transform: translateX(-50%) scaleX(1.3); opacity: 0.35; }
      100% { transform: translateX(-50%) scaleX(1); opacity: 0.5; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); }
    }

    /* 애니메이션 시간을 1.2s로 연장 */
    .shuffle-l1 { animation: shuffleL1 1.2s cubic-bezier(0.3, 0.8, 0.3, 1) forwards; }
    .shuffle-r1 { animation: shuffleR1 1.2s cubic-bezier(0.3, 0.8, 0.3, 1) forwards; }
    .shuffle-l2 { animation: shuffleL2 1.2s cubic-bezier(0.3, 0.8, 0.3, 1) forwards; }
    .shuffle-r2 { animation: shuffleR2 1.2s cubic-bezier(0.3, 0.8, 0.3, 1) forwards; }
    .shuffle-l3 { animation: shuffleL3 1.2s cubic-bezier(0.3, 0.8, 0.3, 1) forwards; }
    .shuffle-r3 { animation: shuffleR3 1.2s cubic-bezier(0.3, 0.8, 0.3, 1) forwards; }
    .shadow-pulse-flat { animation: shadowPulseFlat 1.2s cubic-bezier(0.3, 0.8, 0.3, 1) forwards; }
  </style>
</head>


<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const SUITS = ["♠", "♥", "♦", "♣"];
    const SUIT_COLOR = { "♠": "#181818", "♣": "#181818", "♥": "#c0392b", "♦": "#c0392b" };
    const RANK_LABEL = { 11: "J", 12: "Q", 13: "K", 14: "A" };

    const CAT_NAME = {
      0: "하이카드", 1: "원페어", 2: "투페어", 3: "트리플",
      4: "스트레이트", 5: "플러시", 6: "풀하우스", 7: "포카드", 8: "스트레이트 플러시",
    };


    //  --- 새로 추가할 사운드  ---
    const SOUND_URLS = {
      bgm: "./audio/bgm.mp3",
      shuffle: "./audio/card.mp3",
      bet: "./audio/call.mp3",
      call: "./audio/call.mp3",
      fold: "./audio/fold.mp3",
      win: "./audio/win.mp3",
      check: "./audio/check.mp3",
      coin: "./audio/coin.mp3",
      chip_ASMR: "./audio/chip_ASMR.mp3" // 💡 추가: 칩 셔플 전용 ASMR 사운드
    };

    // 💡 추가: 바이인 시스템 - 뱅크롤(세션을 넘어 유지되는 총자산)과 차트 시트(구 연습모드) 구매 여부를
    // localStorage에 저장해 브라우저를 새로고침/재방문해도 이어지도록 함.
    const META_STORAGE_KEY = "noPreflopHoldem_meta_v1";
    const DEFAULT_BANKROLL = 100000;
    const BUYIN_PRESETS = [10000, 50000, 100000, 500000, 1000000];
    // 💡 수정: 배수(뱅크롤/바이인)가 1.0 → 1.2 → 1.5 → 1.6 → 2.0으로 매끄럽게 커지도록 재설계.
    // 1만/5만은 시작 뱅크롤(10만)로 처음부터 둘 다 열려있고, 위로 갈수록 "연승이 필요한" 느낌이 강해진다.
    const BUYIN_THRESHOLDS = {
      10000: 10000,     // 1만 방: 언제든 입장 가능 (기본)
      50000: 60000,     // 5만 방: 1.2배수 (초기 자금 10만이면 시작부터 열려있음!)
      100000: 150000,   // 10만 방: 1.5배수 (5만 방에서 한 번만 크게 이기면 바로 해금)
      500000: 800000,   // 50만 방: 1.6배수 (여기서부터 슬슬 연승이 필요함)
      1000000: 2000000, // 100만 방: 2배수 (최종 보스 방. 진정한 고수만 도달 가능)
    };
    const CHART_SHEET_PRICE = 20000;
    // 💡 추가: 럭키 코인 토스(피젯) 기본 티어 가격. 전략적 가치가 없는 순수 재미 아이템이라
    // 실제 판단력에 영향을 주는 차트 시트보다 낮게 잡았다. 은화/금화/다이아몬드/홀로그램 같은
    // 업그레이드 티어는 이번엔 범위 밖 - 나중에 별도로 추가.
    const LUCKY_COIN_PRICE = 5000;
    // 💡 추가: ASMR 칩 셔플 가격. 럭키 코인과 같은 "기본 피젯" 티어라 동일하게 책정.
    const CHIP_SHUFFLE_PRICE = 5000;

    // 💡 수정: 블라인드 상승 사다리 - 토너먼트 블라인드 구조처럼, 임의의 계산값이 아니라 정해진 배수
    // 단위로만 오르도록 함. 시작 BB(initialBB)에 이 배수를 곱해서 각 레벨의 BB를 만든다.
    const BLIND_LEVEL_MULTIPLIERS = [1, 1.5, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64, 100];

    // 💡 수정: 럭키 코인 토스, ASMR 칩 셔플은 실제 구매 가능해졌으므로 제거. 나머지 2개는 여전히 개발중.
    const DEV_SHOP_ITEMS = [
      { icon: "🍅", name: "분노의 투척 아이템", desc: "AI에게 토마토·달걀 등을 던지는 틸트 관리 아이템" },
      { icon: "🎨", name: "VIP 테이블 펠트 & 네임플레이트", desc: "테이블 색상과 좌석 테두리를 바꾸는 스킨" },
    ];

    function loadMeta() {
      try {
        const raw = localStorage.getItem(META_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          let bankroll = typeof parsed.bankroll === "number" && isFinite(parsed.bankroll) ? parsed.bankroll : DEFAULT_BANKROLL;
          // 💡 추가: '퇴장' 버튼 없이 창을 그냥 닫아서 세션이 끝났다면 checkpointChips가 남아있다.
          // 정상적으로 퇴장했다면 handleLeaveTable에서 이미 null로 지워졌을 것이므로, 여기 남아있다는
          // 것 자체가 '비정상 종료'라는 신호다. 그 시점의 테이블 칩을 뱅크롤에 자동으로 합쳐서 복구한다.
          const checkpointChips = typeof parsed.checkpointChips === "number" && isFinite(parsed.checkpointChips) ? parsed.checkpointChips : null;
          if (checkpointChips !== null && checkpointChips > 0) {
            bankroll += checkpointChips;
          }
          const result = {
            bankroll,
            ownsChartSheet: !!parsed.ownsChartSheet,
            ownsLuckyCoin: !!parsed.ownsLuckyCoin, // 💡 추가: 럭키 코인 토스 구매 여부
            ownsChipShuffle: !!parsed.ownsChipShuffle, // 💡 추가: ASMR 칩 셔플 구매 여부
            checkpointChips: null, // 복구를 마쳤으니 즉시 소비(초기화) - 중복 합산 방지
          };
          // 💡 체크포인트를 실제로 소비(복구)했다면, 그 결과를 바로 저장해서 이 시점 이후 새로고침해도
          // 같은 칩이 또 합산되지 않도록 한다.
          if (checkpointChips !== null) {
            saveMeta(result);
          }
          return result;
        }
      } catch (e) { /* localStorage 접근 불가 등 - 기본값으로 폴백 */ }
      return { bankroll: DEFAULT_BANKROLL, ownsChartSheet: false, ownsLuckyCoin: false, ownsChipShuffle: false, checkpointChips: null };
    }

    function saveMeta(meta) {
      try {
        localStorage.setItem(META_STORAGE_KEY, JSON.stringify(meta));
      } catch (e) { /* 저장 실패는 무시 - 세션 내 플레이 자체는 계속 가능해야 함 */ }
    }

    const audios = {};
    // 사운드 사전 로딩 및 볼륨 세팅
    Object.keys(SOUND_URLS).forEach(key => {
      audios[key] = new Audio(SOUND_URLS[key]);
      if (key === 'bgm') {
        audios[key].loop = true;
        audios[key].volume = 0.2; // BGM은 방해 안 되게 작게
      } else {
        audios[key].volume = 0.6;
      }
    });

    const playSound = (type, mutedBgm, mutedSfx) => {
      const isThisMuted = type === 'bgm' ? mutedBgm : mutedSfx;
      if (isThisMuted || !audios[type]) return;
      if (type !== 'bgm') {
        // 효과음은 겹쳐서 재생될 수 있도록 복제해서 실행
        const sound = audios[type].cloneNode();
        sound.volume = audios[type].volume;
        sound.play().catch(e => console.log("사운드 재생 에러:", e));
      } else {
        audios[type].play().catch(e => console.log("BGM 에러:", e));
      }
    };

    const stopBGM = () => {
      if (audios.bgm) {
        audios.bgm.pause();
        audios.bgm.currentTime = 0;
      }
    };
    // ---------------------------------
    function getNoisyThreshold(base, variance) {
      const noise = (Math.random() * variance * 2) - variance;
      return Math.max(0, Math.min(1, base + noise));
    }

    function freshDeck() {
      const deck = [];
      for (const s of SUITS) for (let r = 2; r <= 14; r++) deck.push({ rank: r, suit: s });
      return deck;
    }

    function shuffle(deck) {
      const d = [...deck];
      for (let i = d.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [d[i], d[j]] = [d[j], d[i]];
      }
      return d;
    }

    function rankLabel(r) { return RANK_LABEL[r] || String(r); }

    function combinations(arr, k) {
      const res = [];
      const combo = [];
      function go(start) {
        if (combo.length === k) { res.push([...combo]); return; }
        for (let i = start; i < arr.length; i++) {
          combo.push(arr[i]);
          go(i + 1);
          combo.pop();
        }
      }
      go(0);
      return res;
    }

    function evaluate5(cards) {
      const ranks = cards.map(c => c.rank).sort((a, b) => b - a);
      const suits = cards.map(c => c.suit);
      const isFlush = suits.every(s => s === suits[0]);

      const countMap = {};
      ranks.forEach(r => (countMap[r] = (countMap[r] || 0) + 1));
      const groups = Object.entries(countMap)
        .map(([r, c]) => ({ rank: Number(r), count: c }))
        .sort((a, b) => (b.count - a.count) || (b.rank - a.rank));

      const uniqueRanksDesc = [...new Set(ranks)];
      let straightHigh = null;
      if (uniqueRanksDesc.length >= 5) {
        for (let i = 0; i <= uniqueRanksDesc.length - 5; i++) {
          const window = uniqueRanksDesc.slice(i, i + 5);
          if (window[0] - window[4] === 4) { straightHigh = window[0]; break; }
        }
      }
      if (straightHigh === null) {
        const wheel = [14, 5, 4, 3, 2];
        if (wheel.every(r => uniqueRanksDesc.includes(r))) straightHigh = 5;
      }
      const isStraight = straightHigh !== null;

      let cat, tiebreak;
      if (isStraight && isFlush) { cat = 8; tiebreak = [straightHigh]; }
      else if (groups[0].count === 4) {
        const kicker = ranks.find(r => r !== groups[0].rank);
        cat = 7; tiebreak = [groups[0].rank, kicker];
      } else if (groups[0].count === 3 && groups[1] && groups[1].count >= 2) {
        cat = 6; tiebreak = [groups[0].rank, groups[1].rank];
      } else if (isFlush) { cat = 5; tiebreak = [...ranks]; }
      else if (isStraight) { cat = 4; tiebreak = [straightHigh]; }
      else if (groups[0].count === 3) {
        const kickers = ranks.filter(r => r !== groups[0].rank).slice(0, 2);
        cat = 3; tiebreak = [groups[0].rank, ...kickers];
      } else if (groups[0].count === 2 && groups[1] && groups[1].count === 2) {
        const pairRanks = [groups[0].rank, groups[1].rank].sort((a, b) => b - a);
        const kicker = ranks.find(r => r !== pairRanks[0] && r !== pairRanks[1]);
        cat = 2; tiebreak = [...pairRanks, kicker];
      } else if (groups[0].count === 2) {
        const kickers = ranks.filter(r => r !== groups[0].rank).slice(0, 3);
        cat = 1; tiebreak = [groups[0].rank, ...kickers];
      } else { cat = 0; tiebreak = ranks.slice(0, 5); }

      return { cat, tiebreak, cards };
    }

    function compareScore(a, b) {
      if (a.cat !== b.cat) return a.cat - b.cat;
      for (let i = 0; i < Math.max(a.tiebreak.length, b.tiebreak.length); i++) {
        const x = a.tiebreak[i] || 0, y = b.tiebreak[i] || 0;
        if (x !== y) return x - y;
      }
      return 0;
    }

    function evaluateBest(cards) {
      if (cards.length <= 5) return evaluate5(cards);
      const combos = combinations(cards, 5);
      let best = null;
      for (const c of combos) {
        const ev = evaluate5(c);
        if (!best || compareScore(ev, best) > 0) best = ev;
      }
      return best;
    }

    function handLabel(ev) {
      if (ev.cat === 8 && ev.tiebreak[0] === 14) return "로열 스트레이트 플러시";
      return CAT_NAME[ev.cat];
    }

    // 💡 추가: 프리플랍 홀카드 2장의 가치를 점수로 환산하는 첸 포뮬러(Chen Formula) - 레인지 차트를
    // 하드코딩하는 대신, 가벼운 계산 하나로 어떤 홀카드 조합이든 즉시 '전투력 점수'를 매긴다.
    // 원본 룰(단순화 버전 아님)을 그대로 구현:
    //   [1] 높은 카드 기준 점수: A=10, K=8, Q=7, J=6, T=5, 9 이하는 rank/2
    //   [2] 페어면: 위 점수 x2, 단 최소 5점 보장 (22 = max(2, 5) = 5)
    //   [3] 페어가 아니면:
    //      - 수티드면 +2
    //      - 갭(간격) 페널티: gap=0(커넥터) 0점, gap=1 -1점, gap=2 -2점, gap=3 -4점, gap>=4 -5점
    //        (gap = 높은 카드 랭크 - 낮은 카드 랭크 - 1, 예: KQ는 gap 0, K9는 gap 3)
    //      - 커넥터 보너스: gap이 0~1이고 높은 카드가 퀸(Q) 미만(J 이하)이면 +1
    //        (하이카드끼리는 이미 점수가 높아서 스트레이트 잠재력 보너스를 따로 안 줌)
    //   [4] 최종 점수는 올림 처리 (소수점 발생 시 위로 반올림)
    // 결과는 클램프하지 않는다 - 72o처럼 진짜 나쁜 조합은 음수(-1 등)가 나올 수 있는데, 이건 실제
    // 첸 포뮬러 계산 결과와 일치하며, AI 판단에서는 그냥 "매우 낮은 점수"로 자연스럽게 처리되면 된다.
    function evaluatePreflop(holeCards) {
      const [c1, c2] = holeCards;
      const isPair = c1.rank === c2.rank;
      const highRank = Math.max(c1.rank, c2.rank);
      const lowRank = Math.min(c1.rank, c2.rank);
      const isSuited = c1.suit === c2.suit;

      const cardScore = rank => {
        if (rank === 14) return 10; // A
        if (rank === 13) return 8;  // K
        if (rank === 12) return 7;  // Q
        if (rank === 11) return 6;  // J
        if (rank === 10) return 5;  // T
        return rank / 2;            // 2~9
      };

      let score;
      if (isPair) {
        score = Math.max(cardScore(highRank) * 2, 5);
      } else {
        score = cardScore(highRank);
        if (isSuited) score += 2;

        const gap = highRank - lowRank - 1;
        if (gap === 1) score -= 1;
        else if (gap === 2) score -= 2;
        else if (gap === 3) score -= 4;
        else if (gap >= 4) score -= 5;

        // 커넥터(스트레이트 잠재력) 보너스: 간격 0~1 & 높은 카드가 J 이하일 때만
        if (gap <= 1 && highRank < 12) score += 1;
      }

      return Math.ceil(score);
    }

    // 💡 추가: 첸 포뮬러 점수를 '상위 %'로 환산하는 테이블. 대충 추측한 게 아니라 실제로 가능한
    // 1326가지 홀카드 조합(52장 중 2장) 전부의 첸 스코어를 계산해서 만든 정확한 분포표다.
    // [최소점수, 그 점수 이상을 받는 조합의 비율(%)] - 내림차순.
    const CHEN_PERCENTILE_TABLE = [
      [20, 0.5], [16, 0.9], [14, 1.4], [12, 2.1], [11, 2.4], [10, 4.4],
      [9, 6.6], [8, 10.7], [7, 17.8], [6, 25.5], [5, 43.3], [4, 51.7],
      [3, 67.1], [2, 78.9], [1, 88.2], [0, 96.4], [-1, 100],
    ];
    function chenScoreToTopPercent(score) {
      for (const [threshold, pct] of CHEN_PERCENTILE_TABLE) {
        if (score >= threshold) return pct;
      }
      return 100;
    }

    // 💡 추가: 스트레이트/플러시를 제외한, 랭크 카운트만으로 판정 가능한 족보 카테고리 계산.
    // evaluateBest/evaluate5를 5장 미만 카드에 쓰면 isFlush 오탐(4장이 우연히 같은 무늬여도 flush로 오판)이
    // 발생할 수 있어, '보드 카드만으로 이 카테고리에 도달 가능한가'를 안전하게 확인하기 위해 별도로 둡니다.
    function bestMadeCategoryFromRanks(ranks) {
      const countMap = {};
      ranks.forEach(r => { countMap[r] = (countMap[r] || 0) + 1; });
      const groups = Object.values(countMap).sort((a, b) => b - a);
      if (!groups.length) return 0;
      if (groups[0] >= 4) return 7; // 포카드
      if (groups[0] === 3 && groups[1] >= 2) return 6; // 풀하우스
      if (groups[0] === 3) return 3; // 트리플
      if (groups[0] === 2 && groups[1] === 2) return 2; // 투페어
      if (groups[0] === 2) return 1; // 원페어
      return 0; // 하이카드
    }

    function calculateDrawOuts(cards, hole) {
      if (cards.length >= 7) {
        return { outs: 0, hitChance: 0, drawType: "리버(추가 카드 없음)" };
      }
      const currentEv = evaluateBest(cards);
      // 💡 수정: 메이드 핸드(스트레이트 이상)도 조기 리턴하지 않고 아래 루프에서
      // 리드로우(예: 스트레이트→플러시/풀하우스 개선)까지 정밀하게 계산합니다.

      // 💡 추가: '탑/미들 페어급'인지 판정하기 위해, 그리고 '보드만으로 도달 가능한 카테고리'를 확인하기 위해
      // 보드(커뮤니티) 카드만 따로 추립니다. (getRelativeStrength의 탑/미들/바텀 페어 판정 기준과 동일하게 맞춤)
      const holeIdSet = new Set((hole || []).map(c => `${c.rank}${c.suit}`));
      const communityCards = cards.filter(c => !holeIdSet.has(`${c.rank}${c.suit}`));
      const communityRanksBase = communityCards.map(c => c.rank);
      const boardRanksDesc = [...new Set(communityRanksBase)].sort((a, b) => b - a);
      const topBoardRank = boardRanksDesc[0] || 0;
      const secondBoardRank = boardRanksDesc[1] || 0;

      const seen = new Set(cards.map(c => `${c.rank}${c.suit}`));
      let deck = [];
      for (const s of SUITS) {
        for (let r = 2; r <= 14; r++) {
          if (!seen.has(`${r}${s}`)) deck.push({ rank: r, suit: s });
        }
      }

      let flushOuts = 0;
      let straightOuts = 0;
      // 💡 추가: 메이드핸드 개선 아웃츠 (원페어→투페어/트리플, 투페어→풀하우스, 트리플→포카드/풀하우스 등)
      let madeHandOuts = 0;
      // 💡 추가: 오버카드 → 원페어 아웃츠 (하이카드 상태에서만 집계, 탑/미들페어급만 인정 - 아래 참고)
      let overcardOuts = 0;

      for (const card of deck) {
        const testCards = [...cards, card];
        const ev = evaluateBest(testCards);
        if (ev.cat <= currentEv.cat) continue; // 카테고리가 오르지 않으면 실질적 발전이 아님

        if (ev.cat === 5 || ev.cat === 8) { flushOuts++; continue; }
        if (ev.cat === 4) { straightOuts++; continue; }

        // 💡 핵심 수정: '새 카드의 랭크가 내 홀카드 랭크와 문자 그대로 일치하는가' 대신
        // '보드 카드만으로도 같은(또는 더 나은) 카테고리에 도달 가능한가'로 판정합니다.
        // 예: 트리플(홀카드 1장 + 보드 2장)일 때 나머지 킥커(보드 카드)가 페어링되어 풀하우스가 되는 경우,
        // 그 킥커 랭크는 홀카드와 다르지만 내 트리플이 있어야만 풀하우스가 성립하므로 '진짜 내 아웃'입니다.
        // 반대로 보드만으로 이미 같은 카테고리에 도달한다면(예: 관계없는 보드 카드끼리 페어링) 모두가 공유하는
        // 발전이므로 제외합니다.
        const boardOnlyCat = bestMadeCategoryFromRanks([...communityRanksBase, card.rank]);
        if (ev.cat <= boardOnlyCat) continue; // 보드만으로 이미 동일 이상 도달 가능 → 내 기여 없음, 제외

        if (currentEv.cat === 0) {
          // 💡 중요: 바텀페어급 페어링(보드 2위 카드보다 낮음)은 실전에서 이길 확률이 낮아
          // '진짜 아웃'으로 세지 않습니다. 보드 2위 카드 이상과 페어링될 때(탑/미들페어급)만 인정
          // — getRelativeStrength가 페어 강도를 판정하는 기준과 동일하게 맞췄습니다.
          if (card.rank >= secondBoardRank) overcardOuts++;
        } else {
          madeHandOuts++;
        }
      }

      const outs = flushOuts + straightOuts + madeHandOuts + overcardOuts;
      let drawType = "없음";
      if (flushOuts >= 9) drawType = "플러시 드로우";
      else if (straightOuts >= 8) drawType = "양빵(오픈엔디드) 드로우";
      else if (straightOuts > 0) drawType = "빵꾸(거츠샷) 드로우";
      else if (madeHandOuts >= 5) drawType = "메이드핸드 개선 드로우 (투페어/트리플/풀하우스 등)";
      else if (madeHandOuts > 0) drawType = "약한 메이드핸드 개선 드로우";
      else if (overcardOuts >= 3) drawType = "탑/미들페어 형성 드로우";
      else if (outs > 0) drawType = "마이너 드로우";
      else if (currentEv.cat >= 4) drawType = "메이드(추가 발전 없음)";

      // 💡 수정: 4/2룰(근사치) 대신 정확한 조합 확률로 hitChance 계산
      const cardsLeft = 7 - cards.length;
      const unseen = deck.length;
      let hitChance = 0;
      if (outs > 0 && unseen > 0) {
        if (cardsLeft === 2) {
          // 남은 2장(턴+리버) 중 최소 한 장이 아웃일 확률 = 1 - (아웃 아닌 카드 2장을 뽑을 확률)
          const missBottom = unseen * (unseen - 1);
          const missTop = (unseen - outs) * (unseen - outs - 1);
          hitChance = missBottom > 0 ? 1 - (missTop / missBottom) : 0;
        } else if (cardsLeft === 1) {
          hitChance = outs / unseen; // 리버 한 장만 남은 경우
        }
      }
      hitChance = Math.max(0, Math.min(1, hitChance));

      return { outs, hitChance, drawType };
    }

    // 💡 추가: SPR(Stack-to-Pot Ratio, 스택 대 팟 비율) 계산.
    // effectiveStack = 이 팟에 아직 살아있는 플레이어들 중 가장 짧은 스택(그 이상은 실질적으로 못 걸림).
    // 💡 추가: 블로커(카드 제거 효과) 계산.
    // 내 홀카드가 상대의 특정 '너트급' 조합을 물리적으로 줄여주는지 확인한다.
    // - 너트 플러시 블로커: 보드에 3장 이상 깔린 무늬의 A를 들고 있으면, 상대가 그 무늬 너트 플러시를 들 수 없음
    // - 트리플/풀하우스 블로커: 보드가 페어링된 랭크를 들고 있으면, 상대가 그 랭크로 트리플/포카드를 만들 콤보가 줄어듦
    function calculateBlockers(hole, community) {
      if (!hole || hole.length === 0 || !community || community.length === 0) {
        return { blocksNutFlush: false, blocksSecondNutFlush: false, blocksTrips: false, hasKeyBlocker: false, blockerNote: "" };
      }

      const suitCounts = { "♠": 0, "♥": 0, "♦": 0, "♣": 0 };
      community.forEach(c => { suitCounts[c.suit]++; });
      const flushSuit = Object.keys(suitCounts).find(s => suitCounts[s] >= 3);

      let blocksNutFlush = false;
      let blocksSecondNutFlush = false;
      if (flushSuit) {
        const holeSuited = hole.filter(c => c.suit === flushSuit);
        blocksNutFlush = holeSuited.some(c => c.rank === 14);
        blocksSecondNutFlush = !blocksNutFlush && holeSuited.some(c => c.rank === 13);
      }

      const communityRankCounts = {};
      community.forEach(c => { communityRankCounts[c.rank] = (communityRankCounts[c.rank] || 0) + 1; });
      const pairedRanks = Object.keys(communityRankCounts).map(Number).filter(r => communityRankCounts[r] >= 2);
      const blocksTrips = pairedRanks.some(r => hole.some(c => c.rank === r));

      const hasKeyBlocker = blocksNutFlush || blocksTrips;

      const notes = [];
      if (blocksNutFlush) notes.push("너트 플러시 블로커 보유");
      else if (blocksSecondNutFlush) notes.push("세컨 너트 플러시 블로커 보유");
      if (blocksTrips) notes.push("보드 페어 랭크를 들고 있어 상대 트리플/풀하우스 가능성 낮춤");

      return { blocksNutFlush, blocksSecondNutFlush, blocksTrips, hasKeyBlocker, blockerNote: notes.join(", ") };
    }

    // 💡 수정: 포지션 계산. 스트리트마다 액션 순서(버튼 기준 동적 큐)가 다르므로, '이번 스트리트에서
    // 나보다 늦게 액션하는 인원 수'가 곧 실질적인 포지션(정보 우위)이 된다. 늦게 액션할수록
    // (actorsRemainingAfterMe가 작을수록) 유리.
    function calculatePosition(actorsRemainingAfterMe, totalActive) {
      if (totalActive <= 1) return { tier: "late", label: "포지션 우위(마지막 액션)", actorsRemainingAfterMe };
      if (actorsRemainingAfterMe === 0) return { tier: "late", label: "포지션 우위 (마지막 액션)", actorsRemainingAfterMe };
      const ratio = actorsRemainingAfterMe / (totalActive - 1);
      let tier, label;
      if (ratio <= 0.34) { tier = "late"; label = "레이트 포지션"; }
      else if (ratio <= 0.67) { tier = "middle"; label = "미들 포지션"; }
      else { tier = "early"; label = "얼리 포지션"; }
      return { tier, label, actorsRemainingAfterMe };
    }

    // 💡 추가: 표준 포커 포지션 이름(UTG/CO/BTN 등) - 이제 AI 인원수가 1/5/8 중 하나로 고정되어
    // 전체 인원이 2/6/9명으로 딱 떨어지므로, 정식 포지션 명칭을 정확히 붙일 수 있다.
    // 순서는 [SB, BB, UTG, ..., BTN] - 버튼 다음 좌석(SB)부터 시계방향으로 버튼 본인(BTN)까지.
    const POSITION_LABELS_BY_COUNT = {
      6: ["SB", "BB", "UTG", "MP", "CO", "BTN"],
      9: ["SB", "BB", "UTG", "UTG+1", "MP1", "MP2", "HJ", "CO", "BTN"],
    };
    function getPositionName(playerId, players, buttonIndex) {
      const n = players.length;
      const buttonIdx = buttonIndex || 0;
      const playerIdx = players.indexOf(playerId);
      if (playerIdx === -1) return null;

      // 헤즈업(2명)은 실제 포커 특례 규칙 - 버튼 본인이 SB를 겸함
      if (n === 2) return playerIdx === buttonIdx ? "BTN/SB" : "BB";

      const labels = POSITION_LABELS_BY_COUNT[n];
      if (!labels) return null; // 1/5/8명 외 다른 인원수가 들어오면 안전하게 표시 안 함
      const offset = (playerIdx - buttonIdx - 1 + n) % n;
      return labels[offset] || null;
    }

    function calculateSPR(effectiveStack, pot) {
      if (!pot || pot <= 0) return { spr: null, tier: "unknown", label: "계산 불가" };
      const spr = effectiveStack / pot;
      let tier, label;
      if (spr <= 4) { tier = "low"; label = "낮음 (커밋 구간)"; }
      else if (spr <= 10) { tier = "medium"; label = "중간"; }
      else { tier = "high"; label = "깊음"; }
      return { spr, tier, label };
    }

    // 💡 추가: 테이블 사이즈(게임 전체 생존자 수) 계산.
    // opponentsCount(이번 핸드에 살아있는 상대 수)와는 다른 축 - 게임 전체에서 몇 명이 파산했는지에 따라
    // 숏핸디드/헤즈업으로 갈수록 핸드 가치 기준 자체가 낮아진다(실전 포커 이론과 동일).
    function calculateTableDynamics(remainingPlayers) {
      if (!remainingPlayers || remainingPlayers <= 0) return { tier: "full", label: "", remainingPlayers: remainingPlayers || 0 };
      let tier, label;
      if (remainingPlayers <= 2) { tier = "headsup"; label = `생존자 ${remainingPlayers}명(헤즈업)`; }
      else if (remainingPlayers <= 4) { tier = "short"; label = `생존자 ${remainingPlayers}명(숏핸디드)`; }
      else { tier = "full"; label = `생존자 ${remainingPlayers}명(풀링)`; }
      return { tier, label, remainingPlayers };
    }

    function getRelativeStrength(ev, hole, community, toCall, pot, spr, positionLabel, remainingPlayers, positionTier) {
      if (!community || community.length === 0) {
        return {
          isStrong: ev.cat >= 2,
          isModerate: ev.cat === 1 && ev.tiebreak[0] >= 10,
          isWeak: ev.cat === 0 || (ev.cat === 1 && ev.tiebreak[0] < 10),
          isBoardHeavy: false,
          contextText: `내 핸드: ${CAT_NAME[ev.cat]}`,
          boardDanger: false,
          isSituationalUpgrade: false
        };
      }

      const boardEv = evaluateBest(community);
      const holeIds = hole.map(c => `${c.rank}${c.suit}`);
      const usedHoleCards = ev.cards.filter(c => holeIds.includes(`${c.rank}${c.suit}`));
      // 💡 추가: 블로커 계산 (너트 플러시/트리플 등 상대의 강한 조합을 물리적으로 줄이는지)
      const blockers = calculateBlockers(hole, community);

      let isStrong = false;
      let isModerate = false;
      let isWeak = false;
      let isBoardHeavy = false;
      // 💡 추가: 원페어일 때 '탑페어급'인지 '미들페어'인지 구분해서 추적 (SPR 승격 조건에서 사용 -
      // 미들 페어까지 뭉뚱그려 강패로 승격시키던 문제를 여기서 구분해 고침)
      let pairQuality = null; // "top" | "middle" | "bottom" | null(페어 아님)
      const reasons = []; // 💡 추가: 판정 근거를 사람이 읽을 수 있는 문구로 누적

      // 1. 보드 위협도(Board Texture Danger) 분석
      const boardSuits = community.map(c => c.suit);
      const suitCounts = { "♠": 0, "♥": 0, "♦": 0, "♣": 0 };
      boardSuits.forEach(s => suitCounts[s]++);
      const maxSuitCount = Math.max(...Object.values(suitCounts));
      const isFlushDanger = maxSuitCount >= 3;

      const boardRanks = [...new Set(community.map(c => c.rank))].sort((a, b) => b - a);
      let isStraightDanger = boardEv.cat === 4;

      // 일반 스트레이트 위협
      for (let i = 0; i <= boardRanks.length - 3; i++) {
        if (boardRanks[i] - boardRanks[i + 2] <= 4) isStraightDanger = true;
      }

      // A를 1로 취급하는 휠(Wheel) 하단 스트레이트 위협 정밀 감지
      if (boardRanks.includes(14)) {
        const wheelRanks = [...boardRanks, 1].sort((a, b) => b - a);
        for (let i = 0; i <= wheelRanks.length - 3; i++) {
          if (wheelRanks[i] - wheelRanks[i + 2] <= 4) isStraightDanger = true;
        }
      }
      // 💡 위협 플래그는 여러 판정 문구에서 재사용하므로 공통 문구로 미리 만들어둡니다.
      const dangerNote = [isFlushDanger ? "플러시 위협 있음" : "", isStraightDanger ? "스트레이트 위협 있음" : ""].filter(Boolean).join(", ") || "보드 위협 없음";

      // 2. 패 강도 평가 분기
      if (usedHoleCards.length === 0) {
        isBoardHeavy = true;
        isWeak = true;
        reasons.push(`내 홀카드가 이 족보에 전혀 관여하지 않음 (보드 자체가 ${CAT_NAME[boardEv.cat]})`);
      }
      else if (ev.cat === boardEv.cat && ev.tiebreak[0] === boardEv.tiebreak[0]) {
        isBoardHeavy = true;
        const myKickers = usedHoleCards.map(c => c.rank);
        const myBestKicker = myKickers.length > 0 ? Math.max(...myKickers) : 0;

        reasons.push(`내 ${CAT_NAME[ev.cat]}(${rankLabel(ev.tiebreak[0])})는 보드의 ${CAT_NAME[boardEv.cat]}와 탑랭크 동률 → 키커 승부`);

        if (boardEv.cat >= 3) {
          isWeak = true;
          reasons.push(`보드에 이미 ${CAT_NAME[boardEv.cat]} 이상이 깔려있어 내 키커는 의미 없음`);
        } else if (boardEv.cat === 2) {
          reasons.push(`내 최고 키커 ${rankLabel(myBestKicker)}, ${dangerNote}`);
          if (myBestKicker >= 13 && !isFlushDanger && !isStraightDanger) {
            isModerate = true;
          } else {
            isWeak = true;
          }
        } else if (boardEv.cat === 1) {
          reasons.push(`내 최고 키커 ${rankLabel(myBestKicker)}, ${dangerNote}`);
          if (isFlushDanger || isStraightDanger) {
            isWeak = true;
          } else if (myBestKicker >= 12) {
            isModerate = true;
          } else {
            isWeak = true;
          }
        } else {
          // 💡 수정: 보드와 내 패가 모두 '하이카드'일 경우, 키커가 아무리 높아도 베팅 상황에서는 '약한 패(Weak)'입니다.
          isWeak = true;
          isModerate = false;
          reasons.push(`보드와 나 모두 하이카드 → 키커와 무관하게 약한 패로 취급`);
        }
      }
      else {
        if (ev.cat >= 6) {
          isStrong = true;
          reasons.push(`${CAT_NAME[ev.cat]} — 매우 강한 완성 핸드`);
        } else if (ev.cat === 5) {
          if (maxSuitCount === 4 && Math.max(...usedHoleCards.map(c => c.rank)) < 11) {
            isModerate = true;
            reasons.push(`플러시지만 보드에 이미 같은 무늬 4장 → 낮은 카드(${rankLabel(Math.max(...usedHoleCards.map(c => c.rank)))})면 로우 플러시 위험`);
          } else {
            isStrong = true;
            reasons.push(`플러시 완성, 로우 플러시 위험 적음`);
          }
        } else if (ev.cat === 4) {
          if (isFlushDanger) { isModerate = true; reasons.push(`스트레이트 완성이지만 보드에 같은 무늬 3장 이상 → 플러시 위협 있음`); }
          else { isStrong = true; reasons.push(`스트레이트 완성, 플러시 위협 없음`); }
        } else if (ev.cat === 3) {
          // 💡 수정: 기존엔 'community.length === 5'(리버) 조건이 있어서 플랍·턴에서는 보드가
          // 아무리 위험해도(예: 모노톤 플랍) 트리플이 무조건 강패 취급됐다. 투페어는 이미 모든
          // 스트리트에서 위험도를 검사하므로, 트리플도 동일하게 스트리트 구분 없이 검사하도록 통일.
          if (maxSuitCount >= 4 || isFlushDanger || isStraightDanger) {
            isModerate = true;
            reasons.push(`트리플이지만 ${dangerNote}`);
          } else {
            isStrong = true;
            reasons.push(`트리플, ${dangerNote}`);
          }
        } else if (ev.cat === 2) {
          if (isFlushDanger || isStraightDanger || boardEv.cat === 1) {
            isModerate = true;
            reasons.push(`투페어지만 ${boardEv.cat === 1 ? "보드에 이미 페어 있음, " : ""}${dangerNote}`);
          } else {
            isStrong = true;
            reasons.push(`투페어, ${dangerNote}`);
          }
        } else if (ev.cat === 1) {
          // 💡 [수정됨] 무조건 10 이상이 아니라 보드(Board) 랭크와 비교하여 탑/미들 페어를 인지합니다.
          const boardRanksDesc = [...new Set(community.map(c => c.rank))].sort((a, b) => b - a);
          const topBoardRank = boardRanksDesc[0] || 0;
          const secondBoardRank = boardRanksDesc[1] || 0;
          const myPairRank = ev.tiebreak[0];
          const cmpLabel = myPairRank === topBoardRank ? "동률"
            : myPairRank > topBoardRank ? "위"
            : myPairRank >= secondBoardRank ? "2위와 동률 이상(미들 페어)"
            : "아래(바텀 페어)";

          reasons.push(`내 페어 ${rankLabel(myPairRank)}는 보드 탑카드 ${rankLabel(topBoardRank)}와 ${cmpLabel}, ${dangerNote}`);

          if (myPairRank >= topBoardRank) {
            pairQuality = "top";
            if (isFlushDanger && community.length === 5) isWeak = true;
            else isModerate = true;
          } else if (myPairRank >= secondBoardRank) {
            pairQuality = "middle";
            if (isFlushDanger || isStraightDanger) isWeak = true;
            else isModerate = true; // 미들 페어도 쇼다운 밸류가 있으므로 Moderate에 편입 (퓨어 블러핑 취급 X)
          } else {
            pairQuality = "bottom";
            isWeak = true; // 바텀 페어 및 이하는 여전히 Weak
          }
        } else {
          // 💡 [수정됨] 보드와 내 패가 모두 하이카드일 때 키커 오류 방지
          isWeak = true;
          isModerate = false;
          reasons.push(`하이카드로 보드 미스, 완성된 족보 없음`);
        }
      }

      // 3. 팟 오즈(Pot Odds) 기반 상대적 압박감 적용
      const pressureOdds = toCall > 0 ? toCall / (pot + toCall) : 0;

      if (pressureOdds >= 0.33) {
        if (isModerate) {
          isModerate = false;
          isWeak = true;
          reasons.push(`콜 비용이 팟 대비 커서(${Math.round(pressureOdds * 100)}%) 판정을 한 단계 보수적으로 조정`);
        }
        if (isStrong && ev.cat <= 3 && usedHoleCards.length === 1 && Math.max(...hole.map(c => c.rank)) < 12) {
          isStrong = false;
          isModerate = true;
          reasons.push(`콜 비용이 팟 대비 커서(${Math.round(pressureOdds * 100)}%) 판정을 한 단계 보수적으로 조정`);
        }
      }

      // 4. 💡 수정: SPR(스택 대 팟 비율) 기반 커밋 성향 조정.
      // 💡 코멘트 밀도 완화: SPR이 '중간'이면 판정에 영향이 없으므로 아예 언급하지 않고,
      // 낮음/깊음일 때만 라벨+설명을 한 문구로 압축해서(따로 문장을 안 늘리고) 표시한다.
      // 💡 수정: 승격 조건을 'ev.cat >= 1'(원페어면 다 포함)에서 '두 페어 이상, 또는 탑페어급 원페어'로
      // 좁혔다. 미들 페어까지 뭉뚱그려 SPR만 낮으면 강패로 승격되던 문제를 여기서 고침. 이 승격이
      // 일어났는지는 isSituationalUpgrade로 따로 기록해서, decideAI가 '진짜 강패'와 '커밋 구간이라 강패
      // 취급하는 패'를 구분해 다르게 판단할 수 있게 한다.
      let isSituationalUpgrade = false;
      if (typeof spr === "number" && isFinite(spr)) {
        if (spr <= 4) {
          const eligibleForCommit = ev.cat >= 2 || (ev.cat === 1 && pairQuality === "top");
          const upgraded = isModerate && eligibleForCommit;
          if (upgraded) { isModerate = false; isStrong = true; isSituationalUpgrade = true; }
          reasons.push(`SPR ${spr.toFixed(1)}(낮음, 커밋 구간${upgraded ? "으로 승격" : ""})`);
        } else if (spr >= 10) {
          const downgraded = isStrong && ev.cat <= 2;
          if (downgraded) { isStrong = false; isModerate = true; }
          reasons.push(`SPR ${spr.toFixed(1)}(깊음${downgraded ? ", 풀커밋 위험으로 강등" : ""})`);
        }
        // SPR 4~10(중간)은 특별한 조정이 없으므로 코멘트 밀도를 위해 언급하지 않음
      }

      // 5. 💡 수정: 테이블 사이즈(게임 전체 생존자 수) 기반 핸드가치 기준 완화.
      // 마찬가지로 '풀링(평범)'이면 언급하지 않고, 숏핸디드/헤즈업일 때만 압축된 한 문구로 표시.
      // 💡 수정: 헤즈업 승격 조건도 SPR과 동일하게 좁힘 - 원래는 'isModerate면 무조건' 승격이라 SPR보다도
      // 더 헐거웠음(미들 페어는 물론이고 ev.cat 체크 자체가 없었음). 탑페어급 이상만 승격 후보가 되도록
      // 통일하고, 이 승격도 isSituationalUpgrade로 기록해서 decideAI가 '진짜 강패'와 구분하게 한다.
      const tableDynamics = calculateTableDynamics(remainingPlayers);
      if (tableDynamics.tier === "headsup") {
        let tag = "";
        if (isWeak && ev.cat >= 1) { isWeak = false; isModerate = true; tag = ", 페어면 밸류로 승격"; }
        else if (isModerate && (ev.cat >= 2 || pairQuality === "top")) {
          isModerate = false; isStrong = true; isSituationalUpgrade = true; tag = ", 강패로 승격";
        }
        reasons.push(`${tableDynamics.label}${tag}`);
      } else if (tableDynamics.tier === "short") {
        let tag = "";
        if (isModerate && ev.cat >= 2) { isModerate = false; isStrong = true; isSituationalUpgrade = true; tag = ", 강패로 승격"; }
        reasons.push(`${tableDynamics.label}${tag}`);
      }
      // 풀링(평범)은 코멘트 밀도를 위해 언급하지 않음

      // 6. 💡 추가: 블로커 노트 (있을 때만 표시 - 없으면 굳이 "블로커 없음"으로 코멘트를 채우지 않음)
      if (blockers.blockerNote) {
        reasons.push(blockers.blockerNote);
      }

      // 7. 💡 수정: 포지션 노트 - 미들 포지션(평범)은 코멘트 밀도를 위해 언급하지 않고,
      // 얼리/레이트처럼 실제로 의미 있는 경우만 표시.
      if (positionLabel && positionTier !== "middle") {
        reasons.push(positionLabel);
      }

      // 💡 수정: 'reasonText'였던 필드를 'contextText'로 재정의.
      // SPR/포지션/보드 위협/핸드-보드 비교/블로커 등, 모두 '결정을 내리기 전 상황을 설명하는 사실'이므로
      // 이제 이 값은 코멘트 끝에 괄호로 덧붙이는 게 아니라 코멘트 맨 앞의 '상황 도입부' 문장으로 조립된다.
      const contextText = reasons.filter(Boolean).join(", ");
      // 💡 추가: decideAI가 '상황적으로 강패 취급된 패'를 다르게 판단할 수 있도록 보드 위험도와
      // isSituationalUpgrade 여부를 함께 반환한다. community가 비어있으면(프리플랍 단계 없음 - 이 게임은
      // 노프리플랍이라 실제로는 항상 community가 있지만 방어적으로) boardDanger는 false로 둔다.
      const boardDanger = isFlushDanger || isStraightDanger;
      return { isStrong, isModerate, isWeak, isBoardHeavy, contextText, hasKeyBlocker: blockers.hasKeyBlocker, boardDanger, isSituationalUpgrade };
    }

    // 💡 추가: 상황 도입부(Context) 문장 조립. SPR/포지션/보드 위협 등 '결정 전 상황'을 자연스러운
    // 도입 절로 만들어 코멘트의 맨 앞에 배치한다.
    function buildContextIntro(contextText) {
      if (!contextText) return "";
      return `${contextText} 상황에서, `;
    }

    // 💡 추가: 결론(Conclusion) 문장 조립. 최종 점수에 따라 코멘트 맨 끝에 붙는 뉘앙스를 결정한다.
    function buildConclusion(score) {
      if (score >= 95) return "여러모로 흠잡을 데 없는 판단입니다.";
      if (score >= 85) return "정석에 부합하는 훌륭한 플레이입니다.";
      if (score >= 70) return "무난하고 합리적인 선택입니다.";
      if (score >= 55) return "장기적으로는 아쉬움이 남는 판단입니다.";
      if (score >= 40) return "위험 부담이 꽤 큰 플레이였습니다.";
      return "장기적으로 칩을 깎아먹는 명백한 실수에 가깝습니다.";
    }

    //최소 오프닝 베팅 계산 (25% 룰 및 100단위 CEIL)
    // 💡 추가: 베팅 금액을 반올림할 때 쓰는 단위를 현재 BB 규모에 맞게 동적으로 계산.
    // BB가 낮을 땐(100 등) 100단위로 반올림하다가, BB가 커지면(1만, 10만...) 그에 맞춰 1000/10000
    // 단위로 같이 커져서, 판돈이 커져도 베팅 금액이 계속 깔끔한 숫자로 떨어지게 한다. 바이인이
    // 커질수록 100원 단위로 딱 떨어뜨리는 게 오히려 어색하고 계산도 번거로워지는 문제를 해결.
    function roundingUnitForBB(bb) {
      return Math.max(100, Math.floor(bb / 1000) * 100);
    }

    function calcMinOpeningBet(bb, streetStartPot) {
      const safePot = streetStartPot || 0; // 💡 방어 코드: 값이 없으면 0으로 계산하여 NaN 에러 방지
      const unit = roundingUnitForBB(bb);
      const twentyFivePercent = Math.ceil((safePot * 0.25) / unit) * unit;
      return Math.max(bb * 2, twentyFivePercent);
    }

    // 💡 수정: 추천 BB(빅블라인드) = 바이인의 1% (100단위 반올림), 최소 100 ~ 최대(바이인의 10%) 사이로 클램프.
    // 바이인의 1%로 잡으면 블라인드를 걷은 직후 SPR이 대략 15~20 정도(6인 기준) 나와서 '깊음(SPR≥10)'
    // 구간 초입이 된다. 블라인드가 너무 크면 핸드가 바로 올인 각으로 몰려서 포스트플랍 판단을 연습할
    // 틈이 없어지므로, 이 트레이너의 핵심 목적(포스트플랍 오즈 계산/드로우 판단)에 맞춰 일부러 이
    // 정도로 낮게 잡았다.
    function calcRecommendedBB(buyIn) {
      const maxBB = Math.max(100, Math.floor((buyIn * 0.1) / 100) * 100);
      const raw = Math.round((buyIn / 100) / 100) * 100;
      return Math.max(100, Math.min(maxBB, raw));
    }

    // 💡 추가: 주어진 칩 수량에 '비율(배수)'로 가장 가까운 바이인 프리셋을 찾는다.
    // 프리셋 간격이 1만→5만→10만→50만→100만처럼 등비적으로 벌어져 있으므로, 단순 차이(뺄셈)가 아니라
    // 로그 스케일 거리(비율)로 재야 직관과 맞는다 - 예: 25만은 차이로는 10만에 더 가깝지만(15만 vs 25만
    // 차이), 배수로는 50만에 더 가깝다(2배 vs 2.5배). 새로 참가하는 AI의 시작 칩을 여기에 맞춘다.
    function findClosestPresetByRatio(amount) {
      if (!amount || amount <= 0) return BUYIN_PRESETS[0];
      let best = BUYIN_PRESETS[0];
      let bestDist = Infinity;
      BUYIN_PRESETS.forEach(preset => {
        const dist = Math.abs(Math.log(preset / amount));
        if (dist < bestDist) {
          bestDist = dist;
          best = preset;
        }
      });
      return best;
    }

    // 💡 추가: 배럴링(멀티스트리트 서사) 분석.
    // 직전 스트리트에 베팅했었다면, 그 베팅이 밸류/세미블러프/퓨어블러핑 중 무엇이었는지 판정하고
    // 이번 스트리트에서 그 스토리를 잘 이어가고 있는지(또는 잘 포기했는지) 확인한다.
    function analyzeBarrel(prevAct, curAct) {
      if (!prevAct || prevAct.type !== "bet") return null;

      const prevStrength = getRelativeStrength(prevAct.ev, prevAct.hole, prevAct.community, prevAct.toCall, prevAct.pot, prevAct.spr);
      const prevOuts = prevAct.drawInfo ? prevAct.drawInfo.outs : 0;

      let prevBetType;
      if (prevStrength.isStrong) prevBetType = "value";
      else if (prevOuts >= 4) prevBetType = "semiBluff";
      else prevBetType = "pureBluff";

      const improved = curAct.ev.cat > prevAct.ev.cat;
      // 💡 추가: 직전 베팅에 상대가 어떻게 반응했는지(레이즈까지 당했는지, 콜만 받았는지)
      const facedRaise = !!(prevAct.opponentResponse && prevAct.opponentResponse.gotRaised);
      const gotCalled = !!(prevAct.opponentResponse && prevAct.opponentResponse.gotCalled);
      return { prevBetType, improved, facedRaise, gotCalled };
    }

    function evaluateUserActions(actions, bb) {
      if (!actions || actions.length === 0) return null;

      let totalScore = 0;
      let handHasBrilliant = false; // 💡 추가: 핸드 전체에서 한 번이라도 탁월함이 있었는지 추적
      const phaseResults = [];
      const phaseNames = { preflop: "프리플랍", flop: "플랍", turn: "턴", river: "리버" };

      actions.forEach((act, idx) => {
        const { phase, type, investedAmount, isAllIn, ev, drawInfo, pot, toCall, opponentsCount, hole, community, spr, positionTier, positionLabel, remainingPlayers } = act;
        let score = 70;
        let comment = "판단 보류 (정보 부족)";

        // 💡 추가: 프리플랍 액션은 포스트플랍과 완전히 다른 잣대(첸 포뮬러 점수 + 포지션)로 평가한다.
        // 레인지 차트 기반의 O/X 채점이 아니라 정성적 피드백으로 시작 - 유저가 가끔 재미로 넓은
        // 레인지를 시도해도 무조건 오답 처리하지 않고, 포지션 우위를 살렸는지/얼리에서 무리했는지
        // 정도로 부드럽게 짚는다. (포스트플랍 전용 함수인 getRelativeStrength/drawInfo는 커뮤니티
        // 카드가 없는 프리플랍에는 애초에 안 맞으므로 여기서 완전히 분리해서 처리한다)
        if (phase === "preflop") {
          const chenScore = evaluatePreflop(hole);
          const posLabel = positionLabel || "";
          let pfScore = 70;
          let pfComment = "";

          if (type === "bet") {
            if (chenScore >= 10) { pfScore = 95; pfComment = `전투력 ${chenScore}점의 확실히 좋은 패로 ${posLabel}에서 레이즈했습니다. 정석적인 오픈입니다.`; }
            else if (chenScore >= 7) {
              if (positionTier === "late") { pfScore = 88; pfComment = `전투력 ${chenScore}점은 애매하지만, 레이트 포지션의 이점을 살려 넓은 레인지로 오픈한 좋은 시도입니다.`; }
              else if (positionTier === "early") { pfScore = 55; pfComment = `전투력 ${chenScore}점 정도로 얼리 포지션에서 오픈하기엔 다소 무리가 있습니다. 뒤에 남은 인원이 많다는 걸 감안해야 합니다.`; }
              else { pfScore = 80; pfComment = `전투력 ${chenScore}점으로 무난한 오픈입니다.`; }
            } else {
              pfScore = 35; pfComment = `전투력 ${chenScore}점의 약한 패로 레이즈했습니다. 포지션과 무관하게 장기적으로 손해보기 쉬운 시도입니다.`;
            }
          } else if (type === "call") {
            if (chenScore >= 8) { pfScore = 85; pfComment = `전투력 ${chenScore}점의 준수한 패로 콜하며 판을 지켜봤습니다.`; }
            else { pfScore = 55; pfComment = `전투력 ${chenScore}점 정도의 애매한 패로 콜했습니다. 확실한 이유가 없다면 폴드도 고려할 만합니다.`; }
          } else {
            if (chenScore < 7) { pfScore = 90; pfComment = `전투력 ${chenScore}점의 약한 패를 무리하지 않고 접었습니다. 기본에 충실한 판단입니다.`; }
            else { pfScore = 60; pfComment = `전투력 ${chenScore}점이면 상황에 따라 플레이해볼 만한 패였는데 접었습니다.`; }
          }

          totalScore += pfScore;
          phaseResults.push({ phase: phaseNames[phase] || phase, score: pfScore, comment: pfComment, recommended: "", type, recommendedType: null });
          return; // 프리플랍 채점은 여기서 종료 - 아래 포스트플랍 전용 로직은 건너뜀
        }

        const { isStrong, isModerate, isWeak, isBoardHeavy, contextText, hasKeyBlocker } = getRelativeStrength(ev, hole, community, toCall, pot, spr, positionLabel, remainingPlayers, positionTier);

        const potOdds = toCall > 0 ? toCall / (pot + toCall) : 0;
        const betRatio = investedAmount / (pot || 1);

        const { outs, hitChance, drawType } = drawInfo;
        const hasGoodDraw = outs >= 8;

        // 💡 [추천 플레이 계산] (수정됨: 패 강도에 따른 베팅 범위 추천)
        let recommended = "";
        // 💡 추가: 콜/폴드가 갈리는 상황(toCall>0)에서만 'fold'|'call'로 명확히 표시 (통계 집계용)
        let recommendedType = null;

        // 팟 비율 기반 최소/최대 추천 베팅액 계산 (100단위 반올림)
        const calcBetRange = (minRatio, maxRatio) => {
          const minBet = Math.max(bb * 5, Math.round((pot * minRatio) / 100) * 100);
          const maxBet = Math.max(bb * 5, Math.round((pot * maxRatio) / 100) * 100);
          return minBet === maxBet ? `${minBet}` : `${minBet}~${maxBet}`;
        };

        const strongRange = calcBetRange(0.6, 1.0); // 밸류 베팅 범위
        const moderateRange = calcBetRange(0.3, 0.5); // 씬 밸류 / 블락벳 범위
        const bluffRange = calcBetRange(0.5, 0.8); // 블러핑 범위

        if (phase === "flop" || phase === "turn") {
          if (isStrong) recommended = toCall > 0 ? `레이즈 (${strongRange})` : `베팅 (${strongRange})`;
          else if (isModerate) {
            // 💡 [수정됨] 씬 밸류벳 추천 텍스트 추가 (AI와 잣대 통일)
            if (toCall === 0) recommended = "체크 (팟 컨트롤) 또는 베팅 (씬 밸류)";
            else {
              const goodCall = potOdds <= 0.25 || (hasGoodDraw && hitChance >= potOdds);
              recommended = goodCall ? "콜" : "폴드";
              recommendedType = goodCall ? "call" : "fold";
            }
          } else {
            // 💡 [수정됨] 빵꾸(outs >= 4)도 세미 블러핑 옵션으로 인정
            if (toCall === 0) recommended = outs >= 4 ? `베팅 (세미 블러프, ${bluffRange}) 또는 체크` : "체크";
            else {
              const goodCall = outs >= 4 && hitChance >= potOdds;
              recommended = goodCall ? "콜" : "폴드";
              recommendedType = goodCall ? "call" : "fold";
            }
          }
        } else if (phase === "river") {
          if (isStrong) recommended = toCall > 0 ? `레이즈 (${strongRange})` : `베팅 (밸류 베팅, ${strongRange})`;
          else if (isModerate) {
            if (toCall === 0) recommended = "체크";
            else {
              const goodCall = potOdds < 0.3;
              recommended = goodCall ? "콜 (블러프 캐치)" : "폴드";
              recommendedType = goodCall ? "call" : "fold";
            }
          }
          else {
            recommended = toCall === 0 ? "체크" : "폴드";
            if (toCall > 0) recommendedType = "fold";
          }
        }

        // 💡 [기본 점수 및 코멘트 평가] (점수 롤백: 정석=85~100, 사소한실수=60~75, 치명적실수=20~40)
        if (phase === "flop" || phase === "turn") {
          if (type === "fold") {
            if (isWeak && outs < 4) {
              if (isBoardHeavy) { score = 95; comment = "보드에 공유 족보가 깔린 상황에서, 낮은 키커로 불필요한 출혈을 막는 완벽한 폴드입니다."; }
              else { score = 95; comment = "승산이 거의 없는 패로 깔끔하게 폴드했습니다. 기본에 충실한 방어입니다."; }
            } else if (isWeak && outs >= 4) {
              if (potOdds > hitChance) { score = 90; comment = `${drawType}(이)었지만, 콜 비용(오즈)이 역전 확률보다 높아 합리적으로 포기했습니다.`; }
              else { score = 55; comment = `역전 확률(${Math.round(hitChance * 100)}%)이 팟 오즈보다 높았는데 너무 쉽게 포기했습니다.`; }
            } else if (isModerate) { score = 80; comment = "원페어지만 위험이 커지는 상황을 인식하고 피해를 최소화하는 안정적인 폴드입니다."; }
            else { score = 40; comment = "강력한 패를 들고 팟을 포기했습니다. 상대 블러핑에 과도하게 위축되었을 수 있습니다."; }
          }
          else if (type === "check") {
            if (isWeak) { score = 85; comment = "불필요한 투자를 피하고 다음 카드를 무료로 보려는 팟 컨트롤입니다."; }
            else if (isModerate) {
              if (hasGoodDraw) { score = 90; comment = "애매한 패지만 좋은 드로우를 가지고 있어 무료로 다음 카드를 보는(Free Card) 아주 좋은 판단입니다."; }
              else { score = 85; comment = "쇼다운 밸류가 있는 애매한 패로 팟 크기를 조절하는 정석적인 체크입니다."; }
            }
            else { score = 75; comment = "이미 강력한 패인데 체크를 내렸습니다. 상대가 약하게 나올 경우 밸류를 놓치는 슬로우 플레이에 주의하세요."; }
          }
          else if (type === "call") {
            if (isStrong) { score = 80; comment = "강한 패로 레이즈 대신 콜을 받으며 상대를 판에 깊이 끌어들였습니다."; }
            else if (isModerate) {
              if (potOdds <= 0.25) { score = 85; comment = "적절한 쇼다운 밸류를 가진 패로 상대의 가벼운 베팅을 무난하게 받아냈습니다."; } 
              else if (hasGoodDraw && hitChance >= potOdds) { score = 95; comment = `패 강도는 애매하지만 팟 오즈 대비 높은 역전 확률(${Math.round(hitChance * 100)}%)을 근거로 한 훌륭한 콜입니다.`; } 
              else { score = 55; comment = "패 강도가 애매한데 상대의 강한 베팅에 무리하게 콜을 받았습니다. 역전 확률도 부족합니다."; }
            }
            else if (outs > 0) {
              if (hitChance >= potOdds) { score = 95; comment = `팟 오즈 대비 역전 확률(${Math.round(hitChance * 100)}%)이 높은 수학적으로 훌륭한 콜입니다.`; } 
              else { score = 55; comment = `역전 확률(${Math.round(hitChance * 100)}%)에 비해 지불한 콜 금액이 너무 큽니다. 장기적으로 칩이 깎이는 판단입니다.`; }
            }
            else { score = 30; comment = "발전 가능성(아웃츠)이 전혀 없는 약한 패로 상대방의 베팅에 끌려다녔습니다. 가장 피해야 할 플레이입니다."; }
          }
          else if (type === "bet") {
            if (isStrong) {
              if (betRatio > 1.0) { score = 80; comment = "강력한 패지만 오버벳 기미가 있습니다. 콜 범위를 좁혀 상대가 도망갈 수 있습니다."; }
              else if (betRatio < 0.6) {
                if (isAllIn) { score = 95; comment = "스택이 짧아 정석 사이즈(60~100%)에는 못 미쳤지만, 가진 칩을 전부 투입한 올바른 올인입니다."; }
                else { score = 75; comment = "유리한 상황이지만 베팅 사이즈가 작습니다. 상대에게 싼 값에 역전 기회(드로우)를 줄 수 있습니다."; }
              }
              else { score = 95; comment = "강한 패를 바탕으로 팟 규모(60~100%)에 딱 맞는 완벽한 밸류 베팅입니다."; }
            }
            else if (isModerate) {
              if (betRatio > 0.5) { score = 55; comment = "애매한 패로 너무 크게 베팅했습니다. 나보다 강한 패만 콜을 받을 위험이 큽니다."; }
              else if (betRatio >= 0.3) { score = 85; comment = "애매한 패(씬 밸류/블락벳)로 팟의 30~50%를 적절히 베팅하며 주도권을 잡았습니다."; }
              else {
                if (isAllIn) { score = 85; comment = "스택이 짧아 정석 사이즈(30~50%)에는 못 미쳤지만, 가진 칩을 전부 투입한 합리적인 올인입니다."; }
                else { score = 65; comment = "애매한 패로 주도권을 쥐려 했으나 사이즈가 너무 작아 효과가 미미합니다."; }
              }
            }
            else {
              if (hasGoodDraw) {
                if (betRatio >= 0.5 && betRatio <= 0.8) { score = 100; comment = `좋은 드로우를 바탕으로 팟의 50~80%를 때리는 아주 날카로운 세미-블러프입니다.`; }
                else if (isAllIn && betRatio < 0.5) { score = 95; comment = `스택이 짧아 정석 사이즈(50~80%)에는 못 미쳤지만, ${drawType}을 살려 가진 칩을 전부 투입한 좋은 올인입니다.`; }
                else { score = 90; comment = `${drawType}을 활용한 세미-블러프는 좋았으나, 베팅 사이즈가 정석 범위(50~80%)를 벗어났습니다.`; }
              }
              // 💡 [수정됨] 아웃츠 4~7개(빵꾸 등)를 '아웃츠 없는 퓨어 블러핑'에서 구출하여 세미 블러프로 고평가
              else if (outs >= 4) {
                if (betRatio >= 0.4 && betRatio <= 0.8) { score = 95; comment = `${drawType} 가능성을 활용한 찌르기(세미 블러프)입니다. 공격적인 정석 플레이입니다.`; }
                else if (isAllIn && betRatio < 0.4) { score = 90; comment = `스택이 짧아 정석 사이즈(40~80%)에는 못 미쳤지만, ${drawType} 가능성을 살려 가진 칩을 전부 투입한 판단입니다.`; }
                else { score = 85; comment = `${drawType} 상태에서 베팅을 시도했으나, 상대방에게 압박을 주기엔 사이즈가 다소 아쉽습니다.`; }
              }
              // 💡 추가: 발전 가능성(아웃츠)은 없어도 상대의 너트급 조합을 블로킹하고 있다면 근거 있는 블러핑
              else if (hasKeyBlocker) {
                if (betRatio >= 0.5 && betRatio <= 0.8) { score = 90; comment = "아웃츠는 없지만 상대의 너트급 조합을 블로킹하고 있어 근거 있는 블러핑입니다."; }
                else if (isAllIn && betRatio < 0.5) { score = 85; comment = "스택이 짧아 정석 사이즈에는 못 미쳤지만, 블로커를 활용한 근거 있는 올인 블러핑입니다."; }
                else { score = 75; comment = "블로커를 활용한 블러핑 아이디어는 좋았으나, 사이즈가 정석 범위(50~80%)를 벗어났습니다."; }
              }
              // 💡 추가: 아웃츠도 블로커도 없어도, 다들 체크한 뒤 마지막에 베팅하는 레이트 포지션 스틸이면 근거 있는 시도로 인정
              else if (opponentsCount >= 2 && positionTier === "late" && toCall === 0) {
                score = 80; comment = "다들 체크한 뒤 마지막에 베팅하는 좋은 스틸 자리입니다. 아웃츠는 없지만 포지션 우위를 활용한 합리적 시도입니다.";
              }
              else if (opponentsCount >= 2) { score = 70; comment = "상대가 여럿 남은 상황에서 진짜 아웃츠가 하나도 없는 퓨어 블러핑은 위험도가 높습니다."; }
              else if (toCall > 0) { score = 75; comment = "상대방이 먼저 베팅으로 힘을 과시했는데 빈 패로 맞불(재레이즈)을 놓은 무리한 플레이입니다."; }
              else {
                if (betRatio >= 0.5 && betRatio <= 0.8) { score = 95; comment = "1:1 상황에서 타이밍을 뺏는 과감하고 정교한 블러핑입니다."; }
                else if (isAllIn && betRatio < 0.5) { score = 85; comment = "스택이 짧아 정석 사이즈에는 못 미쳤지만, 가진 칩을 모두 던진 올인 블러핑 시도입니다."; }
                else { score = 80; comment = "블러핑을 시도했으나 사이즈가 정석(팟의 50~80%)을 벗어났습니다. 상대가 의도를 눈치챌 수 있습니다."; }
              }
            }
          }
        }
        else if (phase === "river") {
          if (type === "fold") {
            if (isWeak) { score = 95; comment = "이길 확률이 낮다고 판단하여 칩을 아끼는 훌륭한 폴드입니다."; }
            else if (isModerate) {
              if (potOdds < 0.3) { score = 70; comment = "블러프 캐치를 시도해볼 만큼 콜 비용이 저렴했는데 아쉽게 팟을 포기했습니다."; }
              else { score = 95; comment = "콜 비용이 비싼 상황에서 애매한 패로 무리하지 않고 잘 폴드했습니다."; }
            }
            else { score = 40; comment = "충분히 이길 수 있는 강력한 쇼다운 밸류를 가졌음에도 팟을 포기했습니다."; }
          }
          else if (type === "check") {
            if (isStrong) { score = 70; comment = "강한 패를 들고 체크를 했습니다. 상대가 강하게 나오지 않으면 가치(Value)를 잃게 됩니다."; }
            else if (isModerate) { score = 85; comment = "쇼다운을 싸게 가기 위한 안정적인 팟 컨트롤입니다."; }
            else { score = 90; comment = "약한 패로 무리하지 않고 쇼다운으로 넘기는 올바른 판단입니다."; }
          }
          else if (type === "call") {
            if (isStrong) { score = 85; comment = "강력한 패로 상대의 베팅을 무난하게 받아냈습니다."; }
            else if (isModerate) {
              if (potOdds < 0.3) { score = 85; comment = "콜 비용이 저렴한 상황에서 상대의 블러핑을 의심하고 받아내는(Bluff Catch) 날카로운 판단입니다."; }
              else { score = 65; comment = "콜 비용이 비싼 상황에서 내 패의 쇼다운 밸류가 다소 애매합니다. 무리한 블러프 캐치일 수 있습니다."; }
            }
            else { score = 20; comment = "이길 확률이 거의 없는 패로 큰 베팅에 콜을 했습니다. 리버에서의 치명적인 실수입니다."; }
          }
          else if (type === "bet") {
            if (isStrong) {
              if (betRatio > 1.0) { score = 80; comment = "강력한 패지만 오버벳 기미가 있습니다. 콜 범위를 좁혀 상대가 도망갈 수 있습니다."; }
              else if (betRatio < 0.6) {
                if (isAllIn) { score = 95; comment = "스택이 짧아 정석 사이즈(60~100%)에는 못 미쳤지만, 가진 칩을 전부 투입한 올바른 올인입니다."; }

            } else if (barrel.prevBetType === "semiBluff" && !barrel.improved) {

            } else if (barrel.prevBetType === "pureBluff") {

        // 상황 도입부(Context) → 행동 평가(Action) → 결론(Conclusion) 3단 구조로 자연스럽게 조립한다.

        const actionSentence = barrelNote ? `${comment} ${barrelNote}.` : comment;

    function accumulateUserStats(prevStats, phaseResults) {

    function decideAI(ev, toCall, chips, pot, aiType, drawInfo, hole, community, bb, streetStartPot, opponentsCount, opponentProfile, spr, positionTier, positionLabel, remainingPlayers, raiseCount = 0, actorsRemainingAfterMe = 0) {

      // 탑페어/투페어 비교 등)는 전부 보드가 있다는 걸 전제로 하므로 여기서는 전부 건너뛰고,
      // 첸 포뮬러(evaluatePreflop) 점수 하나로 오픈레이즈/콜/폴드를 판단한다. 레인지 차트(포지션×성향별

      if (community.length === 0) {

        // (actorsRemainingAfterMe)를 직접 반영한다. 뒤에 남은 사람이 많을수록(=먼저 액션하는 얼리
        // 포지션일수록) 조금이라도 더 타이트하게, 적을수록(레이트) 조금이라도 더 루즈하게 - 3단계로

        const desiredOpenTotal = Math.max(bb * 2, Math.round((bb * 3) / roundingUnitForBB(bb)) * roundingUnitForBB(bb));

        if (raiseCount === 0) {
          // 아직 아무도 레이즈하지 않음(블라인드만 걸려있음) - 오픈할지 결정
          if (chenScore >= openThreshold) return { type: "bet", amount: Math.min(openRaiseAmount, chips) };
          if (toCall === 0) return { type: "check" }; // 콜할 것도 없이 내 차례 옵션(빅블라인드 옵션 등)
          // 💡 수정: Station은 프리플랍에서도 호기심에 작은 사이즈는 더 자주 받아본다(35%→50%)

      }

      const isRiver = community.length === 5;

      const calculateBet = () => {
        let targetRatio = 0.5; // 기본적으로 팟의 50%

        }

        //오프닝 베팅과 레이즈의 하한선 분리
        let minBetAllowed;
        if (toCall === 0) {

        } else {

        }

        const roundedBet = Math.max(bb * 5, Math.round(rawBet / roundingUnitForBB(bb)) * roundingUnitForBB(bb));
        return Math.max(minBetAllowed, Math.min(roundedBet, chips));
      };

      // 💡 추가: '진짜 강패'(트리플/스트레이트/플러시 등 완성 조합)와 '상황적으로 강패 취급된 패'

      // 이상 = 콜 비용이 팟 대비 작지 않음) 무조건 레이즈하는 대신 콜로 신중하게 대응한다 - 상대 액션과
      // 필드 위협도를 반영한 판단. 그 외(진짜 강패, 또는 안전한 보드/작은 벳)는 기존처럼 벳/레이즈로
      // 밸류를 챙긴다.

      // 죽은 코드였다.
      // 💡 추가: 레이즈 전쟁(AI끼리 레이즈만 주고받다 결국 올인으로 치닫는 상황) 억제.
      // 이번 스트리트에 이미 레이즈가 2번 이상 오갔다면(=지금 액션이 최소 3번째 레이즈, '4벳' 영역)
      // '진짜 완성된 강패'가 아닌 이상 더 얹지 않고 멈춘다. 상대가 여러 번 다시 레이즈해왔다는 사실
      // 자체가 이미 강력한 신호이므로, 굳이 보드 위험도(boardDanger)까지 겹치지 않아도 자제한다.
      const raiseWarActive = raiseCount >= 2;

      const decideStrongAction = () => {
        const facingModerateBet = toCall > 0 && potOdds >= 0.20;
        if (isSituationalUpgrade && boardDanger && facingModerateBet) {
          return { type: "call" };
        }
        // 💡 추가: 레이즈 전쟁 중이고, 이 강패가 '진짜'가 아니라 상황적으로만 강패 취급된 것이라면
        // 더 얹지 않고 콜로 멈춘다(단, 이미 레이즈 상태이므로 toCall이 있을 때만 의미가 있음).
        if (raiseWarActive && isSituationalUpgrade && toCall > 0) {
          return { type: "call" };
        }
        return { type: "bet", amount: calculateBet() };
      };

      // 사람이 많을수록 블러핑/무리한 벳을 줄이는 페널티 (최대 70%까지 감소)
      const multiwayPenalty = opponentsCount ? Math.max(0.3, 1 - (opponentsCount - 1) * 0.2) : 1;

      // 💡 추가: 상대의 너트급 조합을 블로킹하고 있으면 블러핑 빈도를 높임 (근거 있는 블러핑이므로)
      const blockerBoost = hasKeyBlocker ? 1.6 : 1;
      // 💡 추가: 레이트 포지션(늦게 액션 = 남들 반응을 이미 봄)일수록 블러핑/씬밸류 빈도를 높임
      const positionBoost = positionTier === "late" ? 1.4 : positionTier === "early" ? 0.8 : 1;
      // 💡 추가: 게임 전체 생존자 수(테이블 사이즈)가 적을수록(헤즈업/숏핸디드) 더 루즈하게 플레이
      const tableDynamicsForAI = calculateTableDynamics(remainingPlayers);
      const tableSizeBoost = tableDynamicsForAI.tier === "headsup" ? 1.6 : tableDynamicsForAI.tier === "short" ? 1.2 : 1;

      // 💡 새로 추가: 유저가 벳에 잘 접으면(foldToBetRate↑) 블러핑을 늘리고, 잘 안 접으면(콜링 스테이션 성향) 블러핑을 줄임.
      // 표본 부족(opponentProfile === null)이면 중립값 1 유지.
      const exploitMultiplier = opponentProfile ? (0.6 + opponentProfile.foldToBetRate) : 1;

      // 💡 버그 수정: multiwayPenalty/exploitMultiplier/blockerBoost/positionBoost/tableSizeBoost를 전부
      // 곱하면(각각 최대 1.6배 안팎) 유리한 조건이 여러 개 겹치는 순간 3~6배까지 복합되어 블러핑 확률이
      // 100%로 포화돼버리는 문제가 있었다(예: 헤즈업+레이트포지션+블로커 = 3.58배, TAG 20%→72%,
      // Maniac 60%→100%). 개별 배수는 각각 타당하지만 곱셈이 무제한으로 누적되면 "가끔 과감해지는" 게
      // 아니라 "그 상황만 되면 무조건"이 되어버려 예측 불가능성(밸런스)이 사라진다.
      // 상한(MAX_BLUFF_PROB)을 둬서, 아무리 유리한 조건이 겹쳐도 블러핑이 100% 확정은 되지 않게 한다.
      // 💡 추가: 레이즈가 오갈수록(레이즈 전쟁) 블러핑 확률을 급격히 낮춤. 이미 여러 번 다시 레이즈를
      // 맞은 상황에서 블러핑으로 또 얹는 건 실제로도 위험 부담이 훨씬 크다(상대가 진짜 강패일 가능성이
      // 계속 올라가므로). raiseCount 0~1(오프닝/3벳까지)은 페널티 없음, 그 이후로는 급격히 줄어듦.
      const raiseWarPenalty = Math.max(0.15, 1 - Math.max(0, raiseCount - 1) * 0.5);

      const MAX_BLUFF_PROB = 0.75;
      const bluffProb = base => Math.min(
        MAX_BLUFF_PROB,
        base * multiwayPenalty * exploitMultiplier * blockerBoost * positionBoost * tableSizeBoost * raiseWarPenalty
      );

      // 💡 추가: 유저의 공격성 지표 (보통 사람의 평균은 0.2 내외)
      const aggroFreq = opponentProfile ? opponentProfile.aggressionFreq : 0.2;
      // 유저가 공격적일수록(블러프가 많을수록) AI가 콜을 더 잘 받도록 팟 오즈 기준 완화 (-0.05 ~ +0.15)
      const bluffCatchBonus = Math.max(-0.05, Math.min(0.15, (aggroFreq - 0.2) * 0.5));

      // 팟 사이즈 기반으로 '얄밉게' 베팅하는 계산기 (씬 밸류 / 가벼운 블러프용)
      const calculateThinBet = (minR, maxR) => {
        const ratio = minR + Math.random() * (maxR - minR);
        const rawBet = pot * ratio;
        const unit = roundingUnitForBB(bb);

        // 💡 수정: 외부 함수 호출 대신, 바로 위에서 이미 계산한 방식을 그대로 사용합니다.
        let thinMinBetAllowed;
        if (toCall === 0) {
          const safePot = streetStartPot || 0;
          const twentyFivePercent = Math.ceil((safePot * 0.25) / unit) * unit;
          thinMinBetAllowed = Math.max(bb * 2, twentyFivePercent);
        } else {
          thinMinBetAllowed = bb * 2;
        }

        const roundedBet = Math.max(bb * 5, Math.round(rawBet / unit) * unit);
        return Math.max(thinMinBetAllowed, Math.min(roundedBet, chips));
      };

      // 🌊 [리버(River) 전용 AI 판단 로직] 🌊
      // 💡 1. 완전 쓰레기 패(Total Air) 강제 폴드 로직을 가장 위로 끌어올립니다.
      const isTotalAir = isWeak && drawInfo.outs === 0;
      // 리버에서는 발전 가능성이 0이므로 weak이면 무조건 Total Air가 됩니다.
      if (isTotalAir && toCall > 0) {
        // 스테이션 성향이 가끔 호기심에 받아보는 것(10%) 빼고는 전원 폴드
        if (aiType === "Station" && Math.random() < 0.10) return { type: "call" };
        if (Math.random() < 0.95) return { type: "fold" };
      }

      // 🌊 [리버(River) 전용 AI 판단 로직] 🌊
      if (isRiver) {
        switch (aiType) {
          case "Maniac": // 미치광이: 블러핑 킹
            if (isStrong) return decideStrongAction();
            
            // 💡 추가: 마니악이 애매한 패(isModerate)를 들었을 때의 처리 로직
            if (isModerate) {
              if (toCall === 0) return Math.random() < 0.50 ? { type: "bet", amount: calculateThinBet(0.4, 0.7) } : { type: "check" };
              if (potOdds < (0.30 + bluffCatchBonus)) return { type: "call" };
              return { type: "fold" };
            }
            if (isWeak && toCall === 0 && Math.random() < bluffProb(0.60)) return { type: "bet", amount: calculateThinBet(0.5, 0.8) };
            // 💡 버그 수정: 여기서만 exploitMultiplier 하나만 곱하고 bluffProb()를 거치지 않아서
            // blockerBoost/positionBoost/tableSizeBoost는 물론 새로 추가한 raiseWarPenalty(레이즈 전쟁
            // 억제)까지 전부 빠져있었다. bluffProb(0.20)으로 통일해서 다른 블러핑 판단과 동일하게
            // 모든 배수가 일관되게 적용되도록 함.
            if (isWeak && toCall > 0 && Math.random() < bluffProb(0.20)) return { type: "bet", amount: calculateThinBet(0.5, 0.8) };
            if (toCall > 0 && potOdds < 0.35) return { type: "call" }; 
            if (toCall > 0) return { type: "fold" };
            return { type: "check" };

          case "Rock": // 바위: 절대 무리 안 함
            if (isStrong) return decideStrongAction();
            // 💡 수정: 상대가 블러핑 쟁이면 바위조차도 콜 기준을 관대하게 적용 (bluffCatchBonus)
            if (isModerate && toCall > 0 && potOdds < (0.27 + bluffCatchBonus)) return { type: "call" }; 
            if (toCall > 0) return { type: "fold" };
            return { type: "check" };

          case "Station": // 콜링 스테이션: 궁금해서 다 받아줌
            if (isStrong) return decideStrongAction();
            if (toCall > 0 && potOdds < 0.40) return { type: "call" }; // 💡 무지성 70% 콜 제거
            if (toCall > 0) return { type: "fold" };
            return { type: "check" };

          case "TAG": // 타이트 어그레시브 (정석)
          default:
            if (isStrong) return decideStrongAction();
            if (isModerate) {
              if (toCall === 0) {
                return Math.random() < 0.35 ? { type: "bet", amount: calculateThinBet(0.3, 0.4) } : { type: "check" };
              }
              // 💡 수정: 블러프 캐치 보너스 반영
              if (potOdds < (0.3 + bluffCatchBonus)) return { type: "call" }; 
              return { type: "fold" };
            }
            if (toCall === 0 && Math.random() < bluffProb(0.20)) return { type: "bet", amount: calculateThinBet(0.4, 0.6) };
            if (toCall > 0) return { type: "fold" };
            return { type: "check" };
        }
      }

      // --------------------------------------------------
      // 🌱 [플랍 / 턴(Flop/Turn) 전용 AI 판단 로직] 🌱
      // --------------------------------------------------

      if (isTotalAir && toCall > 0 && Math.random() < 0.90) {
        return { type: "fold" };
      }

      switch (aiType) {
        case "Maniac":
          if (isStrong) return decideStrongAction();
          if (Math.random() < bluffProb(getNoisyThreshold(0.40, 0.15))) return { type: "bet", amount: calculateThinBet(0.5, 0.8) };
          if (toCall > 0 && (isModerate || drawInfo.hitChance >= potOdds - 0.10)) return { type: "call" };
          if (toCall > 0) return { type: "fold" };
          return { type: "check" };

        case "Rock":
          if (isStrong) {
            if (Math.random() < getNoisyThreshold(0.20, 0.10) && toCall === 0) return { type: "check" };
            return { type: "bet", amount: calculateBet() };
          }
          if (isModerate && toCall > 0 && potOdds < (0.28 + bluffCatchBonus)) return { type: "call" };
          if (toCall > 0 && drawInfo.hitChance >= (potOdds - bluffCatchBonus)) return { type: "call" };
          if (toCall > 0) return { type: "fold" };
          return { type: "check" };

        case "Station":
          if (isStrong) {
            if (toCall === 0 && Math.random() < getNoisyThreshold(0.30, 0.10)) return { type: "bet", amount: calculateBet() };
            return toCall > 0 ? { type: "call" } : { type: "check" };
          }
          if (toCall > 0 && (isModerate || drawInfo.hitChance >= potOdds - 0.20)) return { type: "call" };
          if (toCall > 0) return { type: "fold" };
          return { type: "check" };

        case "TAG":
        default:
          if (isStrong) return decideStrongAction();
          if (isModerate) {
            if (toCall === 0) return Math.random() < getNoisyThreshold(0.50, 0.10) ? { type: "bet", amount: calculateThinBet(0.3, 0.5) } : { type: "check" };
            if (toCall > 0 && potOdds < getNoisyThreshold(0.30 + bluffCatchBonus, 0.05)) return { type: "call" };
            return { type: "fold" };
          }
          if (toCall === 0 && Math.random() < bluffProb(getNoisyThreshold(0.20, 0.05))) return { type: "bet", amount: calculateThinBet(0.4, 0.6) };
          if (toCall > 0 && drawInfo.hitChance >= (potOdds - bluffCatchBonus)) return { type: "call" };
          if (toCall > 0) return { type: "fold" };
          return { type: "check" };
      }
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function buildNames(players) {
      const names = { user: "나" };
      players.forEach(p => { if (p !== "user") names[p] = `AI ${p.replace("ai", "")}`; });
      return names;
    }

    function makeDict(players, value) {
      const d = {};
      players.forEach(p => (d[p] = typeof value === "function" ? value(p) : value));
      return d;
    }

    // 💡 추가: 여러 핸드에 걸친 유저의 콜/폴드 판단 경향을 누적 집계하기 위한 빈 통계 객체
    function createEmptyUserStats() {
      return {
        handsPlayed: 0,
        totalActions: 0,
        totalScoreSum: 0,
        decisionPoints: 0, // toCall > 0 이라서 콜/폴드 갈림이 있었던 상황 수
        idealFold: 0,      // 그 중 '정답이 폴드'였던 상황 수
        idealCall: 0,      // 그 중 '정답이 콜'이었던 상황 수
        actualFold: 0,     // 실제로 폴드를 선택한 횟수
        actualCall: 0,     // 실제로 콜을 선택한 횟수
        foldCorrect: 0,    // 폴드를 선택했는데 정답도 폴드였던 횟수
        callCorrect: 0,    // 콜을 선택했는데 정답도 콜이었던 횟수
      };
    }

    function initialGame() {
      return {
        setupDone: false,
        startingChips: 10000, // 💡 수정: 바이인 프리셋 중 가장 낮은 값을 기본값으로
        bb: 100,            // 💡 수정: 빅블라인드 (기존 앤티를 대체)
        sb: 50,             // 💡 추가: 스몰블라인드 (BB의 절반)
        // 💡 수정: 블라인드 상승 사다리용 - 게임 시작 시의 BB(기준값)와 현재 레벨(0부터 시작)
        initialBB: 100,
        blindLevel: 0,
        // 💡 추가: 딜러 버튼 위치(players 배열 인덱스). 매 핸드 시계방향(다음 인덱스)으로 이동.
        // 액션 순서를 이 위치 기준으로 동적으로 계산하는 데 쓰인다(고정 순서였던 것을 대체).
        buttonIndex: 0,
        // 💡 수정: 기본값을 5로 - 지금은 AI 인원수가 1/5/8 중 하나로 고정 선택되는데, 예전 자유선택
        // (1~8명) 시절 기본값(6)이 그대로 남아있었다. 6명 AI = 총 7인은 세 선택지 중 어디에도 없고,
        // 포지션 이름표(2/6/9인용 테이블)도 지원 안 하는 어중간한 인원수라 그대로 두면 안 됐다.
        aiCount: 5,
        currentActor: null,
        players: [],
        names: {},
        aiPersonalities: {},
        started: false,
        over: false,
        phase: "idle",
        community: [],
        hole: {},
        chips: {},
        invested: {},
        folded: {},
        eliminated: {},
        allIn: {},
        roundBets: {},
        lastAction: {},
        streetActions: {}, // 💡 추가: 이번 스트리트 각 플레이어의 최종 액션(상대 반응 추적용)
        userActions: [],
        analysisResult: null,
        currentBet: 0,
        pot: 0,
        streetStartPot: 0, // 각 스트리트 시작 시점의 팟 크기 기억
        canRaise: {}, // 플레이어별 레이즈 권한 추적
        log: [],
        awaitingUser: false,
        toCallForUser: 0,
        handResult: null,
        handNum: 0,
        lastWinner: null,
        handWinners: {}, // 새로 추가: 승리자와 획득 금액을 기록하는 객체
        opponentRead: { betsFaced: 0, foldsToBet: 0, totalActions: 0, aggressiveActions: 0 },
        revealCards: false, //추가: 패 공개 여부 추적
        userStats: createEmptyUserStats(), // 💡 추가: 여러 핸드 누적 유저 성향 통계
        gameWon: false, // 💡 추가: 상대를 모두 파산시켜 완전 승리했는지 여부
        livePositionForUser: null, // 💡 추가: 연습모드 패널용 유저의 실시간 포지션(정확한 값)
        nextAiNumber: 1, // 💡 추가: 파산한 AI 자리에 새로 참가할 AI에게 부여할 다음 번호 (beginSetupGame에서 재설정됨)
      };
    }

    // 💡 새로 추가: opponentRead 누적치를 바탕으로 AI가 참고할 '유저 프로필'을 계산.
    // 표본이 너무 적으면(8핸드 미만) 아직 판단하지 않고 null 반환 → AI는 중립적으로 플레이.
    function getOpponentProfile(s) {
      const r = s.opponentRead;
      if (!r || r.totalActions < 10) return null; // 💡 액션 10번 이상부터 판단 시작
      return {
        foldToBetRate: r.betsFaced > 0 ? (r.foldsToBet / r.betsFaced) : 0.4,
        aggressionFreq: r.aggressiveActions / r.totalActions // 💡 공격성(베팅 빈도) 비율
      };
    }

    // 🪙 럭키 코인 피젯 컴포넌트 - 전략적 가치는 전혀 없는 순수 재미용 아이템.
    // 클릭할 때마다 동전이 튀어오르며(점프) 3D로 회전(스핀)해서 앞/뒷면이 바뀐다.
    function LuckyCoin({ isMutedSfx }) {
      const [rotation, setRotation] = useState(0);
      const [isFlipping, setIsFlipping] = useState(false);

      const toss = () => {
        if (isFlipping) return;
        setIsFlipping(true);

        // 💡 수정: 전용 코인 사운드(coin.mp3)가 추가되어 더 이상 베팅 사운드를 빌려쓰지 않음
        playSound('coin', false, isMutedSfx);

        // 랜덤 앞/뒷면 결정 (true: 앞면(♠), false: 뒷면(★))
        const landOnHeads = Math.random() > 0.5;

        // 기본 4바퀴(720도) 회전 + 결과에 맞춘 각도 보정
        const spins = 4;
        let nextRotation = rotation + (spins * 180);

        if (landOnHeads && (nextRotation % 360 !== 0)) {
          nextRotation += 180;
        } else if (!landOnHeads && (nextRotation % 360 === 0)) {
          nextRotation += 180;
        }

        setRotation(nextRotation);

        // 애니메이션 시간(0.8s)이 끝난 후 상태 초기화
        setTimeout(() => setIsFlipping(false), 800);
      };

      return (
        <div style={coinStyles.container} onClick={toss} title="행운의 코인 토스 (클릭)">
          {/* 그림자 */}
          <div
            style={coinStyles.shadow}
            className={isFlipping ? "shadow-shrinking" : ""}
          />

          {/* 점프(상하 이동)를 담당하는 래퍼 */}
          <div className={isFlipping ? "coin-jumping" : ""} style={coinStyles.jumpWrapper}>
