<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노 프리플랍 홀덤 (No-Preflop Texas Hold'em)</title>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone (JSX 변환용) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0f0c;
      font-family: 'Georgia', 'Noto Serif KR', serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(201, 164, 76, 0.4);
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const SUITS = ["♠", "♥", "♦", "♣"];
    const SUIT_COLOR = { "♠": "#181818", "♣": "#181818", "♥": "#c0392b", "♦": "#c0392b" };
    const RANK_LABEL = { 11: "J", 12: "Q", 13: "K", 14: "A" };

    const CAT_NAME = {
      0: "하이카드", 1: "원페어", 2: "투페어", 3: "트리플",
      4: "스트레이트", 5: "플러시", 6: "풀하우스", 7: "포카드", 8: "스트레이트 플러시",
    };


    //  --- 새로 추가할 사운드  ---
    const SOUND_URLS = {
      bgm: "./audio/bgm.mp3",
      shuffle: "./audio/card.mp3",
      bet: "./audio/call.mp3",
      call: "./audio/call.mp3",
      fold: "./audio/fold.mp3",
      win: "./audio/win.mp3",
      check: "./audio/check.mp3"
    };

    const audios = {};
    // 사운드 사전 로딩 및 볼륨 세팅
    Object.keys(SOUND_URLS).forEach(key => {
      audios[key] = new Audio(SOUND_URLS[key]);
      if (key === 'bgm') {
        audios[key].loop = true;
        audios[key].volume = 0.2; // BGM은 방해 안 되게 작게
      } else {
        audios[key].volume = 0.6;
      }
    });

    const playSound = (type, isMuted) => {
      if (isMuted || !audios[type]) return;
      if (type !== 'bgm') {
        // 효과음은 겹쳐서 재생될 수 있도록 복제해서 실행
        const sound = audios[type].cloneNode();
        sound.volume = audios[type].volume;
        sound.play().catch(e => console.log("사운드 재생 에러:", e));
      } else {
        audios[type].play().catch(e => console.log("BGM 에러:", e));
      }
    };

    const stopBGM = () => {
      if (audios.bgm) {
        audios.bgm.pause();
        audios.bgm.currentTime = 0;
      }
    };
    // ---------------------------------
    function getNoisyThreshold(base, variance) {
      const noise = (Math.random() * variance * 2) - variance;
      return Math.max(0, Math.min(1, base + noise));
    }

    function freshDeck() {
      const deck = [];
      for (const s of SUITS) for (let r = 2; r <= 14; r++) deck.push({ rank: r, suit: s });
      return deck;
    }

    function shuffle(deck) {
      const d = [...deck];
      for (let i = d.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [d[i], d[j]] = [d[j], d[i]];
      }
      return d;
    }

    function rankLabel(r) { return RANK_LABEL[r] || String(r); }

    function combinations(arr, k) {
      const res = [];
      const combo = [];
      function go(start) {
        if (combo.length === k) { res.push([...combo]); return; }
        for (let i = start; i < arr.length; i++) {
          combo.push(arr[i]);
          go(i + 1);
          combo.pop();
        }
      }
      go(0);
      return res;
    }

    function evaluate5(cards) {
      const ranks = cards.map(c => c.rank).sort((a, b) => b - a);
      const suits = cards.map(c => c.suit);
      const isFlush = suits.every(s => s === suits[0]);

      const countMap = {};
      ranks.forEach(r => (countMap[r] = (countMap[r] || 0) + 1));
      const groups = Object.entries(countMap)
        .map(([r, c]) => ({ rank: Number(r), count: c }))
        .sort((a, b) => (b.count - a.count) || (b.rank - a.rank));

      const uniqueRanksDesc = [...new Set(ranks)];
      let straightHigh = null;
      if (uniqueRanksDesc.length >= 5) {
        for (let i = 0; i <= uniqueRanksDesc.length - 5; i++) {
          const window = uniqueRanksDesc.slice(i, i + 5);
          if (window[0] - window[4] === 4) { straightHigh = window[0]; break; }
        }
      }
      if (straightHigh === null) {
        const wheel = [14, 5, 4, 3, 2];
        if (wheel.every(r => uniqueRanksDesc.includes(r))) straightHigh = 5;
      }
      const isStraight = straightHigh !== null;

      let cat, tiebreak;
      if (isStraight && isFlush) { cat = 8; tiebreak = [straightHigh]; }
      else if (groups[0].count === 4) {
        const kicker = ranks.find(r => r !== groups[0].rank);
        cat = 7; tiebreak = [groups[0].rank, kicker];
      } else if (groups[0].count === 3 && groups[1] && groups[1].count >= 2) {
        cat = 6; tiebreak = [groups[0].rank, groups[1].rank];
      } else if (isFlush) { cat = 5; tiebreak = [...ranks]; }
      else if (isStraight) { cat = 4; tiebreak = [straightHigh]; }
      else if (groups[0].count === 3) {
        const kickers = ranks.filter(r => r !== groups[0].rank).slice(0, 2);
        cat = 3; tiebreak = [groups[0].rank, ...kickers];
      } else if (groups[0].count === 2 && groups[1] && groups[1].count === 2) {
        const pairRanks = [groups[0].rank, groups[1].rank].sort((a, b) => b - a);
        const kicker = ranks.find(r => r !== pairRanks[0] && r !== pairRanks[1]);
        cat = 2; tiebreak = [...pairRanks, kicker];
      } else if (groups[0].count === 2) {
        const kickers = ranks.filter(r => r !== groups[0].rank).slice(0, 3);
        cat = 1; tiebreak = [groups[0].rank, ...kickers];
      } else { cat = 0; tiebreak = ranks.slice(0, 5); }

      return { cat, tiebreak, cards };
    }

    function compareScore(a, b) {
      if (a.cat !== b.cat) return a.cat - b.cat;
      for (let i = 0; i < Math.max(a.tiebreak.length, b.tiebreak.length); i++) {
        const x = a.tiebreak[i] || 0, y = b.tiebreak[i] || 0;
        if (x !== y) return x - y;
      }
      return 0;
    }

    function evaluateBest(cards) {
      if (cards.length <= 5) return evaluate5(cards);
      const combos = combinations(cards, 5);
      let best = null;
      for (const c of combos) {
        const ev = evaluate5(c);
        if (!best || compareScore(ev, best) > 0) best = ev;
      }
      return best;
    }

    function handLabel(ev) {
      if (ev.cat === 8 && ev.tiebreak[0] === 14) return "로열 스트레이트 플러시";
      return CAT_NAME[ev.cat];
    }

    function hasDrawPossibility(cards) {
      if (cards.length < 4) return false;

      const suitCounts = { "♠": 0, "♥": 0, "♦": 0, "♣": 0 };
      cards.forEach(c => suitCounts[c.suit]++);
      if (Object.values(suitCounts).some(count => count >= 4)) return true;

      const ranks = [...new Set(cards.map(c => c.rank))].sort((a, b) => a - b);
      for (let i = 0; i <= ranks.length - 4; i++) {
        if (ranks[i + 3] - ranks[i] === 3) return true;
      }
      if (ranks.includes(14) && ranks.includes(2) && ranks.includes(3) && ranks.includes(4)) return true;

      return false;
    }

    // 💡 수정: 홀카드와 커뮤니티 카드를 분리해서 받아 오버카드를 정확히 인식하게 합니다.
    function calculateDrawOuts(hole, community) {
      const cards = [...hole, ...community];
      if (community.length >= 5 || community.length === 0) {
        return { outs: 0, hitChance: 0, drawType: "리버(추가 카드 없음)" };
      }
      
      const currentEv = evaluateBest(cards);
      if (currentEv.cat >= 4) return { outs: 0, hitChance: 0, drawType: "메이드(완성)" };

      const seen = new Set(cards.map(c => `${c.rank}${c.suit}`));
      let deck = [];
      for (const s of SUITS) {
        for (let r = 2; r <= 14; r++) {
          if (!seen.has(`${r}${s}`)) deck.push({ rank: r, suit: s });
        }
      }

      let flushOuts = 0;
      let straightOuts = 0;
      let holeCardOuts = 0; // 💡 홀카드가 맞아 페어/셋으로 발전하는 아웃츠

      const myHoleRanks = hole.map(c => c.rank);

      for (const card of deck) {
        const testCards = [...cards, card];
        const ev = evaluateBest(testCards);
        
        // 플러시나 스트레이트로 발전하는 아웃츠
        if (ev.cat === 5 || ev.cat === 8) flushOuts++;
        else if (ev.cat === 4) straightOuts++;
        // 💡 핵심 추가: 내 홀카드와 맞아서 현재 상태보다 족보가 높아지는 아웃츠(오버카드, 페어->셋 등)
        else if (ev.cat > currentEv.cat && myHoleRanks.includes(card.rank)) {
          holeCardOuts++;
        }
      }

      const totalOuts = flushOuts + straightOuts + holeCardOuts;
      
      let drawType = "없음";
      if (flushOuts >= 9 && straightOuts > 0) drawType = "플러시 & 스트레이트 복합 드로우";
      else if (flushOuts >= 9) drawType = "플러시 드로우";
      else if (straightOuts >= 8) drawType = "양빵(오픈엔디드) 드로우";
      else if (straightOuts > 0) drawType = "빵꾸(거츠샷) 드로우";
      else if (holeCardOuts >= 6) drawType = "투 오버카드 (탑페어 드로우)";
      else if (holeCardOuts > 0) drawType = "페어/셋 발전 드로우";
      else if (totalOuts > 0) drawType = "마이너 드로우";

      // 💡 4/2 룰 폐기 -> 정확한 수학적 확률(Hypergeometric) 계산 도입
      const cardsLeft = 5 - community.length; // 플랍은 2장, 턴은 1장 남음
      const unseenCards = deck.length; // 남은 덱 장수 (47장 또는 46장)
      let hitChance = 0;

      if (cardsLeft === 1) {
        hitChance = totalOuts / unseenCards;
      } else if (cardsLeft === 2) {
        // 1 - (턴과 리버에서 모두 아웃츠가 안 뜰 확률)
        const miss1 = (unseenCards - totalOuts) / unseenCards;
        const miss2 = (unseenCards - 1 - totalOuts) / (unseenCards - 1);
        hitChance = 1 - (miss1 * miss2);
      }

      return { outs: totalOuts, hitChance, drawType };
    }

    function getRelativeStrength(ev, hole, community, toCall, pot) {
      if (!community || community.length === 0) {
        return {
          isStrong: ev.cat >= 2,
          isModerate: ev.cat === 1 && ev.tiebreak[0] >= 10,
          isWeak: ev.cat === 0 || (ev.cat === 1 && ev.tiebreak[0] < 10),
          isBoardHeavy: false
        };
      }

      const boardEv = evaluateBest(community);
      const holeIds = hole.map(c => `${c.rank}${c.suit}`);
      const usedHoleCards = ev.cards.filter(c => holeIds.includes(`${c.rank}${c.suit}`));

      let isStrong = false;
      let isModerate = false;
      let isWeak = false;
      let isBoardHeavy = false;

      // 1. 보드 위협도(Board Texture Danger) 분석
      const boardSuits = community.map(c => c.suit);
      const suitCounts = { "♠": 0, "♥": 0, "♦": 0, "♣": 0 };
      boardSuits.forEach(s => suitCounts[s]++);
      const maxSuitCount = Math.max(...Object.values(suitCounts));
      const isFlushDanger = maxSuitCount >= 3;

      const boardRanks = [...new Set(community.map(c => c.rank))].sort((a, b) => b - a);
      let isStraightDanger = boardEv.cat === 4;

      // 일반 스트레이트 위협
      for (let i = 0; i <= boardRanks.length - 3; i++) {
        if (boardRanks[i] - boardRanks[i + 2] <= 4) isStraightDanger = true;
      }

      // A를 1로 취급하는 휠(Wheel) 하단 스트레이트 위협 정밀 감지
      if (boardRanks.includes(14)) {
        const wheelRanks = [...boardRanks, 1].sort((a, b) => b - a);
        for (let i = 0; i <= wheelRanks.length - 3; i++) {
          if (wheelRanks[i] - wheelRanks[i + 2] <= 4) isStraightDanger = true;
        }
      }

      // 2. 패 강도 평가 분기
      if (usedHoleCards.length === 0) {
        isBoardHeavy = true;
        isWeak = true;
      }
      else if (ev.cat === boardEv.cat && ev.tiebreak[0] === boardEv.tiebreak[0]) {
        isBoardHeavy = true;
        const myKickers = usedHoleCards.map(c => c.rank);
        const myBestKicker = myKickers.length > 0 ? Math.max(...myKickers) : 0;

        if (boardEv.cat >= 3) {
          isWeak = true;
        } else if (boardEv.cat === 2) {
          if (myBestKicker >= 13 && !isFlushDanger && !isStraightDanger) {
            isModerate = true;
          } else {
            isWeak = true;
          }
        } else if (boardEv.cat === 1) {
          if (isFlushDanger || isStraightDanger) {
            isWeak = true;
          } else if (myBestKicker >= 12) {
            isModerate = true;
          } else {
            isWeak = true;
          }
        } else {
          // 💡 수정: 보드와 내 패가 모두 '하이카드'일 경우, 키커가 아무리 높아도 베팅 상황에서는 '약한 패(Weak)'입니다.
          isWeak = true;
          isModerate = false;
        }
      }
      else {
        if (ev.cat >= 6) {
          isStrong = true;
        } else if (ev.cat === 5) {
          if (maxSuitCount === 4 && Math.max(...usedHoleCards.map(c => c.rank)) < 11) {
            isModerate = true;
          } else {
            isStrong = true;
          }
        } else if (ev.cat === 4) {
          if (isFlushDanger) isModerate = true;
          else isStrong = true;
        } else if (ev.cat === 3) {
          if (maxSuitCount >= 4 || ((isFlushDanger || isStraightDanger) && community.length === 5)) {
            isModerate = true;
          } else {
            isStrong = true;
          }
        } else if (ev.cat === 2) {
          if (isFlushDanger || isStraightDanger || boardEv.cat === 1) isModerate = true;
          else isStrong = true;
        } else if (ev.cat === 1) {
          // 💡 [수정됨] 무조건 10 이상이 아니라 보드(Board) 랭크와 비교하여 탑/미들 페어를 인지합니다.
          const boardRanksDesc = [...new Set(community.map(c => c.rank))].sort((a, b) => b - a);
          const topBoardRank = boardRanksDesc[0] || 0;
          const secondBoardRank = boardRanksDesc[1] || 0;
          const myPairRank = ev.tiebreak[0];

          if (myPairRank >= topBoardRank) {
            if (isFlushDanger && community.length === 5) isWeak = true;
            else isModerate = true;
          } else if (myPairRank >= secondBoardRank) {
            if (isFlushDanger || isStraightDanger) isWeak = true;
            else isModerate = true; // 미들 페어도 쇼다운 밸류가 있으므로 Moderate에 편입 (퓨어 블러핑 취급 X)
          } else {
            isWeak = true; // 바텀 페어 및 이하는 여전히 Weak
          }
        } else {
          // 💡 [수정됨] 보드와 내 패가 모두 하이카드일 때 키커 오류 방지
          isWeak = true;
          isModerate = false;
        }
      }

      // 3. 팟 오즈(Pot Odds) 기반 상대적 압박감 적용
      const pressureOdds = toCall > 0 ? toCall / (pot + toCall) : 0;

      if (pressureOdds >= 0.33) {
        if (isModerate) {
          isModerate = false;
          isWeak = true;
        }
        if (isStrong && ev.cat <= 3 && usedHoleCards.length === 1 && Math.max(...hole.map(c => c.rank)) < 12) {
          isStrong = false;
          isModerate = true;
        }
      }

      return { isStrong, isModerate, isWeak, isBoardHeavy };
    }

    //최소 오프닝 베팅 계산 (25% 룰 및 100단위 CEIL)
    function calcMinOpeningBet(ante, streetStartPot) {
      const safePot = streetStartPot || 0; // 💡 방어 코드: 값이 없으면 0으로 계산하여 NaN 에러 방지
      const twentyFivePercent = Math.ceil((safePot * 0.25) / 100) * 100;
      return Math.max(ante * 2, twentyFivePercent);
    }

    function evaluateUserActions(actions, currentAnte) {
      if (!actions || actions.length === 0) return null;

      let totalScore = 0;
      let handHasBrilliant = false; // 💡 추가: 핸드 전체에서 한 번이라도 탁월함이 있었는지 추적
      const phaseResults = [];
      const phaseNames = { flop: "플랍", turn: "턴", river: "리버" };

      actions.forEach(act => {
        const { phase, type, investedAmount, ev, drawInfo, pot, toCall, opponentsCount, hole, community } = act;
        let score = 70;
        let comment = "판단 보류 (정보 부족)";

        const { isStrong, isModerate, isWeak, isBoardHeavy } = getRelativeStrength(ev, hole, community, toCall, pot);

        const potOdds = toCall > 0 ? toCall / (pot + toCall) : 0;
        const betRatio = investedAmount / (pot || 1);

        const { outs, hitChance, drawType } = drawInfo;
        const hasGoodDraw = outs >= 8;

        // 💡 [추천 플레이 계산] (수정됨: 패 강도에 따른 베팅 범위 추천)
        let recommended = "";

        // 팟 비율 기반 최소/최대 추천 베팅액 계산 (100단위 반올림)
        const calcBetRange = (minRatio, maxRatio) => {
          const minBet = Math.max(currentAnte * 5, Math.round((pot * minRatio) / 100) * 100);
          const maxBet = Math.max(currentAnte * 5, Math.round((pot * maxRatio) / 100) * 100);
          return minBet === maxBet ? `${minBet}` : `${minBet}~${maxBet}`;
        };

        const strongRange = calcBetRange(0.6, 1.0); // 밸류 베팅 범위
        const moderateRange = calcBetRange(0.3, 0.5); // 씬 밸류 / 블락벳 범위
        const bluffRange = calcBetRange(0.5, 0.8); // 블러핑 범위

        if (phase === "flop" || phase === "turn") {
          if (isStrong) recommended = toCall > 0 ? `레이즈 (${strongRange})` : `베팅 (${strongRange})`;
          else if (isModerate) {
            // 💡 [수정됨] 씬 밸류벳 추천 텍스트 추가 (AI와 잣대 통일)
            if (toCall === 0) recommended = "체크 (팟 컨트롤) 또는 베팅 (씬 밸류)";
            else recommended = (potOdds <= 0.25 || (hasGoodDraw && hitChance >= potOdds)) ? "콜" : "폴드";
          } else {
            // 💡 [수정됨] 빵꾸(outs >= 4)도 세미 블러핑 옵션으로 인정
            if (toCall === 0) recommended = outs >= 4 ? `베팅 (세미 블러프, ${bluffRange}) 또는 체크` : "체크";
            else recommended = (outs >= 4 && hitChance >= potOdds) ? "콜" : "폴드";
          }
        } else if (phase === "river") {
          if (isStrong) recommended = toCall > 0 ? `레이즈 (${strongRange})` : `베팅 (밸류 베팅, ${strongRange})`;
          else if (isModerate) recommended = toCall === 0 ? "체크" : (potOdds < 0.3 ? "콜 (블러프 캐치)" : "폴드");
          else recommended = toCall === 0 ? "체크" : "폴드";
        }

        // 💡 [기본 점수 및 코멘트 평가] (점수 롤백: 정석=85~100, 사소한실수=60~75, 치명적실수=20~40)
        if (phase === "flop" || phase === "turn") {
          if (type === "fold") {
            if (isWeak && outs < 4) {
              if (isBoardHeavy) { score = 95; comment = "보드에 공유 족보가 깔린 상황에서, 낮은 키커로 불필요한 출혈을 막는 완벽한 폴드입니다."; }
              else { score = 95; comment = "승산이 거의 없는 패로 깔끔하게 폴드했습니다. 기본에 충실한 방어입니다."; }
            } else if (isWeak && outs >= 4) {
              if (potOdds > hitChance) { score = 90; comment = `${drawType}(이)었지만, 콜 비용(오즈)이 역전 확률보다 높아 합리적으로 포기했습니다.`; }

        case "Maniac":
          if (isStrong) return { type: "bet", amount: calculateBet() };
          if (Math.random() < getNoisyThreshold(0.40, 0.15) * multiwayPenalty * exploitMultiplier) return { type: "bet", amount: calculateThinBet(0.5, 0.8) };
          if (toCall > 0 && (isModerate || drawInfo.hitChance >= potOdds - 0.10)) return { type: "call" };
          if (toCall > 0) return { type: "fold" };
          return { type: "check" };

        case "Rock":
          if (isStrong) {
            if (Math.random() < getNoisyThreshold(0.20, 0.10) && toCall === 0) return { type: "check" };
            return { type: "bet", amount: calculateBet() };
          }
          if (isModerate && toCall > 0 && potOdds < (0.28 + bluffCatchBonus)) return { type: "call" };
          if (toCall > 0 && drawInfo.hitChance >= (potOdds - bluffCatchBonus)) return { type: "call" };
          if (toCall > 0) return { type: "fold" };
          return { type: "check" };

        case "Station":
          if (isStrong) {
            if (toCall === 0 && Math.random() < getNoisyThreshold(0.30, 0.10)) return { type: "bet", amount: calculateBet() };
            return toCall > 0 ? { type: "call" } : { type: "check" };
          }
          if (toCall > 0 && (isModerate || drawInfo.hitChance >= potOdds - 0.20)) return { type: "call" };
          if (toCall > 0) return { type: "fold" };
          return { type: "check" };

        case "TAG":
        default:
          if (isStrong) return { type: "bet", amount: calculateBet() };
          if (isModerate) {
            if (toCall === 0) return Math.random() < getNoisyThreshold(0.50, 0.10) ? { type: "bet", amount: calculateThinBet(0.3, 0.5) } : { type: "check" };
            if (toCall > 0 && potOdds < getNoisyThreshold(0.30 + bluffCatchBonus, 0.05)) return { type: "call" };
            return { type: "fold" };
          }
          if (toCall === 0 && Math.random() < getNoisyThreshold(0.20, 0.05) * multiwayPenalty * exploitMultiplier) return { type: "bet", amount: calculateThinBet(0.4, 0.6) };
          if (toCall > 0 && drawInfo.hitChance >= (potOdds - bluffCatchBonus)) return { type: "call" };
          if (toCall > 0) return { type: "fold" };
          return { type: "check" };
      }
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));

    function buildNames(players) {
      const names = { user: "나" };
      players.forEach(p => { if (p !== "user") names[p] = `AI ${p.replace("ai", "")}`; });
      return names;
    }

    function makeDict(players, value) {
      const d = {};
      players.forEach(p => (d[p] = typeof value === "function" ? value(p) : value));
      return d;
    }

    function initialGame() {
      return {
        setupDone: false,
        startingChips: 25000, // 💡 새로 추가: 기본 시작 자금
        ante: 100,            // 💡 새로 추가: 기본 앤티
        aiCount: 6,
        currentActor: null,
        players: [],
        names: {},
        aiPersonalities: {},
        started: false,
        over: false,
        phase: "idle",
        community: [],
        hole: {},
        chips: {},
        invested: {},
        folded: {},
        eliminated: {},
        allIn: {},
        roundBets: {},
        lastAction: {},
        userActions: [],
        analysisResult: null,
        currentBet: 0,
        pot: 0,
        streetStartPot: 0, // 각 스트리트 시작 시점의 팟 크기 기억
        canRaise: {}, // 플레이어별 레이즈 권한 추적
        log: [],
        awaitingUser: false,
        toCallForUser: 0,
        handResult: null,
        handNum: 0,
        lastWinner: null,
        handWinners: {}, // 새로 추가: 승리자와 획득 금액을 기록하는 객체
        opponentRead: { betsFaced: 0, foldsToBet: 0, totalActions: 0, aggressiveActions: 0 },
        revealCards: false, //추가: 패 공개 여부 추적
      };
    }

    // 💡 새로 추가: opponentRead 누적치를 바탕으로 AI가 참고할 '유저 프로필'을 계산.
    // 표본이 너무 적으면(8핸드 미만) 아직 판단하지 않고 null 반환 → AI는 중립적으로 플레이.
    function getOpponentProfile(s) {
      const r = s.opponentRead;
      if (!r || r.totalActions < 10) return null; // 💡 액션 10번 이상부터 판단 시작
      return {
        foldToBetRate: r.betsFaced > 0 ? (r.foldsToBet / r.betsFaced) : 0.4,
        aggressionFreq: r.aggressiveActions / r.totalActions // 💡 공격성(베팅 빈도) 비율
      };
    }

    function NoPreflopHoldem() {
      const [game, setGame] = useState(initialGame());
      const [betAmount, setBetAmount] = useState(initialGame().ante * 5);
      const [isMuted, setIsMuted] = useState(false);
      const gameStateRef = useRef(game);
      const runningRef = useRef(false);
      const userResolveRef = useRef(null);
      const logEndRef = useRef(null);

      // [새로 추가] 게임이 시작되거나 음소거가 풀리면 BGM 재생
      useEffect(() => {
        if (game.setupDone && !isMuted) {
          playSound('bgm', isMuted);
        } else {
          stopBGM();
        }
      }, [game.setupDone, isMuted]);
      useEffect(() => { gameStateRef.current = game; }, [game]);
      useEffect(() => {
        if (logEndRef.current) logEndRef.current.scrollTop = logEndRef.current.scrollHeight;
      }, [game.log]);
      useEffect(() => {
        if (game.awaitingUser) {
          // 💡 내 턴이 올 때 오프닝/레이즈 여부에 따라 스피너 최소값 세팅
          const minOpening = calcMinOpeningBet(game.ante, game.streetStartPot);
          const uiMin = game.toCallForUser === 0 ? minOpening : (game.ante * 2);
          setBetAmount(uiMin);
        }
      }, [game.awaitingUser, game.toCallForUser, game.ante, game.streetStartPot]);
      // 💡 추가: 시작 자금이 변할 때, 앤티가 10% 상한선을 넘으면 자동으로 내림(FLOOR) 처리하여 교정
      useEffect(() => {
        if (!game.setupDone) {
          const maxA = Math.floor((game.startingChips * 0.1) / 100) * 100;
          if (game.ante > maxA) {
            setGame(g => ({ ...g, ante: Math.max(100, maxA) }));
          }
        }
      }, [game.startingChips, game.setupDone]);

      const pushLog = (s, text) => { s.log = [...s.log, text]; };

      const handleReset = () => {
        if (window.confirm("진행 중인 게임을 초기화하고 처음 화면으로 돌아가시겠습니까?")) {
          setGame(g => ({ ...initialGame(), aiCount: g.aiCount, ante: g.ante, startingChips: g.startingChips }));
          setBetAmount(initialGame().ante * 5);
          runningRef.current = false;
          if (userResolveRef.current) {
            userResolveRef.current({ type: "fold" });
            userResolveRef.current = null;
          }
        }
      };

      const getUserAction = (s, toCall) => {
        return new Promise(resolve => {
          userResolveRef.current = resolve;
          s.awaitingUser = true;
          s.toCallForUser = toCall;
          setGame({ ...s });
        });
      };

      const applyAction = (s, player, action) => {
        const name = s.names[player];
        const toCall = s.currentBet - s.roundBets[player];
        let raised = false;
        let isFullRaise = false; //추가: 정상 금액을 채운 레이즈인가?

        if (action.type === "fold") {
          playSound('fold', isMuted);
          s.folded[player] = true;
          s.lastAction[player] = "폴드";
          pushLog(s, `${name}: 폴드`);
        } else if (action.type === "check") {
          playSound('check', isMuted);
          s.lastAction[player] = "체크";
          pushLog(s, `${name}: 체크`);
        } else if (action.type === "call") {
          playSound('call', isMuted);
          const amt = Math.max(0, Math.min(toCall, s.chips[player]));
          s.chips[player] -= amt; s.pot += amt;
          s.roundBets[player] += amt; s.invested[player] += amt;
          if (s.chips[player] === 0) s.allIn[player] = true;
          s.lastAction[player] = amt === toCall ? `콜 ${amt}` : `콜 ${amt} (올인)`;
          pushLog(s, `${name}: 콜 (${amt})`);
        } else if (action.type === "bet") {
          playSound('bet', isMuted);

          // 오프닝 vs 레이즈에 따른 최소 요구치 계산
          const isOpening = s.currentBet === 0;
          const minIncrement = isOpening ? calcMinOpeningBet(s.ante, s.streetStartPot) : (s.ante * 2);

          let total = toCall + action.amount;
          total = Math.max(0, Math.min(total, s.chips[player]));

          //미달 올인 판별 (요구치 이상을 베팅했는가?)
          const actualIncrement = total - toCall;
          if (actualIncrement >= minIncrement) isFullRaise = true;

          s.chips[player] -= total; s.pot += total;
          s.roundBets[player] += total; s.invested[player] += total;
          if (s.chips[player] === 0) s.allIn[player] = true;

          if (s.roundBets[player] > s.currentBet) {
            s.currentBet = s.roundBets[player];
            raised = true;
          }
          const label = toCall > 0 ? "레이즈" : "베팅";
          s.lastAction[player] = `${label} ${total}`;
          pushLog(s, `${name}: ${label} (${total})`);
        }
        return { raised, isFullRaise }; // 두 개의 결과를 반환
      };

      const bettingRound = async s => {
        const players = s.players;
        s.currentBet = 0;
        s.canRaise = makeDict(players, true); //새 스트리트 시작 시 모두 권한 부활
        players.forEach(p => {
          s.roundBets[p] = 0;
          if (!s.folded[p]) s.lastAction[p] = "";
        });
        setGame({ ...s });
        await sleep(300);
        if (!gameStateRef.current.setupDone) return;

        let activePlayers = players.filter(p => !s.folded[p] && !s.allIn[p]);
        if (activePlayers.length <= 1) return;

        let queue = [...activePlayers];

        while (queue.length > 0) {
          const p = queue.shift();
          if (s.folded[p] || s.allIn[p]) continue;

          s.currentActor = p;
          setGame({ ...s });

          const toCall = s.currentBet - s.roundBets[p];
          let action;

          const currentCards = [...s.hole[p], ...s.community];
          const ev = evaluateBest(currentCards);
          // 💡 파라미터를 홀카드와 커뮤니티 카드로 분리해서 넘겨줍니다.
          const drawInfo = calculateDrawOuts(s.hole[p], s.community);
          // 💡 수정: if/else 양쪽(유저·AI)에서 모두 쓸 수 있도록 상단으로 이동, 기준도 p 본인 제외로 일반화
          const activeOpponentsCount = players.filter(opp => !s.folded[opp] && !s.eliminated[opp] && opp !== p).length;

          if (p === "user") {
            action = await getUserAction(s, toCall);
            if (!gameStateRef.current.setupDone) return;
            s.awaitingUser = false;

            let actualInvested = 0;
            if (action.type === "call") actualInvested = Math.max(0, Math.min(toCall, s.chips.user));
            else if (action.type === "bet") actualInvested = Math.max(1, Math.min(toCall + (action.amount || 0), s.chips.user));

            s.userActions.push({
              phase: s.phase,
              type: action.type,
              investedAmount: actualInvested,
              ev: ev,
              drawInfo: drawInfo,
              pot: s.pot,
              toCall: toCall,
              opponentsCount: activeOpponentsCount,
              hole: [...s.hole.user],
              community: [...s.community]
            });

            // 💡 추가: 유저의 전체 액션 횟수와 공격적 액션(베팅/레이즈) 카운트
            s.opponentRead.totalActions++;
            if (action.type === "bet") s.opponentRead.aggressiveActions++;

            if (toCall > 0) {
              s.opponentRead.betsFaced++;
              if (action.type === "fold") s.opponentRead.foldsToBet++;
            }

          } else {
            await sleep(650 + Math.random() * 500);
            if (!gameStateRef.current.setupDone) return;
            // 💡 유저가 이번 핸드에 아직 살아있을 때만 '유저 프로필'을 반영 (이미 폴드했으면 반영할 대상이 없으므로 중립)
            const opponentProfile = (!s.folded.user && !s.eliminated.user) ? getOpponentProfile(s) : null;
            action = decideAI(ev, toCall, s.chips[p], s.pot, s.aiPersonalities[p], drawInfo, s.hole[p], s.community, s.ante, s.streetStartPot, activeOpponentsCount, opponentProfile);
            if (action.type === "bet" && s.chips[p] <= toCall) action = { type: "call" };
          }

          if (action.type === "call" && toCall === 0) {
            action.type = "check";
          }

          const { raised, isFullRaise } = applyAction(s, p, action);
          s.canRaise[p] = false; // 💡 행동 완료 시 기본적으로 레이즈 권리 상실

          s.currentActor = null;
          setGame({ ...s });

          await sleep(450);
          if (!gameStateRef.current.setupDone) return;

          if (action.type === "fold") {
            const remaining = players.filter(q => !s.folded[q]);
            if (remaining.length === 1) return;
          }

          if (raised) {
            if (isFullRaise) {
              // 💡 풀 레이즈: 다른 플레이어들의 레이즈 권리 부활
              players.forEach(q => {
                if (q !== p && !s.folded[q] && !s.allIn[q]) s.canRaise[q] = true;
              });
            }

            const startIdx = players.indexOf(p);
            queue = [];
            for (let i = 1; i < players.length; i++) {
              const nextP = players[(startIdx + i) % players.length];
              if (!s.folded[nextP] && !s.allIn[nextP]) {
                // 💡 기획 8번 방어: 숏 올인일 경우 기존 금액을 덜 낸(충족 못한) 사람만 큐에 다시 넣음
                if (isFullRaise || s.roundBets[nextP] < s.currentBet) {
                  queue.push(nextP);
                }
              }
            }
          }
        } // while 문 종료
      };

      const finishByFold = async s => {
        const winner = s.players.find(p => !s.folded[p]);
        const isUserWinner = winner === "user"; // 💡 유저 승리 여부 저장

        if (isUserWinner) playSound('win', isMuted);
        s.handWinners = { [winner]: s.pot }; 
        s.chips[winner] += s.pot;
        pushLog(s, `${s.names[winner]} 승리! (모두 폴드, 팟 ${s.pot} 획득)`);

        s.phase = "foldwin";
        s.lastWinner = winner;
        s.handResult = { logs: [`전원 폴드 · 팟 ${s.pot.toLocaleString()} 획득 -> ${s.names[winner]}`], reason: "fold" };
        s.pot = 0;

        s.analysisResult = evaluateUserActions(s.userActions, s.ante);

        // 💡 추가: 유저가 졌거나 폴드했더라도 탁월한 플레이(Brilliant)를 했다면 win 사운드 보상 제공
        if (!isUserWinner && s.analysisResult && s.analysisResult.grade.includes("Brilliant")) {
          playSound('win', isMuted);
        }

        checkElimination(s);
        setGame({ ...s });
      };

      const finishByShowdown = async s => {
        let remainingInvestments = { ...s.invested };
        let activePlayers = s.players.filter(p => remainingInvestments[p] > 0);
        let pots = [];

        while (activePlayers.length > 0) {
          const contenders = activePlayers.filter(p => !s.folded[p]);

          if (contenders.length === 0) {
            const leftover = activePlayers.reduce((sum, p) => sum + remainingInvestments[p], 0);
            if (leftover > 0 && pots.length > 0) {
              pots[pots.length - 1].amount += leftover;
              activePlayers.forEach(p => { remainingInvestments[p] = 0; });
            }
            break;
          }

          const minBet = Math.min(...contenders.map(p => remainingInvestments[p]));
          let currentPotAmount = 0;
          let eligible = [...contenders];

          activePlayers.forEach(p => {
            const contribution = Math.min(remainingInvestments[p], minBet);
            currentPotAmount += contribution;
            remainingInvestments[p] -= contribution;
          });

          if (currentPotAmount > 0) pots.push({ amount: currentPotAmount, eligible });
          activePlayers = activePlayers.filter(p => remainingInvestments[p] > 0);
        }

        s.phase = "showdown";
        let resultLogs = [];
        let allWinners = new Set();

        pots.forEach((pot, index) => {
          const evals = pot.eligible.map(p => ({
            player: p,
            ev: evaluateBest([...s.hole[p], ...s.community]),
          }));

          let best = evals[0];
          for (const e of evals) if (compareScore(e.ev, best.ev) > 0) best = e;
          const winners = evals.filter(e => compareScore(e.ev, best.ev) === 0).map(e => e.player);

          // 💡 100 칩 단위(최소 단위)로 분할 계산
          const chipUnit = 100;
          const totalUnits = Math.floor(pot.amount / chipUnit);
          const shareUnits = Math.floor(totalUnits / winners.length);
          let remainderUnits = totalUnits % winners.length;

          const share = shareUnits * chipUnit;

          const sortedWinners = [...winners].sort((a, b) => s.players.indexOf(a) - s.players.indexOf(b));

          sortedWinners.forEach(w => {
            let extra = 0;
            if (remainderUnits > 0) {
              extra = chipUnit; // 남은 짜투리 칩(100)을 할당
              remainderUnits -= 1;
            }
            const totalWon = share + extra;
            s.chips[w] += totalWon;
            allWinners.add(w);
            s.handWinners[w] = (s.handWinners[w] || 0) + totalWon;
          });

          const potLabel = pots.length > 1 ? (index === 0 ? "메인 팟" : `사이드 팟 #${index}`) : "팟";
          const winnerNames = winners.map(w => s.names[w]).join(" & ");
          const handName = handLabel(evals.find(e => e.player === winners[0]).ev);
          // 💡 수정됨: 선언되지 않은 remainder 대신 직접 나머지 계산
          const hasRemainder = (totalUnits % winners.length) > 0;
          resultLogs.push(`[${potLabel} ${pot.amount.toLocaleString()}] ${winnerNames} 승리 (${handName})`);
          pushLog(s, `${potLabel} 분배: ${winnerNames} (+${share}${hasRemainder ? ' 및 칩 보정' : ''})`);
        });

        const isUserWinner = allWinners.has("user"); // 💡 유저 승리 여부 저장

        if (isUserWinner) playSound('win', isMuted);
        s.lastWinner = Array.from(allWinners)[0];
        s.handResult = { logs: resultLogs, reason: "showdown" };
        s.pot = 0;

        s.analysisResult = evaluateUserActions(s.userActions, s.ante); // 기존 누락되어 있던 s.ante 파라미터도 함께 픽스
        
        // 💡 추가: 유저가 쇼다운에서 패배했더라도 탁월한 플레이를 했다면 사운드 재생
        if (!isUserWinner && s.analysisResult && s.analysisResult.grade.includes("Brilliant")) {
          playSound('win', isMuted);
        }

        checkElimination(s);
        setGame({ ...s });
      };

      const checkElimination = s => {
        s.players.forEach(p => { if (s.chips[p] <= 0) s.eliminated[p] = true; });
        if (s.eliminated.user) s.over = true;
      };

      const beginSetupGame = () => {
        setGame(g => {
          const baseIds = ["user", ...Array.from({ length: g.aiCount }, (_, i) => `ai${i + 1}`)];
          const players = baseIds;
          const names = buildNames(players);

          const aiPersonalities = {};
          players.forEach(p => {
            if (p !== "user") {
              const rand = Math.random();
              if (rand < 0.1) aiPersonalities[p] = "Maniac";
              else if (rand < 0.2) aiPersonalities[p] = "Station";
              else if (rand < 0.6) aiPersonalities[p] = "TAG";
              else aiPersonalities[p] = "Rock";
            }
          });

          return {
            ...initialGame(),
            setupDone: true,
            aiCount: g.aiCount,
            ante: g.ante,                   // 💡 추가: 사용자가 설정한 앤티 유지
            startingChips: g.startingChips, // 💡 추가: 사용자가 설정한 시작 자금 유지
            players,
            names,
            aiPersonalities,
            chips: makeDict(players, g.startingChips),
            invested: makeDict(players, 0),
            folded: makeDict(players, false),
            eliminated: makeDict(players, false),
            allIn: makeDict(players, false),
            roundBets: makeDict(players, 0),
            lastAction: makeDict(players, ""),
            log: [`첫 베팅 순서: ${players.map(p => names[p]).join(" → ")}`],
          };
        });
      };

      const playHand = async () => {
        if (runningRef.current) return;
        runningRef.current = true;
        let s = { ...gameStateRef.current };

        if (s.lastWinner && s.players.includes(s.lastWinner)) {
          const wIdx = s.players.indexOf(s.lastWinner);
          s.players = [...s.players.slice(wIdx), ...s.players.slice(0, wIdx)];
        }

        s.handWinners = {}; // 💡 새로 추가: 매 핸드마다 승리 기록 초기화
        const players = s.players;
        s.log = [...s.log];
        s.handNum += 1;
        s.deck = shuffle(freshDeck());
        playSound('shuffle', isMuted);
        s.community = [];
        s.hole = {};
        s.folded = makeDict(players, false);
        s.allIn = makeDict(players, false);
        s.lastAction = makeDict(players, "");
        s.roundBets = makeDict(players, 0);
        s.invested = makeDict(players, 0);
        s.pot = 0;
        s.currentBet = 0;
        s.handResult = null;
        s.userActions = [];
        s.analysisResult = null;
        s.revealCards = false;
        s.started = true;

        players.forEach(p => { if (s.eliminated[p]) s.folded[p] = true; });

        pushLog(s, `── ${s.handNum}번째 핸드 시작 ──`);
        pushLog(s, `베팅 순서: ${players.filter(p => !s.eliminated[p]).map(p => s.names[p]).join(" → ")}`);

        players.forEach(p => {
          if (s.eliminated[p]) return;
          const a = Math.min(s.ante, s.chips[p]);
          s.chips[p] -= a; s.pot += a; s.invested[p] += a;
          if (s.chips[p] === 0) s.allIn[p] = true; //
        });
        pushLog(s, `각자 앤티 ${s.ante} 납부 (팟 ${s.pot})`);
        s.streetStartPot = s.pot; // 💡 추가: 플랍 시작 팟 저장
        s.community.push(s.deck.pop(), s.deck.pop(), s.deck.pop());
        players.forEach(p => { s.hole[p] = [s.deck.pop(), s.deck.pop()]; });
        s.phase = "flop";
        pushLog(s, `플랍 공개, 홀카드 분배 완료`);
        setGame({ ...s });
        await sleep(600);
        if (!gameStateRef.current.setupDone) return;

        await bettingRound(s);
        if (!gameStateRef.current.setupDone) return;
        if (players.filter(p => !s.folded[p]).length === 1) { await finishByFold(s); runningRef.current = false; return; }

        s.phase = "turn"; s.community.push(s.deck.pop());
        s.streetStartPot = s.pot; // 💡 추가: 턴 시작 팟 저장
        pushLog(s, `턴 카드 공개`);
        setGame({ ...s }); await sleep(600);
        if (!gameStateRef.current.setupDone) return;
        await bettingRound(s);
        if (!gameStateRef.current.setupDone) return;
        if (players.filter(p => !s.folded[p]).length === 1) { await finishByFold(s); runningRef.current = false; return; }

        s.phase = "river"; s.community.push(s.deck.pop());
        s.streetStartPot = s.pot; // 💡 추가: 리버 시작 팟 저장
        pushLog(s, `리버 카드 공개`);
        setGame({ ...s }); await sleep(600);
        if (!gameStateRef.current.setupDone) return;
        await bettingRound(s);
        if (!gameStateRef.current.setupDone) return;
        if (players.filter(p => !s.folded[p]).length === 1) { await finishByFold(s); runningRef.current = false; return; }

        await finishByShowdown(s);
        runningRef.current = false;
      };

      const onUserAction = type => {
        if (!game.awaitingUser || !userResolveRef.current) return;
        userResolveRef.current({ type });
        userResolveRef.current = null;
      };
      const onUserBet = amount => {
        if (!game.awaitingUser || !userResolveRef.current) return;
        userResolveRef.current({ type: "bet", amount });
        userResolveRef.current = null;
      };

      const toCall = game.toCallForUser || 0;
      const userChips = game.chips.user || 0;
      const userCanRaise = game.canRaise ? game.canRaise.user : true; // 권한 확인

      const minOpeningBet = calcMinOpeningBet(game.ante, game.streetStartPot);
      const strictUiMin = toCall === 0 ? minOpeningBet : (game.ante * 2);
      // 잔여 스택이 최소치보다 적으면 잔액 전액 올인 허용
      const uiMinBet = Math.min(strictUiMin, Math.max(0, userChips - toCall));
      const maxBet = Math.max(uiMinBet, userChips - toCall);

      const aiSeats = game.players.filter(p => p !== "user");
      const isUserCurrent = game.currentActor === "user"; //

      if (!game.setupDone) {
        //(앤티는 시작 자금의 10% 상한, 100 단위 내림)
        const maxAnte = Math.floor((game.startingChips * 0.1) / 100) * 100;
        return (
          <div style={styles.page}>
            <div style={styles.feltGlow} />
            <div style={styles.setupWrap}>
              <div style={styles.eyebrow}>NO-PREFLOP · LOCAL RULES</div>
              <h1 style={styles.title}>노 프리플랍 홀덤</h1>
              <p style={styles.setupDesc}>프리플랍 없이 플랍부터 바로 시작하는 로컬 룰 홀덤입니다.<br />상대할 AI 인원수와 기초 자금, 게임비-앤티-를 선택하세요.</p>
              <div style={styles.aiCountControlWrap}>
                <button
                  style={styles.aiStepBtn}
                  disabled={game.aiCount <= 1}
                  onClick={() => setGame(g => ({ ...g, aiCount: Math.max(1, g.aiCount - 1) }))}
                >
                  −
                </button>
                <div style={styles.aiCountDisplay}>
                  AI <span style={styles.aiCountHighlight}>{game.aiCount}</span> 명
                </div>
                <button
                  style={styles.aiStepBtn}
                  disabled={game.aiCount >= 8}
                  onClick={() => setGame(g => ({ ...g, aiCount: Math.min(8, g.aiCount + 1) }))}
                >
                  +
                </button>
              </div>

              {/* 💡 1. 시작 자금 설정 박스 (10k, Min, Max 추가 / 최대 100만) */}
              <div style={styles.setupItemWrap}>
                <div style={styles.setupItemTitle}>시작 자금</div>
                <div style={styles.setupControlRow}>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, startingChips: 1000 }))}>Min</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, startingChips: Math.max(1000, g.startingChips - 10000) }))}>-10k</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, startingChips: Math.max(1000, g.startingChips - 1000) }))}>-1k</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, startingChips: Math.max(1000, g.startingChips - 500) }))}>-500</button>

                  <div style={styles.setupValueDisplay}>{game.startingChips.toLocaleString()}</div>

                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, startingChips: Math.min(100000, g.startingChips + 500) }))}>+500</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, startingChips: Math.min(100000, g.startingChips + 1000) }))}>+1k</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, startingChips: Math.min(100000, g.startingChips + 10000) }))}>+10k</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, startingChips: 100000 }))}>Max</button>
                </div>
              </div>

              {/* 💡 2. 앤티 설정 박스 (Min, Max 추가 / 최대 1만) */}
              <div style={styles.setupItemWrap}>
                <div style={styles.setupItemTitle}>기본 앤티</div>
                <div style={styles.setupControlRow}>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, ante: 100 }))}>Min</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, ante: Math.max(100, g.ante - 1000) }))}>-1k</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, ante: Math.max(100, g.ante - 100) }))}>-100</button>

                  <div style={styles.setupValueDisplay}>{game.ante.toLocaleString()}</div>

                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, ante: Math.min(maxAnte, g.ante + 100) }))}>+100</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, ante: Math.min(maxAnte, g.ante + 1000) }))}>+1k</button>
                  <button style={styles.setupStepBtn} onClick={() => setGame(g => ({ ...g, ante: maxAnte }))}>Max</button>
                </div>
              </div>

              <button style={{ ...styles.primaryBtn, marginTop: 12 }} onClick={beginSetupGame}>게임 시작</button>
            </div>
          </div>
        );
      }

      return (
        <div style={styles.page}>
          <div style={styles.feltGlow} />
          <div style={styles.container}>
            <header style={styles.header}>
              <div>
                <div style={styles.eyebrow}>NO-PREFLOP · LOCAL RULES</div>
                <h1 style={styles.title}>노 프리플랍 홀덤</h1>
              </div>
              <div style={styles.headerRight}>
                <div style={styles.handBadge}>
                  {game.handNum > 0 ? `HAND #${game.handNum}` : "대기 중"}
                </div>
                <button style={styles.resetBtn} onClick={() => setIsMuted(!isMuted)}>
                  {isMuted ? "🔇 사운드 끄기" : "🔊 사운드 켜기"}
                </button>
                <button style={styles.resetBtn} onClick={handleReset}>초기화</button>
              </div>
            </header>

            <div style={styles.body}>
              <div style={styles.tableWrap}>
                <div style={styles.table}>
                  <div style={styles.aiRow}>
                    {aiSeats.map(p => (
                      <AiSeat key={p} id={p} game={game} />
                    ))}
                  </div>

                  <div style={styles.centerArea}>
                    <div style={styles.potWrap}>
                      <span style={styles.potLabel}>POT</span>
                      <span style={styles.potValue}>{game.pot.toLocaleString()}</span>
                    </div>
                    <div style={styles.communityRow}>
                      {[0, 1, 2, 3, 4].map(i => (
                        <CardView key={i} card={game.community[i]} placeholder />
                      ))}
                    </div>
                    <div style={styles.phaseLabel}>
                      {game.phase === "idle" && "게임을 시작하세요"}
                      {game.phase === "flop" && "FLOP 베팅"}
                      {game.phase === "turn" && "TURN 베팅"}
                      {game.phase === "river" && "RIVER 베팅"}
                      {(game.phase === "showdown" || game.phase === "foldwin") && "핸드 종료"}
                    </div>
                  </div>

                  <div style={styles.userRow}>
                    {/* 💡 나(User)의 승리 확인 및 하이라이트 처리 */}
                    {(() => {
                      const winAmountUser = game.handWinners ? (game.handWinners['user'] || 0) : 0;
                      const isUserWinner = winAmountUser > 0 && (game.phase === "showdown" || game.phase === "foldwin");

                      return (
                        <div style={{
                          ...styles.userInfo,
                          ...(isUserCurrent ? styles.activeActor : {}),
                          ...(isUserWinner ? styles.winnerGlow : {}), // 황금빛 테두리 효과
                          position: "relative" // 배지 위치를 잡기 위해 추가
                        }}>
                          {/* 💡 플레이어 승리 배지 (박스 상단 중앙) */}
                          {isUserWinner && (
                            <div style={{ ...styles.winBadge, top: -14, left: "50%", transform: "translateX(-50%)" }}>
                              +{winAmountUser.toLocaleString()}
                            </div>
                          )}
                          <div style={styles.seatName}>나 (User)</div>
                          <div style={styles.seatChips}>칩 {userChips.toLocaleString()}</div>
                          {game.lastAction.user && !game.awaitingUser && !isUserWinner && (
                            <div style={styles.actionBadge}>{game.lastAction.user}</div>
                          )}
                          {game.eliminated.user && <div style={styles.badBadge}>탈락</div>}
                        </div>
                      );
                    })()}
                    <div style={styles.userCards}>
                      {(game.hole.user || [undefined, undefined]).map((c, i) => (
                        <CardView key={i} card={c} big />
                      ))}
                    </div>
                  </div>
                </div>

                <div style={styles.actionPanel}>
                  {!game.started && !game.over && (
                    <button style={styles.primaryBtn} onClick={playHand}>첫 핸드 시작</button>
                  )}

                  {game.started && (game.phase === "showdown" || game.phase === "foldwin") && !game.over && (
                    <div style={styles.resultWrap}>
                      <ResultBanner game={game} />
                      
                      {/* 💡 추가: 전원 폴드로 끝났고 아직 패를 공개하지 않았다면 버튼 표시 */}
                      {game.phase === "foldwin" && !game.revealCards && (
                        <button 
                          style={{ ...styles.analysisBtn, marginTop: 12 }} 
                          onClick={() => setGame(g => ({ ...g, revealCards: true }))}
                        >
                          👀 상대 패 확인하기
                        </button>
                      )}
                      
                      <button style={{ ...styles.primaryBtn, marginTop: 16 }} onClick={playHand}>다음 핸드</button>
                    </div>
                  )}

                  {game.over && (
                    <div style={styles.resultWrap}>
                      <div style={styles.gameOverText}>게임 오버 — 칩을 모두 잃었습니다</div>
                      {/* 💡 수정: 마지막 핸드의 분석 결과가 있다면 피드백을 보여줌 */}
                      {game.analysisResult && <ResultBanner game={game} />}
                      
                      {/* 💡 추가: 게임 오버 상태에서도 덮여있는 AI의 패를 깔 수 있도록 버튼 삽입 */}
                      {!game.revealCards && (
                        <button 
                          style={{ ...styles.analysisBtn, marginTop: 12, marginBottom: 4 }} 
                          onClick={() => setGame(g => ({ ...g, revealCards: true }))}
                        >
                          👀 숨겨진 패 확인하기
                        </button>
                      )}

                      <button style={{ ...styles.primaryBtn, marginTop: 16 }} onClick={handleReset}>처음 화면으로</button>
                    </div>
                  )}

                  {game.started && (game.phase === "flop" || game.phase === "turn" || game.phase === "river") && (
                    <div style={styles.actionsGrid}>
                      <div style={styles.actionInfo}>
                        {game.awaitingUser
                          ? toCall > 0 ? (userCanRaise ? `콜 금액: ${toCall}` : `콜 금액: ${toCall} (미달 올인으로 레이즈 불가)`) : "체크 가능"
                          : "다른 플레이어 대기 중..."}
                      </div>

                      {/* 💡 새로운 세로형 칩 컨트롤 UI */}
                      <div style={styles.betControlWrap}>
                        <div style={styles.betAmountDisplay}>
                          <span style={styles.betAmountLabel}>{toCall > 0 ? "레이즈(추가) 금액" : "베팅 금액"}</span>
                          <span style={styles.betAmountValue}>{betAmount.toLocaleString()}</span>
                          {/* 💡 추가: 레이즈 상황일 때 아래에 총 지불 금액 표시 */}
                          {toCall > 0 && (
                            <span style={{ fontSize: 13, color: "#D9B95C", marginTop: 6, fontWeight: 700, fontFamily: "'Courier New', monospace" }}>
                              총 지불: {(toCall + betAmount).toLocaleString()}
                            </span>
                          )}
                        </div>

                        <div style={styles.chipColumnsWrap}>
                          {[100, 500, 1000, 10000].map(chip => (
                            <div key={chip} style={styles.chipColumn}>
                              <button
                                style={styles.chipBtn}
                                disabled={!game.awaitingUser || betAmount >= maxBet}
                                onClick={() => setBetAmount(a => Math.min(maxBet, a + chip))}
                              >
                                +
                              </button>
                              <div style={styles.chipLabel}>{chip}</div>
                              <button
                                style={styles.chipBtn}
                                disabled={!game.awaitingUser || betAmount <= uiMinBet}
                                onClick={() => setBetAmount(a => Math.max(uiMinBet, a - chip))}
                              >
                                −
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div style={styles.actionButtons}>
                        <button
                          style={{ ...styles.actionBtn, ...styles.foldBtn }}
                          disabled={!game.awaitingUser}
                          onClick={() => onUserAction("fold")}
                        >
                          폴드
                        </button>
                        <button
                          style={{ ...styles.actionBtn, ...styles.checkBtn }}
                          disabled={!game.awaitingUser}
                          onClick={() => onUserAction(toCall > 0 ? "call" : "check")}
                        >
                          {toCall > 0
                            ? (userChips <= toCall ? `올인 콜 (${userChips.toLocaleString()})` : `콜 (${toCall.toLocaleString()})`)
                            : "체크"}
                        </button>
                        <button
                          style={{ ...styles.actionBtn, ...styles.betBtn }}
                          disabled={!game.awaitingUser || !userCanRaise || userChips <= toCall}
                          onClick={() => onUserBet(betAmount)}
                        >
                          {toCall > 0 ? `레이즈 (총 ${(toCall + betAmount).toLocaleString()})` : `베팅 ${betAmount.toLocaleString()}`}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <aside style={styles.logPanel}>
                <div style={styles.logTitle}>진행 기록</div>
                <div style={styles.logBody} ref={logEndRef}>
                  {game.log.map((l, i) => (
                    <div key={i} style={styles.logLine}>{l}</div>
                  ))}
                  {game.log.length === 0 && <div style={styles.logEmpty}>기록이 여기에 표시됩니다.</div>}
                </div>
              </aside>
            </div>
          </div>
        </div>
      );
    }
    function AiSeat({ id, game }) {
      const folded = game.folded[id];
      const eliminated = game.eliminated[id];
      const showCards = (game.phase === "showdown" && !folded) || game.revealCards;
      const hole = game.hole[id];
      const isCurrent = game.currentActor === id;

      // 💡 승리자 여부 및 획득 금액 확인 로직
      const winAmount = game.handWinners ? (game.handWinners[id] || 0) : 0;
      const isWinner = winAmount > 0 && (game.phase === "showdown" || game.phase === "foldwin");

      return (
        <div style={{
          ...styles.aiSeat,
          opacity: eliminated ? 0.35 : folded ? 0.55 : 1,
          ...(isCurrent ? styles.activeActor : {}),
          ...(isWinner ? styles.winnerGlow : {}), // 황금빛 테두리 효과
          position: "relative" // 배지 위치를 잡기 위해 추가
        }}>
          {/* 💡 AI 승리 배지 (박스 하단 중앙) */}
          {isWinner && (
            <div style={{ ...styles.winBadge, bottom: -14, left: "50%", transform: "translateX(-50%)" }}>
              +{winAmount.toLocaleString()}
            </div>
          )}

          <div style={styles.seatName}>{game.names[id]}</div>
          <div style={styles.seatChips}>칩 {(game.chips[id] || 0).toLocaleString()}</div>
          <div style={styles.aiCards}>
            {hole ? hole.map((c, i) => (
              <CardView key={i} card={showCards ? c : undefined} back={!showCards} small />
            )) : (
              <>
                <CardView back small />
                <CardView back small />
              </>
            )}
          </div>
          {folded && !isWinner && <div style={styles.badBadge}>폴드</div>}
          {eliminated && <div style={styles.badBadge}>탈락</div>}
          {!folded && !eliminated && !isWinner && game.lastAction[id] && (
            <div style={styles.actionBadge}>{game.lastAction[id]}</div>
          )}
        </div>
      );
    }

    function CardView({ card, back, placeholder, big, small }) {
      const size = big ? styles.cardBig : small ? styles.cardSmall : styles.cardMid;
      if (back) {
        return <div style={{ ...styles.cardBase, ...size, ...styles.cardBack }}><div style={styles.cardBackPattern} /></div>;
      }
      if (!card) {
        return <div style={{ ...styles.cardBase, ...size, ...styles.cardPlaceholder }} />;
      }
      const color = SUIT_COLOR[card.suit];
      return (
        <div style={{ ...styles.cardBase, ...size, ...styles.cardFace }}>
          <span style={{ ...styles.cardRank, color }}>{rankLabel(card.rank)}</span>
          <span style={{ ...styles.cardSuit, color }}>{card.suit}</span>
        </div>
      );
    }

    function ResultBanner({ game }) {
      const [showAnalysis, setShowAnalysis] = useState(false);
      const r = game.handResult;
      const ar = game.analysisResult;

      useEffect(() => {
        setShowAnalysis(false);
      }, [game.handNum]);

      if (!r) return null;

      return (
        <div style={styles.resultBanner}>
          <div style={styles.resultWinner}>라운드 결과</div>
          {r.logs.map((log, i) => (
            <div key={i} style={styles.resultSub}>{log}</div>
          ))}

          {ar && ar.phaseResults.length > 0 && (
            <div style={styles.analysisWrap}>
              <button
                style={styles.analysisBtn}
                onClick={() => setShowAnalysis(!showAnalysis)}
              >
                {showAnalysis ? "분석 숨기기" : "내 플레이 분석 보기"}
              </button>

              {showAnalysis && (
                <div style={styles.analysisBox}>
                  <div style={styles.analysisHeader}>
                    이번 핸드 평가: {ar.avgScore}점 ({ar.grade})
                  </div>
                  <div style={styles.analysisBody}>
                    {ar.phaseResults.map((pr, i) => (
                      <div key={i} style={styles.analysisPhaseRow}>
                        <div style={styles.phaseHeader}>
                          <span style={styles.phaseTag}>{pr.phase}</span>
                          <span style={styles.phaseScore}>{pr.score}점</span>
                        </div>
                        <p style={styles.phaseComment}>{pr.comment}</p>

                        <div style={{ marginTop: 6, fontSize: 13, color: "#8FAE9C", fontFamily: "'Courier New', monospace" }}>
                          💡 정석 플레이 추천: {pr.recommended}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const styles = {
      activeActor: {
        boxShadow: "0 0 18px 4px rgba(201,164,76,0.65)",
        borderColor: "#D9B95C",
        background: "rgba(201,164,76,0.15)",
        transform: "translateY(-4px)",
        transition: "all 0.2s ease-in-out"
      },
      setupItemWrap: {
        background: "rgba(0,0,0,0.2)", borderRadius: 12, padding: "14px 20px",
        marginBottom: 16, display: "flex", flexDirection: "column", gap: 10,
        border: "1px solid rgba(201,164,76,0.15)"
      },
      setupItemTitle: { fontSize: 13, color: "#8FAE9C", fontFamily: "'Courier New', monospace", letterSpacing: 1 },
      setupControlRow: {
        display: "flex", alignItems: "center", justifyContent: "center", gap: 6, flexWrap: "wrap"
      },
      setupStepBtn: {
        padding: "6px 8px", borderRadius: 6, border: "1px solid rgba(201,164,76,0.4)",
        background: "rgba(255,255,255,0.06)", color: "#F4EDD8", fontSize: 12, fontWeight: 700,
        cursor: "pointer", fontFamily: "'Courier New', monospace", transition: "all 0.1s"
